*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',system-ui,sans-serif;
  margin:0; padding:0 16px; padding-block:20px 32px; line-height:1.45}

.switch{display:flex; gap:8px 18px; flex-wrap:wrap; align-items:center}
.grupa{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.grupa .gnaz{font:600 .74rem 'IBM Plex Sans',sans-serif; display:flex; align-items:center; gap:6px; color:var(--mk)}
.grupa .gnaz::before{content:''; width:10px; height:10px; border-radius:3px; background:var(--mk)}
.grupa .pill{border-color:var(--mk); color:var(--mk); box-shadow:none}

th.sel{box-shadow:inset 0 -3px 0 var(--mk,var(--accent))}

th.sel{color:var(--mk,var(--ink))}
.pill{background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 14px;
  font:500 .8rem 'IBM Plex Mono',monospace; color:var(--ink-dim); cursor:pointer; box-shadow:var(--shadow)}
.pill[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.pill:focus-visible,.chip:focus-visible,.review-item:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

section.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px 16px; flex-wrap:wrap; padding:14px 16px 0}
.sec-head h2{font-size:1.05rem}
.sec-head span{font-size:.78rem; color:var(--ink-dim)}

.table-wrap{overflow-x:auto; padding:10px 6px 6px}
table{border-collapse:collapse; width:100%; font-size:.85rem; font-variant-numeric:tabular-nums}

td.num{font-family:'IBM Plex Mono',monospace; white-space:nowrap}
td.num b{font-family:'IBM Plex Sans',sans-serif}
td.num a{color:var(--accent)}
td.num span b{font-family:'IBM Plex Mono',monospace}
td.lead{font-weight:500}
td small{display:block; color:var(--ink-faint); font-size:.72rem; font-family:'IBM Plex Sans',sans-serif; white-space:normal}
th.sel,td.sel{background:var(--surface-2)}
tr.key td.lead{font-weight:600}
.best{color:var(--good); font-weight:600}
.bar{display:inline-block; height:6px; border-radius:3px; background:var(--good); vertical-align:middle; margin-left:6px}

.graph-card{position:relative; height:min(640px,78vh); min-height:420px; overflow:hidden}
#net{position:absolute; inset:0}
.panel{position:absolute; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); z-index:5}
#legend{top:12px; left:12px; padding:10px 12px; font-size:.78rem; max-width:240px}
#legend h3{font:600 .68rem 'IBM Plex Sans',sans-serif; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); margin-bottom:6px}
.chip{display:flex; align-items:center; gap:8px; padding:3px 5px; border-radius:6px; cursor:pointer; user-select:none; background:none; border:0; color:var(--ink); font:inherit; width:100%; text-align:left}

.sw{width:11px; height:11px; border-radius:50%; flex:0 0 auto}
.sw.doc{border-radius:2px; background:var(--node-doc)}
.sw.T{background:var(--accent)}

.cm td small{display:block; font-family:'IBM Plex Sans',sans-serif; font-size:.68rem; color:var(--ink-dim)}
.cm .ok{background:var(--good-soft)} .cm .zle{background:var(--bad-soft)}
.blad{border-left:3px solid var(--bad); padding:6px 10px; margin:6px; background:var(--surface-2); border-radius:0 6px 6px 0; font-size:.8rem}
.blad .meta{font-size:.72rem; color:var(--ink-dim); margin-bottom:3px}
.review-item{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; cursor:pointer; background:var(--surface)}
.review-item:hover{background:var(--surface-2)}
.review-item .stripe{grid-row:1 / span 2; width:4px; border-radius:2px; background:var(--miss)}
.review-item .stripe.A{background:var(--good)} .review-item .stripe.B{background:var(--bad)}
.review-item .meta{font-size:.75rem; color:var(--ink-dim)}
.review-item .txt{font-size:.85rem}
.empty{color:var(--ink-dim); font-size:.85rem; padding:4px 0}
footer{font-size:.75rem; color:var(--ink-faint); line-height:1.6; max-width:90ch}
footer b{color:var(--ink-dim)}
@media (max-width:640px){
  #detail{left:12px; right:12px; width:auto; top:auto; bottom:56px; max-height:55%}
  #legend{max-width:160px; font-size:.72rem}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}

padku pytań konkretnych. Innymi słowy zadane pytanie przez sąd administracyjny w trybie art. 269 § 1 p.p.s.a. powinno być tożsame (identyczne) z pytaniem, które wywołało przełamywaną uchwałę.", "gold_label": "teza", "gold_code": null, "sygnatura": "I OPS 1/25"}, {"id": "I OPS 1/25_3", "tekst": "3. W przypadku, gdy powstałe zagadnienie prawne przedstawiono do rozstrzygnięcia, powołując się na regulację przewidzianą w art. 269 § 1 p.p.s.a., mimo iż nie zostały spełnione przesłanki uruchomienia tego trybu, skład poszerzony NSA powinien podjąć uchwałę o pozostawieniu przedstawionego zagadnienia prawnego bez rozpoznania.", "gold_label": "teza", "gold_code": null, "sygnatura": "I OPS 1/25"}, {"id": "II Ka 215/13_1", "tekst": "1. Potrzeba wydania nowego wyroku łącznego w trybie art. 575 § 1 k.p.k. zachodzi jedynie w sytuacji, gdy po wydaniu uprzedniego wyroku łącznego zapadnie wobec tego samego skazanego kolejny wyrok obejmujący karę, która podlega połączeniu z karami objętymi tymże wyrokiem łącznym.", "gold_label": "teza", "gold_code": null, "sygnatura": "II Ka 215/13"}, {"id": "II Ka 215/13_2", "tekst": "2. Instytucje umorzenia postępowania w sprawie o wydanie wyroku łącznego (art. 572 k.p.k.) oraz odrębnego wykonywania łączonych wyroków jednostkowych w zakresie, w jakim nie zostały one objęte wyrokiem łącznym (art. 576 § 1 k.p.k.), są regulacjami odrębnymi i konkurencyjnymi, których łączne stosowanie w odniesieniu do tych samych elementów łączonych wyroków jednostkowych jest błędne.", "gold_label": "teza", "gold_code": null, "sygnatura": "II Ka 215/13"}, {"id": "II AKa 169/20_1", "tekst": "1. Zrealizowanie obowiązku ujętego w treści art. 6 ust. 1 Konwencji, wymaga odniesienia się w uzasadnieniu wyroku do każdego istotnego – na tle konkretnej sprawy – argumentu, a zatem brak odniesienia się do takiej argumentacji stanowi o naruszeniu standardu rzetelnego procesu.", "gold_label": "teza", "gold_code": null, "sygnatura": "II AKa 169/20"}, {"id": "II AKa 169/20_2", "tekst": "2. Uzasadnienie orzeczeń jest decydującym komponentem prawa do rzetelnego procesu sądowego i podkreśla, że uzasadnienie orzeczenia jest podstawą kontroli zewnętrznej orzeczenia przez organ wyższej instancji, bowiem dokumentuje argumenty przemawiające za przyjętym rozstrzygnięciem.", "gold_label": "teza", "gold_code": null, "sygnatura": "II AKa 169/20"}, {"id": "II AKa 169/20_3", "tekst": "3. Niewłaściwe jest ogólne powoływanie się przez sąd na przeprowadzone na rozprawie dowody, gdyż konieczne jest wskazanie i ustalenie, które z nich, w całości lub w konkretnym fragmencie, odnoszą się do określonych okoliczności faktycznych, wymagających uzasadnienia w sprawie. W razie istnienia sprzeczności między dowodami sąd powinien wyjaśnić w uzasadnieniu, na których z nich się oparł oraz dlaczego odrzucił inne; oznacza to, że z taką samą sumiennością sąd powinien oceniać zarówno te dowody, które odrzuca, jak i te, na których opiera wyrok.", "gold_label": "teza", "gold_code": null, "sygnatura": "II AKa 169/20"}, {"id": "II AKa 169/20_4", "tekst": "4. Nowe unormowanie treści przepisu art. 424 § 1 k.p.k. nie oznacza wszak zwolnienia sądu od obowiązku respektowania sporządzenia uzasadnienia gwarantującego prawo strony do rzetelnego procesu, tak w ujęciu konwencyjnym, jak i konstytucyjnym. Gdyby zaś orzekający sąd uznał, że sporządzenie uzasadnienia wyroku na formularzu UK 2 nie daje właściwego instrumentarium procesowego dla zrealizowania wskazanego standardu, może odstąpić od tego obowiązku, sporządzając uzasadnienie wyroku w dotychczasowej formie.", "gold_label": "teza", "gold_code": null, "sygnatura": "II AKa 169/20"}, {"id": "II AKa 169/20_5", "tekst": "5. Wady uzasadnienia, nawet o charakterze rażącym, nie mogą stanowić podstawy uchylenia wyroku. Wady te mogą stanowić jednak podstawę do udzielenia sędziemu wytyku lub do zainicjonowania postępowania dyscyplinarnego.", "gold_label": "teza", "gold_code": null, "sygnatura": "II AKa 169/20"}, {"id": "III K 1961/20_1", "tekst": "1. Dla przypisania sprawcy popełnienia przestępstwa stypizowanego w art. 233 § 1 kk niezbędne jest wykazanie zaistnienia znamion strony podmiotowej, w przypadku przestępstwa złożenia fałszywych zeznań - umyślności działania bądź zaniechania. Umyślność może w tym wypadku przejawiać się zamiarem bezpośrednim albo wynikowym. Minimalnym warunkiem spełnienia znamion strony podmiotowej w odniesieniu do omawianego przestępstwa jest przewidywanie przez sprawcę nieprawdziwości jego oświadczeń o posiadanych wiadomościach na temat faktów badanych w postępowaniu i zarazem godzenie się z tym stanem, wyrażające się złożeniem takich zeznań w formie przewidzianej przez prawo procesowe.", "gold_label": "teza", "gold_code": null, "sygnatura": "III K 1961/20"}, {"id": "III K 1961/20_2", "tekst": "2. Zakresem czynu wyczerpującego znamiona przestępstwa złożenia fałszywych zeznań objąć można tę treść zeznań, do której odnoszą się przesłanki strony podmiotowej.", "gold_label": "teza", "gold_code": null, "sygnatura": "III K 1961/20"}, {"id": "I KK 97/26_1", "tekst": "1. Instytucja wstrzymania wykonania orzeczonej kary pozbawienia wolności jest instytucją wyjątkową, która musi być uzasadniona szczególnymi w swej wymowie okolicznościami prowadzącymi do wniosku, że wykonanie wyroku przed rozpoznaniem kasacji spowodowałoby dla skazanej skutki wyjątkowo dolegliwe i w zasadzie nieodwracalne.", "gold_label": "teza", "gold_code": null, "sygnatura": "I KK 97/26"}, {"id": "I KK 97/26_2", "tekst": "2. Skutki w postaci konieczności wstrzymania wykonania kary mogą zaistnieć wówczas, gdy już pobieżna analiza wniesionej kasacji świadczy o jej zasadności, a tym samym o konieczności uchylenia zaskarżonego nią wyroku.", "gold_label": "teza", "gold_code": null, "sygnatura": "I KK 97/26"}, {"id": "I KK 97/26_3", "tekst": "3. Okoliczności dotyczące wieku skazanej czy jej stanu zdrowia nie stanowią przesłanek do zastosowania instytucji wstrzymania wykonania orzeczenia, gdyż mogą one być przedmiotem badania w ramach postępowania o przerwę w wykonaniu kary lub odroczenie jej wykonania.", "gold_label": "teza", "gold_code": null, "sygnatura": "I KK 97/26"}, {"id": "II K 78/13_1", "tekst": "1. Dla ustalenia istnienia przesłanek do wydania wyroku łącznego znaczenie ma nie data wydania wyroku łącznego w sprawie IIK 322/04, obejmującego kary orzeczone w sprawach IIK 842/02 i IIK 642/03 a data wydania poszczególnych wyroków.", "gold_label": "nie_teza", "gold_code": "2", "sygnatura": "II K 78/13"}, {"id": "II K 78/13_2", "tekst": "2. O kosztach postępowania Sąd orzeka na podstawie art. 632 pkt 2 kpk.", "gold_label": "nie_teza", "gold_code": "1", "sygnatura": "II K 78/13"}, {"id": "V U 1113/13_1", "tekst": "1. Wobec faktu, że wniosek W. K. o sporządzenie uzasadnienia wyroku został nadany w placówce pocztowej po upływie tygodniowego terminu od dnia ogłoszenia wyroku, orzeczono jak w sentencji postanowienia.", "gold_label": "nie_teza", "gold_code": "2", "sygnatura": "V U 1113/13"}, {"id": "III OSK 2732/23_1", "tekst": "1. Naczelny Sąd Administracyjny bada przy tym wszystkie podniesione przez stronę skarżącą kasacyjnie zarzuty naruszenia prawa.", "gold_label": "nie_teza", "gold_code": "1", "sygnatura": "III OSK 2732/23"}, {"id": "III OSK 2732/23_2", "tekst": "2. Art. 93 ust. 4 P.s.w.n. stanowił w tej sprawie podstawę do rozstrzygania administracyjnego w przedmiocie odmowy przyznania stypendium socjalnego.", "gold_label": "nie_teza", "gold_code": "4", "sygnatura": "III OSK 2732/23"}, {"id": "III OSK 2732/23_3", "tekst": "3. O wynagrodzeniu dla pełnomocnika z urzędu rozstrzyga zawsze wojewódzki sąd administracyjny w postępowaniu uregulowanym w art. 250 i następnych Prawa o postępowaniu przed sądami administracyjnymi.", "gold_label": "nie_teza", "gold_code": "1", "sygnatura": "III OSK 2732/23"}, {"id": "III OPS 2/25_1", "tekst": "1. Zgodnie z art. 15 § 1 pkt 2 P.p.s.a., warunkiem rozpoznania wniosku uprawnionego podmiotu o podjęcie uchwały jest wystąpienie sytuacji, gdy stosowanie przepisu, który ma być wyjaśniany, wywołało rozbieżności w orzecznictwie sądów administracyjnych.", "gold_label": "nie_teza", "gold_code": "1", "sygnatura": "III OPS 2/25"}, {"id": "III OPS 2/25_2", "tekst": "2. Rozbieżność w orzecznictwie musi być trwała i rzeczywista, co z kolei implikuje i pogłębia dalsze niejednolite stosowanie prawa.", "gold_label": "nie_teza", "gold_code": "6", "sygnatura": "III OPS 2/25"}, {"id": "III OPS 2/25_3", "tekst": "3. Zgodnie z art. 268 P.p.s.a., wniosek o podjęcie uchwały wymaga uzasadnienia.", "gold_label": "nie_teza", "gold_code": "1", "sygnatura": "III OPS 2/25"}, {"id": "III OPS 2/25_4", "tekst": "4. Naczelny Sąd Administracyjny przy rozważaniu istoty wyjaśnianego zagadnienia prawnego nie jest ograniczony do osnowy wniosku.", "gold_label": "nie_teza", "gold_code": "1", "sygnatura": "III OPS 2/25"}, {"id": "III OPS 2/25_5", "tekst": "5. W przypadku strony reprezentowanej przez pełnomocnika, także braku w postaci przedłożenia do akt dokumentu pełnomocnictwa.", "gold_label": "nie_teza", "gold_code": "7", "sygnatura": "III OPS 2/25"}, {"id": "III OPS 2/25_6", "tekst": "6. Sąd, wzywając stronę do usunięcia braku formalnego, nieusuniętego przez pełnomocnika, musiałby zignorować fakt nieusunięcia tego braku przez pełnomocnika.", "gold_label": "nie_teza", "gold_code": "7", "sygnatura": "III OPS 2/25"}, {"id": "III OPS 2/25_7", "tekst": "7. Zgodnie z art. 58 § 1 pkt 3 P.p.s.a. w sposób jednoznaczny przewiduje obowiązek sądu odrzucenia skargi w przypadku nieuzupełnienia w wyznaczonym terminie braków formalnych skargi.", "gold_label": "nie_teza", "gold_code": "1", "sygnatura": "III OPS 2/25"}, {"id": "KIO 455/16_1", "tekst": "1. Izba ustaliła, że nie została wypełniona żadna z przesłanek, o których stanowi art. 189 ust. 2 ustawy Prawo zamówień publicznych, skutkujących odrzuceniem odwołania.", "gold_label": "nie_teza", "gold_code": "5", "sygnatura": "KIO 455/16"}, {"id": "KIO 455/16_2", "tekst": "2. Izba ustaliła, że zostały wypełnione łącznie przesłanki z art. 179 ust. 1 ustawy Prawo zamówień publicznych - Środki ochrony prawnej określone w niniejszym dziale przysługują wykonawcy, uczestnikowi konkursu, a także innemu podmiotowi jeżeli ma lub miał interes w uzyskaniu danego zamówienia oraz poniósł lub może ponieść szkodę w wyniku naruszenia przez zamawiającego przepisów niniejszej ustawy.", "gold_label": "nie_teza", "gold_code": "5", "sygnatura": "KIO 455/16"}, {"id": "KIO 455/16_3", "tekst": "3. Zgodnie z art. 192 ust. 2 ustawy Prawo zamówień publicznych Izba uwzględnia odwołanie, jeżeli stwierdzi naruszenie przepisów ustawy, które miało wpływ lub może mieć istotny wpływ na wynik postępowania o udzielenie zamówienia.", "gold_label": "nie_teza", "gold_code": "1", "sygnatura": "KIO 455/16"}, {"id": "KIO 455/16_4", "tekst": "5. W związku z art. 190 ust. 1 ustawy - Strony i uczestnicy postępowania odwoławczego są obowiązani wskazywać dowody do stwierdzenia faktów, z których wywodzą skutki prawne.", "gold_label": "nie_teza", "gold_code": "1", "sygnatura": "KIO 455/16"}], "modele": {"gemma4-31b#przebieg1": {"metryki": {"wydobyte": 50, "A_dobre": 17, "B_zle": 5, "C_nieznane": 28, "niepewne_dopasowania": 4, "precyzja_pewna": 0.773, "precyzja_szacowana": 0.74, "C_teza_wg_sedziego": 20, "C_ocenione": 28, "kompletnosc": 1.0, "trafione_dobre": 15, "dobre_w_arkuszu": 15, "powtorzone_bledy": 0.294, "powtorzone_zle": 5, "zle_w_arkuszu": 17, "powtorzone_zle_przepuszczone": 2, "powtorzone_zle_odrzucone": 3, "profil_bledow_arkusz": {"2": 1, "1": 2, "6": 1, "7": 1}, "profil_bledow_sedzia_C": {"2": 2, "1": 6}, "jakosc_sformulowania": 0.747, "rouge_A": {"rouge1_p": 0.73, "rouge1_r": 0.791, "rouge1_f": 0.74, "rouge2_p": 0.652, "rouge2_r": 0.705, "rouge2_f": 0.66, "rougeL_p": 0.686, "rougeL_r": 0.749, "rougeL_f": 0.698}, "rouge_A_std": {"rouge1_p": {"sr": 0.7299, "std": 0.2105, "n": 17}, "rouge1_r": {"sr": 0.7914, "std": 0.2249, "n": 17}, "rouge1_f": {"sr": 0.7398, "std": 0.1919, "n": 17}, "rouge2_p": {"sr": 0.6518, "std": 0.2692, "n": 17}, "rouge2_r": {"sr": 0.7051, "std": 0.2721, "n": 17}, "rouge2_f": {"sr": 0.6602, "std": 0.2531, "n": 17}, "rougeL_p": {"sr": 0.6856, "std": 0.2468, "n": 17}, "rougeL_r": {"sr": 0.749, "std": 0.2655, "n": 17}, "rougeL_f": {"sr": 0.6979, "std": 0.2359, "n": 17}}, "jakosc_sformulowania_std": {"sr": 0.7468, "std": 0.1922, "n": 17}, "zgodnosc_sedziego": 0.818, "walidator": {"tp": 15, "fn": 2, "tn": 3, "fp": 2, "n": 22, "czulosc": 0.8824, "swoistosc": 0.6, "precyzja": 0.8824, "npv": 0.6, "trafnosc": 0.8182, "trafnosc_zrownowazona": 0.7412, "kappa": 0.4824, "mcc": 0.4824, "kod_trafnosc": 1.0, "kody": [{"arkusz": "2", "walidator": "2"}, {"arkusz": "1", "walidator": "1"}, {"arkusz": "6", "walidator": "6"}], "bledy": [{"typ": "FN", "sygnatura": "II Ka 215/13", "gold_id": "II Ka 215/13_2", "gold_code": null, "tekst": "Sąd I instancji łącznie w tym samym zakresie stosuje instytucję umorzenia postepowania w sprawie o wydanie wyroku łącznego regulowaną przez art. 572 k.p.k. oraz instytucję odrębnego wykonywania łączonych wyroków jednostkowych w zakresie w jakim nie zostały objęte wyrokiem łącznym – regulowaną przez art. 576 § 1 k.p.k. Sąd Rejonowy nie dostrzega, iż są to dwie odrębne i w zasadzie konkurencyjne uregulowania i łączne ich stosowanie co do tych samych elementów łączonych wyroków jednostkowych jest błędne.", "decyzja": "nie_teza", "kod": "5", "uzasadnienie": "Stanowi ocenę błędnego zastosowania przepisów przez sąd pierwszej instancji w rozpoznawanej sprawie."}, {"typ": "FN", "sygnatura": "II AKa 169/20", "gold_id": "II AKa 169/20_5", "gold_code": null, "tekst": "Wady uzasadnienia wykazane wyżej, nawet o charakterze rażącym – jak w rozpoznawanej sprawie – nie mogą stanowić podstawy uchylenia wyroku. Stosownie do treści art. 455 lit. a k.p.k., nie można uchylić wyroku z tego powodu, że jego uzasadnienie nie spełnia wymogów określonych w art. 424.", "decyzja": "nie_teza", "kod": "1", "uzasadnienie": "Stanowi parafrazę treści art. 455 lit. a k.p.k. w odniesieniu do stanu faktycznego sprawy."}, {"typ": "FP", "sygnatura": "III OSK 2732/23", "gold_id": "III OSK 2732/23_1", "gold_code": "1", "tekst": "Rozpoznając sprawę Naczelny Sąd Administracyjny związany jest granicami skargi. Związanie granicami skargi oznacza związanie podstawami zaskarżenia wskazanymi w skardze kasacyjnej oraz jej wnioskami. Naczelny Sąd Administracyjny bada przy tym wszystkie podniesione przez stronę skarżącą kasacyjnie zarzuty naruszenia prawa (tak NSA w uchwale pełnego składu z 26 października 2009 r. sygn. akt I OPS 10/09, opubl. w ONSAiWSA 2010 z. 1 poz. 1).", "decyzja": "teza", "kod": null, "uzasadnienie": "Sąd przyjmuje zasadę z uchwały pełnego składu NSA jako operacyjną podstawę rozstrzygnięcia dotyczącą granic kognicji."}, {"typ": "FP", "sygnatura": "III OPS 2/25", "gold_id": "III OPS 2/25_6", "gold_code": "7", "tekst": "Jakkolwiek wezwanie do usunięcia braku formalnego jest adresowane do pełnomocnika, to z prawnego punktu widzenia, wezwana do usunięcia braku jest strona i strona ponosi konsekwencje braku reakcji pełnomocnika na wezwanie do usunięcia braku", "decyzja": "teza", "kod": null, "uzasadnienie": "Zdanie zawiera kluczową interpretację dotyczącą przypisania odpowiedzialności za braki formalne stronie, a nie pełnomocnikowi."}]}, "zgodnosc_sedziego_n": 22, "potwierdzone": 37, "potwierdzone_A": 15, "potwierdzone_B": 2, "potwierdzone_poza_arkuszem": 20, "precyzja_potwierdzonych": 0.882, "kompletnosc_potwierdzonych": 0.867, "wiersze": [{"sygnatura": "I OPS 1/25", "tekst": "Uruchomienie trybu określonego w art. 269 § 1 p.p.s.a. podejmowania 'ponownej uchwały' wymaga zaistnienia takiego stanu, w którym w ocenie składu sądu administracyjnego zachodzi potrzeba odejścia od poglądu prawnego wyrażonego w uchwale składu siedmiu sędziów Naczelnego Sądu Administracyjnego, całej Izby albo w uchwale pełnego składu Naczelnego Sądu Administracyjnego, ergo - w innym przypadku ów skład orzekający sądu administracyjnego naruszyłby przepis art. 269 § 1 p.p.s.a. oraz art. 187 § 2 p.p.s.a., z którego wynika, że uchwała składu siedmiu sędziów Naczelnego Sądu Administracyjnego jest w danej sprawie wiążąca.", "grupa": "C", "przepisy": ["art. 269 § 1 p.p.s.a.", "art. 187 § 2 p.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.309, "niepewne": false, "najblizsza_id": "I OPS 1/25_2", "rouge": {"rouge1": {"p": 0.386, "r": 0.405, "f": 0.395}, "rouge2": {"p": 0.134, "r": 0.141, "f": 0.138}, "rougeL": {"p": 0.253, "r": 0.266, "f": 0.259}}, "sedzia": {"label": "teza", "code": null, "reason": "Interpretuje przesłankę uruchomienia trybu ponownej uchwały jako konieczność odejścia od dotychczasowego poglądu prawnego."}, "sim_emb": 0.812, "najblizsza_emb": "I OPS 1/25_2", "grupa_emb": "C", "sim_rouge": 0.266, "najblizsza_rouge": "I OPS 1/25_2", "grupa_rouge": "C"}, {"sygnatura": "I OPS 1/25", "tekst": "Zaznaczyć należy, że sformułowanie 'stanowisko zajęte w uchwale', występujące w art. 269 § 1 p.p.s.a należy rozumieć ściśle, obejmuje nim ono wykładnię zawartą w sentencji uchwały, oczywiście tylko w granicach uzasadnionych treścią wniosku lub postanowienia. Wykładania podana w sentencji uchwał, jednak wykraczająca poza te granice, jak również te poglądy prawne wyrażone w uzasadnieniu uchwały, które nie mają bezpośredniego związku z 'zajętym stanowiskiem' są pozbawione mocy wiążącej.", "grupa": "A", "przepisy": ["art. 269 § 1 p.p.s.a."], "gold_id": "I OPS 1/25_1", "gold_code": null, "sim": 0.977, "niepewne": false, "najblizsza_id": "I OPS 1/25_1", "rouge": {"rouge1": {"p": 0.954, "r": 1.0, "f": 0.976}, "rouge2": {"p": 0.953, "r": 1.0, "f": 0.976}, "rougeL": {"p": 0.954, "r": 1.0, "f": 0.976}}, "sedzia": {"label": "teza", "code": null, "reason": "Precyzuje zakres wiążącego stanowiska w uchwale, ograniczając go do sentencji w granicach wniosku."}, "sim_emb": 0.997, "najblizsza_emb": "I OPS 1/25_1", "grupa_emb": "A", "sim_rouge": 1.0, "najblizsza_rouge": "I OPS 1/25_1", "grupa_rouge": "A"}, {"sygnatura": "I OPS 1/25", "tekst": "W uchwale składu 7 sędziów Naczelnego Sądu Administracyjnego z dnia 21 września 2020 r. sygn. akt II FPS 1/20 wskazano, że zwrot normatywny 'przedstawia powstałe zagadnienie prawne do rozstrzygnięcia', o którym mowa w art. 269 § 1 p.p.s.a. należy odczytywać łącznie z poprzedzającym go zwrotem 'nie podziela stanowiska zajętego w uchwale'. Będzie to oznaczać, że każdy skład orzekający sądu administracyjnego, chcący skorzystać z procedury przewidzianej w art. 269 § 1 p.p.s.a. i przełamać wiążące w tej uchwale stanowisko, powinien być związany treścią pytania, które tą uchwałę wywołało.", "grupa": "A", "przepisy": ["art. 269 § 1 p.p.s.a."], "gold_id": "I OPS 1/25_2", "gold_code": null, "sim": 0.472, "niepewne": true, "najblizsza_id": "I OPS 1/25_2", "rouge": {"rouge1": {"p": 0.535, "r": 0.582, "f": 0.558}, "rouge2": {"p": 0.4, "r": 0.436, "f": 0.417}, "rougeL": {"p": 0.36, "r": 0.392, "f": 0.376}}, "sedzia": {"label": "teza", "code": null, "reason": "Przyjmuje zasadę z innego orzeczenia dotyczącą związania treścią pytania wywołującego przełamywaną uchwałę."}, "sim_emb": 0.855, "najblizsza_emb": "I OPS 1/25_2", "grupa_emb": "A", "sim_rouge": 0.392, "najblizsza_rouge": "I OPS 1/25_2", "grupa_rouge": "C"}, {"sygnatura": "I OPS 1/25", "tekst": "Powyższe stanowisko wyrażone w powołanej uchwale II FPS 1/20 należałoby uzupełnić o stwierdzenie, że wymóg tożsamości zadanego pytania przez sąd administracyjny z pytaniem, które wywołało przełamywaną uchwałę, dotyczy zarówno takiej sytuacji w której pytanie wykracza poza ramy wiążące w uchwale jak i sytuacji, w której pytanie nie obejmuje w całości ram wiążących w uchwale.", "grupa": "A", "przepisy": ["art. 269 § 1 p.p.s.a."], "gold_id": "I OPS 1/25_2", "gold_code": null, "sim": 0.441, "niepewne": true, "najblizsza_id": "I OPS 1/25_2", "rouge": {"rouge1": {"p": 0.491, "r": 0.342, "f": 0.403}, "rouge2": {"p": 0.185, "r": 0.128, "f": 0.152}, "rougeL": {"p": 0.255, "r": 0.177, "f": 0.209}}, "sedzia": {"label": "teza", "code": null, "reason": "D art. 424 § 1 k.p.k."], "gold_id": null, "gold_code": null, "sim": 0.185, "niepewne": false, "najblizsza_id": "II AKa 169/20_3", "rouge": {"rouge1": {"p": 0.31, "r": 0.163, "f": 0.213}, "rouge2": {"p": 0.073, "r": 0.038, "f": 0.05}, "rougeL": {"p": 0.167, "r": 0.087, "f": 0.115}}, "sedzia": {"label": "teza", "code": null, "reason": "Formułuje konkretne kryteria dotyczące treści i formy części wstępnej uzasadnienia wyroku."}, "sim_emb": 0.746, "najblizsza_emb": "II AKa 169/20_3", "grupa_emb": "C", "sim_rouge": 0.111, "najblizsza_rouge": "II AKa 169/20_5", "grupa_rouge": "C"}, {"sygnatura": "II AKa 169/20", "tekst": "Zarówno z doktryny prawniczej, jak i orzecznictwa Sądu Najwyższego, niekwestionowany jest podgląd, iż niewłaściwe jest ogólne powoływanie się przez sąd na przeprowadzone na rozprawie dowody, gdyż konieczne jest wskazanie i ustalenie, które z nich, w całości lub w konkretnym fragmencie, odnoszą się do określonych okoliczności faktycznych, wymagających uzasadnienia w sprawie.", "grupa": "A", "przepisy": ["art. 424 § 1 k.p.k."], "gold_id": "II AKa 169/20_3", "gold_code": null, "sim": 0.668, "niepewne": false, "najblizsza_id": "II AKa 169/20_3", "rouge": {"rouge1": {"p": 0.84, "r": 0.525, "f": 0.646}, "rouge2": {"p": 0.755, "r": 0.468, "f": 0.578}, "rougeL": {"p": 0.74, "r": 0.463, "f": 0.569}}, "sedzia": {"label": "teza", "code": null, "reason": "Wyznacza normatywny standard przywoływania dowodów, zakazując ogólnych odniesień na rzecz precyzyjnego wskazania fragmentów."}, "sim_emb": 0.904, "najblizsza_emb": "II AKa 169/20_3", "grupa_emb": "A", "sim_rouge": 0.463, "najblizsza_rouge": "II AKa 169/20_3", "grupa_rouge": "C"}, {"sygnatura": "II AKa 169/20", "tekst": "W razie istnienia sprzeczności między dowodami sąd powinien wyjaśnić w uzasadnieniu, na których z nich się oparł oraz dlaczego odrzucił inne; oznacza to, że z taką samą sumiennością sąd powinien oceniać zarówno te dowody, które odrzuca, jak i te, na których opiera wyrok. Brak takiego wyjaśnienia i oceny uniemożliwia odparcie zarzutu przekroczenia przez sąd granic swobodnej oceny dowodów i czyni taki zarzut zasadnym", "grupa": "A", "przepisy": ["art. 424 § 1 k.p.k."], "gold_id": "II AKa 169/20_3", "gold_code": null, "sim": 0.658, "niepewne": false, "najblizsza_id": "II AKa 169/20_3", "rouge": {"rouge1": {"p": 0.746, "r": 0.588, "f": 0.657}, "rouge2": {"p": 0.694, "r": 0.544, "f": 0.61}, "rougeL": {"p": 0.683, "r": 0.537, "f": 0.601}}, "sedzia": {"label": "teza", "code": null, "reason": "Określa obowiązki sądu przy rozstrzyganiu sprzeczności dowodowej oraz wskazuje skutek prawny ich niedopełnienia."}, "sim_emb": 0.922, "najblizsza_emb": "II AKa 169/20_3", "grupa_emb": "A", "sim_rouge": 0.537, "najblizsza_rouge": "II AKa 169/20_3", "grupa_rouge": "C"}, {"sygnatura": "II AKa 169/20", "tekst": "Gdyby zaś orzekający sąd uznał, że sporządzenie uzasadnienia wyroku na formularzu UK 2 nie daje właściwego instrumentarium procesowego dla zrealizowania wskazanego standardu, może odstąpić od tego obowiązku, sporządzając uzasadnienie wyroku w dotychczasowej formie", "grupa": "A", "przepisy": ["art. 99 a § 1 k.p.k."], "gold_id": "II AKa 169/20_4", "gold_code": null, "sim": 0.776, "niepewne": false, "najblizsza_id": "II AKa 169/20_4", "rouge": {"rouge1": {"p": 1.0, "r": 0.516, "f": 0.68}, "rouge2": {"p": 1.0, "r": 0.508, "f": 0.674}, "rougeL": {"p": 1.0, "r": 0.516, "f": 0.68}}, "sedzia": {"label": "teza", "code": null, "reason": "Wypełnia lukę proceduralną, dopuszczając odstąpienie od formularza UK 2, gdy nie pozwala on zrealizować standardu uzasadnienia."}, "sim_emb": 0.892, "najblizsza_emb": "II AKa 169/20_4", "grupa_emb": "A", "sim_rouge": 0.516, "najblizsza_rouge": "II AKa 169/20_4", "grupa_rouge": "C"}, {"sygnatura": "II AKa 169/20", "tekst": "Wady uzasadnienia wykazane wyżej, nawet o charakterze rażącym – jak w rozpoznawanej sprawie – nie mogą stanowić podstawy uchylenia wyroku. Stosownie do treści art. 455 lit. a k.p.k., nie można uchylić wyroku z tego powodu, że jego uzasadnienie nie spełnia wymogów określonych w art. 424.", "grupa": "A", "przepisy": ["art. 455 lit. a k.p.k.", "art. 424 k.p.k."], "gold_id": "II AKa 169/20_5", "gold_code": null, "sim": 0.402, "niepewne": true, "najblizsza_id": "II AKa 169/20_5", "rouge": {"rouge1": {"p": 0.326, "r": 0.519, "f": 0.4}, "rouge2": {"p": 0.214, "r": 0.346, "f": 0.265}, "rougeL": {"p": 0.302, "r": 0.481, "f": 0.371}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Stanowi parafrazę treści art. 455 lit. a k.p.k. w odniesieniu do stanu faktycznego sprawy."}, "sim_emb": 0.86, "najblizsza_emb": "II AKa 169/20_5", "grupa_emb": "A", "sim_rouge": 0.481, "najblizsza_rouge": "II AKa 169/20_5", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "Upoważnienie do uprzedzenia o odpowiedzialności karnej za złożenie fałszywego oświadczenia, o którym mowa w art. 233 § 6 kk musi wynikać z ustawy, na podstawie której prowadzone jest postępowanie.", "grupa": "C", "przepisy": ["art. 233 § 6 kk"], "gold_id": null, "gold_code": null, "sim": 0.246, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 0.429, "r": 0.143, "f": 0.214}, "rouge2": {"p": 0.074, "r": 0.024, "f": 0.036}, "rougeL": {"p": 0.214, "r": 0.071, "f": 0.107}}, "sedzia": {"label": "teza", "code": null, "reason": "Zdanie formułuje abstrakcyjną zasadę dotyczącą wymogu ustawowej podstawy upoważnienia do pouczenia o odpowiedzialności karnej."}, "sim_emb": 0.81, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "C", "sim_rouge": 0.1, "najblizsza_rouge": "III K 1961/20_2", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "W orzecznictwie Sądu Najwyższego wskazuje się, że dla przypisania sprawcy popełnienia przestępstwa stypizowanego w art. 233 § 1 kk . niezbędne jest wykazanie zaistnienia znamion strony podmiotowej, w przypadku przestępstwa złożenia fałszywych zeznań - umyślności działania bądź zaniechania. Umyślność może w tym wypadku przejawiać się zamiarem bezpośrednim albo wynikowym. Minimalnym warunkiem spełnienia znamion strony podmiotowej w odniesieniu do omawianego przestępstwa jest przewidywanie przez sprawcę nieprawdziwości jego oświadczeń o posiadanych wiadomościach na temat faktów badanych w postępowaniu i zarazem godzenie się z tym stanem, wyrażające się złożeniem takich zeznań w formie przewidzianej przez prawo procesowe.", "grupa": "A", "przepisy": ["art. 233 § 1 kk"], "gold_id": "III K 1961/20_1", "gold_code": null, "sim": 0.967, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 0.923, "r": 1.0, "f": 0.96}, "rouge2": {"p": 0.922, "r": 1.0, "f": 0.96}, "rougeL": {"p": 0.923, "r": 1.0, "f": 0.96}}, "sedzia": {"label": "teza", "code": null, "reason": "Kandydat zawiera konkretny test i definicję znamion strony podmiotowej przestępstwa z art. 233 § 1 kk."}, "sim_emb": 0.982, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "A", "sim_rouge": 1.0, "najblizsza_rouge": "III K 1961/20_1", "grupa_rouge": "A"}, {"sygnatura": "III K 1961/20", "tekst": "Podkreślenia przy tym wymaga, że zakresem czynu wyczerpującego znamiona przestępstwa złożenia fałszywych zeznań objąć można tę treść zeznań, do której odnoszą się przesłanki strony podmiotowej", "grupa": "A", "przepisy": ["art. 233 § 1 kk"], "gold_id": "III K 1961/20_2", "gold_code": null, "sim": 0.866, "niepewne": false, "najblizsza_id": "III K 1961/20_2", "rouge": {"rouge1": {"p": 0.8, "r": 1.0, "f": 0.889}, "rouge2": {"p": 0.792, "r": 1.0, "f": 0.884}, "rougeL": {"p": 0.8, "r": 1.0, "f": 0.889}}, "sedzia": {"label": "teza", "code": null, "reason": "Zdanie wyznacza konkretny zakres normatywny czynu, ograniczając go do treści objętej przesłankami strony podmiotowej."}, "sim_emb": 0.958, "najblizsza_emb": "III K 1961/20_2", "grupa_emb": "A", "sim_rouge": 1.0, "najblizsza_rouge": "III K 1961/20_2", "grupa_rouge": "A"}, {"sygnatura": "I KK 97/26", "tekst": "Podzielić należy stanowisko obrońców skazanej, którzy w uzasadnieniu wniosku o wstrzymanie wykonania orzeczonej wobec niej kary pozbawienia wolności wskazują na wyjątkowość tej instytucji oraz fakt, iż musi być ona uzasadniona szczególnymi w swej wymowie okolicznościami prowadzącymi do wniosku, że wykonanie wyroku przed rozpoznaniem kasacji spowodowałoby dla skazanej skutki wyjątkowo dolegliwe i w zasadzie nieodwracalne.", "grupa": "A", "przepisy": ["art. 532 § 1 k.p.k."], "gold_id": "I KK 97/26_1", "gold_code": null, "sim": 0.802, "niepewne": false, "najblizsza_id": "I KK 97/26_1", "rouge": {"rouge1": {"p": 0.63, "r": 0.895, "f": 0.739}, "rouge2": {"p": 0.528, "r": 0.757, "f": 0.622}, "rougeL": {"p": 0.611, "r": 0.868, "f": 0.717}}, "sedzia": {"label": "teza", "code": null, "reason": "Formułuje konkretny, dwuczłonowy test przesłanek wstrzymania wykonania kary (skutki wyjątkowo dolegliwe i nieodwracalne)."}, "sim_emb": 0.911, "najblizsza_emb": "I KK 97/26_1", "grupa_emb": "A", "sim_rouge": 0.868, "najblizsza_rouge": "I KK 97/26_1", "grupa_rouge": "A"}, {"sygnatura": "I KK 97/26", "tekst": "Niezmiennie Sąd Najwyższy podkreśla, że owe skutki mogą zaistnieć wówczas, gdy już pobieżna analiza wniesionej kasacji świadczy o jej zasadności, a tym samym o konieczności uchylenia zaskarżonego nią wyroku. Dochodzi wtedy do sytuacji, w której skazany odbywałby karę, w okolicznościach, w których z racji na charakter uchybień, którymi jest dotknięty zaskarżony wyrok, orzeczenie nie powinno być wykonywane.", "grupa": "A", "przepisy": ["art. 532 § 1 k.p.k."], "gold_id": "I KK 97/26_2", "gold_code": null, "sim": 0.579, "niepewne": false, "najblizsza_id": "I KK 97/26_2", "rouge": {"rouge1": {"p": 0.439, "r": 0.862, "f": 0.581}, "rouge2": {"p": 0.375, "r": 0.75, "f": 0.5}, "rougeL": {"p": 0.404, "r": 0.793, "f": 0.535}}, "sedzia": {"label": "teza", "code": null, "reason": "Określa kryterium uznania wystąpienia dolegliwych skutków poprzez powiązanie ich z zasadnością wniesionej kasacji."}, "sim_emb": 0.896, "najblizsza_emb": "I KK 97/26_2", "grupa_emb": "A", "sim_rouge": 0.793, "najblizsza_rouge": "I KK 97/26_2", "grupa_rouge": "A"}, {"sygnatura": "I KK 97/26", "tekst": "Z kolei okoliczności dotyczące wieku skazanej, czy jej stanu zdrowia nie stanowią przesłanek do zastosowania instytucji wstrzymania wykonania orzeczenia. Okoliczności te mogą okazać się przydatnymi w ewentualnym postępowaniu o przerwę w wykonaniu kary w trybie art. 153 k.k.w. lub odroczenie jej wykonania na podstawie art. 151 k.k.w., nie mogą jednak być przesłanką do zastosowania instytucji uregulowanej w art. 532 § 1 k.p.k.", "grupa": "A", "przepisy": ["art. 153 k.k.w.", "art. 151 k.k.w.", "art. 532 § 1 k.p.k."], "gold_id": "I KK 97/26_3", "gold_code": null, "sim": 0.662, "niepewne": false, "najblizsza_id": "I KK 97/26_3", "rouge": {"rouge1": {"p": 0.492, "r": 0.857, "f": 0.625}, "rouge2": {"p": 0.4, "r": 0.706, "f": 0.511}, "rougeL": {"p": 0.475, "r": 0.829, "f": 0.604}}, "sedzia": {"label": "teza", "code": null, "reason": "Wskazuje konkretne okoliczności (wiek, zdrowie), które nie stanowią przesłanki do wstrzymania wykonania orzeczenia."}, "sim_emb": 0.923, "najblizsza_emb": "I KK 97/26_3", "grupa_emb": "A", "sim_rouge": 0.829, "najblizsza_rouge": "I KK 97/26_3", "grupa_rouge": "A"}, {"sygnatura": "II K 78/13", "tekst": "W tym miejscu należy zwrócić uwagę, że dla ustalenia istnienia przesłanek do wydania wyroku łącznego znaczenie ma nie data wydania wyroku łącznego w sprawie IIK 322/04, obejmującego kary orzeczone w sprawach IIK 842/02 i IIK 642/03 a data wydania poszczególnych wyroków.", "grupa": "B", "przepisy": ["art. 569 § 1 kpk", "art. 85 kk"], "gold_id": "II K 78/13_1", "gold_code": "2", "sim": 0.932, "niepewne": false, "najblizsza_id": "II K 78/13_1", "rouge": {"rouge1": {"p": 0.841, "r": 1.0, "f": 0.914}, "rouge2": {"p": 0.837, "r": 1.0, "f": 0.911}, "rougeL": {"p": 0.841, "r": 1.0, "f": 0.914}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Zdanie odnosi się do konkretnych sygnatur akt, co czyni je zastosowaniem prawa do stanu faktycznego."}, "sim_emb": 0.979, "najblizsza_emb": "II K 78/13_1", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "II K 78/13_1", "grupa_rouge": "B"}, {"sygnatura": "III OSK 2732/23", "tekst": "Rozpoznając sprawę Naczelny Sąd Administracyjny związany jest granicami skargi. Związanie granicami skargi oznacza związanie podstawami zaskarżenia wskazanymi w skardze kasacyjnej oraz jej wnioskami. Naczelny Sąd Administracyjny bada przy tym wszystkie podniesione przez stronę skarżącą kasacyjnie zarzuty naruszenia prawa (tak NSA w uchwale pełnego składu z 26 października 2009 r. sygn. akt I OPS 10/09, opubl. w ONSAiWSA 2010 z. 1 poz. 1).", "grupa": "B", "przepisy": ["P.p.s.a."], "gold_id": "III OSK 2732/23_1", "gold_code": "1", "sim": 0.506, "niepewne": false, "najblizsza_id": "III OSK 2732/23_1", "rouge": {"rouge1": {"p": 0.238, "r": 1.0, "f": 0.385}, "rouge2": {"p": 0.226, "r": 1.0, "f": 0.368}, "rougeL": {"p": 0.238, "r": 1.0, "f": 0.385}}, "sedzia": {"label": "teza", "code": null, "reason": "Sąd przyjmuje zasadę z uchwały pełnego składu NSA jako operacyjną podstawę rozstrzygnięcia dotyczącą granic kognicji."}, "sim_emb": 0.842, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "B"}, {"sygnatura": "III OSK 2732/23", "tekst": "Rola Naczelnego Sądu Administracyjnego w postępowaniu kasacyjnym ogranicza się do skontrolowania i zweryfikowania zarzutów wnoszącego skargę kasacyjną.", "grupa": "C", "przepisy": ["P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.278, "niepewne": false, "najblizsza_id": "III OSK 2732/23_3", "rouge": {"rouge1": {"p": 0.294, "r": 0.2, "f": 0.238}, "rouge2": {"p": 0.188, "r": 0.125, "f": 0.15}, "rougeL": {"p": 0.294, "r": 0.2, "f": 0.238}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Zdanie stanowi jedynie parafrazę ogólnego zakresu kompetencji NSA w postępowaniu kasacyjnym wynikającą z przepisów."}, "sim_emb": 0.79, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "C", "sim_rouge": 0.333, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "W odniesieniu do zawartego w skardze kasacyjnej wniosku o przyznanie kosztów nieopłaconej pomocy prawnej udzielonej z urzędu należy wyjaśnić, że o wynagrodzeniu dla pełnomocnika z urzędu rozstrzyga zawsze wojewódzki sąd administracyjny w postępowaniu uregulowanym w art. 250 i następnych Prawa o postępowaniu przed sądami administracyjnymi.", "grupa": "B", "przepisy": ["art. 250 P.p.s.a."], "gold_id": "III OSK 2732/23_3", "gold_code": "1", "sim": 0.756, "niepewne": false, "najblizsza_id": "III OSK 2732/23_3", "rouge": {"rouge1": {"p": 0.556, "r": 1.0, "f": 0.714}, "rouge2": {"p": 0.545, "r": 1.0, "f": 0.706}, "rougeL": {"p": 0.556, "r": 1.0, "f": 0.714}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Zdanie przypomina jedynie ustawową procedurę rozstrzygania o wynagrodzeniu pełnomocnika z urzędu, bez pracy interpretacyjnej."}, "sim_emb": 0.894, "najblizsza_emb": "III OSK 2732/23_3", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OSK 2732/23_3", "grupa_rouge": "B"}, {"sygnatura": "III OPS 2/25", "tekst": "Przejawem rozbieżności jest sytuacja, w której zagadnienie prawne wynikające z określonych przepisów nie było w dotychczasowym orzecznictwie rozstrzygane w sposób jednolity, w konsekwencji wydawane są przez sądy różne rozstrzygnięcia na tej samej podstawie prawnej i w analogicznym stanie faktycznym", "grupa": "C", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.197, "niepewne": false, "najblizsza_id": "III OPS 2/25_1", "rouge": {"rouge1": {"p": 0.256, "r": 0.312, "f": 0.282}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.179, "r": 0.219, "f": 0.197}}, "sedzia": {"label": "teza", "code": null, "reason": "Zdanie zawiera definicję pojęcia 'rozbieżność' w orzecznictwie, wykraczającą poza prostą parafrazę przepisów."}, "sim_emb": 0.757, "najblizsza_emb": "III OPS 2/25_2", "grupa_emb": "C", "sim_rouge": 0.278, "najblizsza_rouge": "III OPS 2/25_2", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Naczelny Sąd Administracyjny w postanowieniu wydanym w składzie siedmiu sędziów Naczelnego Sądu Administracyjnego z 17 grudnia 2014 r. sygn. akt II OPS 2/14, dotyczącym przesłanek podjęcia uchwały abstrakcyjnej wskazał nadto, że przez istnienie rozbieżności należy rozumieć nie tylko różnice poglądów prawnych wyrażanych w orzecznictwie, ale także tendencję do utrwalania się określonych stanowisk interpretacyjnych", "grupa": "C", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.259, "niepewne": false, "najblizsza_id": "III OPS 2/25_4", "rouge": {"rouge1": {"p": 0.111, "r": 0.4, "f": 0.174}, "rouge2": {"p": 0.038, "r": 0.143, "f": 0.06}, "rougeL": {"p": 0.093, "r": 0.333, "f": 0.145}}, "sedzia": {"label": "teza", "code": null, "reason": "Sąd przyjmuje i powtarza interpretację z innego orzeczenia jako operacyjną podstawę rozstrzygnięcia."}, "sim_emb": 0.777, "najblizsza_emb": "III OPS 2/25_1", "grupa_emb": "C", "sim_rouge": 0.333, "najblizsza_rouge": "III OPS 2/25_4", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Rozbieżność w orzecznictwie musi być trwała i rzeczywista, co z kolei implikuje i pogłębia dalsze niejednolite stosowanie prawa", "grupa": "B", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": "III OPS 2/25_2", "gold_code": "6", "sim": 0.977, "niepewne": false, "najblizsza_id": "III OPS 2/25_2", "rouge": {"rouge1": {"p": 1.0, "r": 1.0, "f": 1.0}, "rouge2": {"p": 1.0, "r": 1.0, "f": 1.0}, "rougeL": {"p": 1.0, "r": 1.0, "f": 1.0}}, "sedzia": {"label": "nie_teza", "code": "6", "reason": "Zdanie jest kołowe i puste; definiuje rozbieżność przez niejednolite stosowanie prawa, nie podając kryteriów."}, "sim_emb": 0.999, "najblizsza_emb": "III OPS 2/25_2", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OPS 2/25_2", "grupa_rouge": "B"}, {"sygnatura": "III OPS 2/25", "tekst": "W związku ze związaniem dla składów orzekających, wynikającym z art. 269 § 1 P.p.s.a., skład poszerzony Naczelnego Sądu Administracyjnego nie może objąć zakresem uchwały zagadnienia, które uprzednio nie stało się przedmiotem kontrowersji i nie skutkowało odmiennymi stanowiskami w orzecznictwie, stanowiłoby to bowiem wyprzedzające rozstrzygnięcie w sposób wiążący kwestii, która przy rozpoznawaniu indywidulanych spraw nie była problematyczna, a w konsekwencji nie doczekała się rozbieżnej argumentacji", "grupa": "C", "przepisy": ["art. 269 § 1 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.236, "niepewne": false, "najblizsza_id": "III OPS 2/25_1", "rouge": {"rouge1": {"p": 0.175, "r": 0.344, "f": 0.232}, "rouge2": {"p": 0.048, "r": 0.097, "f": 0.065}, "rougeL": {"p": 0.127, "r": 0.25, "f": 0.168}}, "sedzia": {"label": "teza", "code": null, "reason": "Sąd wypełnia lukę interpretacyjną, określając granice zakresu przedmiotowego uchwały składu poszerzonego."}, "sim_emb": 0.758, "najblizsza_emb": "III OPS 2/25_1", "grupa_emb": "C", "sim_rouge": 0.4, "najblizsza_rouge": "III OPS 2/25_4", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "z normy art. 34 P.p.s.a. stanowiącej, że strony i uczestnicy postępowania mogą działać przez pełnomocnika, wynika uprawnienie dla stron do jego ustanowienia, a nie obowiązek", "grupa": "C", "przepisy": ["art. 34 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.191, "niepewne": false, "najblizsza_id": "III OPS 2/25_5", "rouge": {"rouge1": {"p": 0.16, "r": 0.267, "f": 0.2}, "rouge2": {"p": 0.042, "r": 0.071, "f": 0.053}, "rougeL": {"p": 0.16, "r": 0.267, "f": 0.2}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Zdanie stanowi wyłącznie parafrazę treści przepisu dotyczącego fakultatywności ustanowienia pełnomocnika."}, "sim_emb": 0.688, "najblizsza_emb": "III OPS 2/25_5", "grupa_emb": "C", "sim_rouge": 0.273, "najblizsza_rouge": "III OPS 2/25_3", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Do dochowania warunków formalnych pisma procesowego nie wystarcza złożenie przez pełnomocnika dowolnego pełnomocnictwa, lecz musi to być dokument pełnomocnictwa odpowiadający niezbędnym wymaganiom przypisanym dla pełnomocnictwa procesowego, z którego wynika upoważnienie do działania w imieniu strony w danej sprawie", "grupa": "C", "przepisy": ["art. 37 § 1 P.p.s.a.", "art. 46 § 3 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.311, "niepewne": false, "najblizsza_id": "III OPS 2/25_5", "rouge": {"rouge1": {"p": 0.211, "r": 0.533, "f": 0.302}, "rouge2": {"p": 0.054, "r": 0.143, "f": 0.078}, "rougeL": {"p": 0.105, "r": 0.267, "f": 0.151}}, "sedzia": {"label": "teza", "code": null, "reason": "Sąd doprecyzowuje wymogi formalne pełnomocnictwa, wskazując konieczność posiadania cech pełnomocnictwa procesowego."}, "sim_emb": 0.78, "najblizsza_emb": "III OPS 2/25_5", "grupa_emb": "C", "sim_rouge": 0.278, "najblizsza_rouge": "III OPS 2/25_6", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Jakkolwiek wezwanie do usunięcia braku formalnego jest adresowane do pełnomocnika, to z prawnego punktu widzenia, wezwana do usunięcia braku jest strona i strona ponosi konsekwencje braku reakcji pełnomocnika na wezwanie do usunięcia braku", "grupa": "B", "przepisy": ["art. 49 § 1 P.p.s.a."], "gold_id": "III OPS 2/25_6", "gold_code": "7", "sim": 0.448, "niepewne": true, "najblizsza_id": "III OPS 2/25_6", "rouge": {"rouge1": {"p": 0.242, "r": 0.444, "f": 0.314}, "rouge2": {"p": 0.094, "r": 0.176, "f": 0.122}, "rougeL": {"p": 0.212, "r": 0.389, "f": 0.275}}, "sedzia": {"label": "teza", "code": null, "reason": "Zdanie zawiera kluczową interpretację dotyczącą przypisania odpowiedzialności za braki formalne stronie, a nie pełnomocnikowi."}, "sim_emb": 0.812, "najblizsza_emb": "III OPS 2/25_6", "grupa_emb": "C", "sim_rouge": 0.389, "najblizsza_rouge": "III OPS 2/25_6", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Sąd nie ma kompetencji do uznania, że nieuzupeł  0.016}, "rougeL": {"p": 0.086, "r": 0.111, "f": 0.097}}, "sedzia": {"label": "teza", "code": null, "reason": "Przywołana zasada z innego orzeczenia stanowi operacyjną podstawę rozstrzygnięcia, definiując granice zakazu ograniczania konkurencji."}, "sim_emb": 0.706, "najblizsza_emb": "KIO 455/16_2", "grupa_emb": "C", "sim_rouge": 0.2, "najblizsza_rouge": "KIO 455/16_4", "grupa_rouge": "C"}, {"sygnatura": "KIO 455/16", "tekst": "Ograniczona liczba wykonawców mogących uczestniczyć w postępowaniu, z uwagi na określony przedmiot zamówienia, nie jest naruszeniem zasady uczciwej konkurencji", "grupa": "C", "przepisy": ["art. 7 ust. 1 ustawy Pzp", "art. 29 ust. 2 ustawy Pzp"], "gold_id": null, "gold_code": null, "sim": 0.196, "niepewne": false, "najblizsza_id": "KIO 455/16_2", "rouge": {"rouge1": {"p": 0.263, "r": 0.093, "f": 0.137}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.211, "r": 0.074, "f": 0.11}}, "sedzia": {"label": "teza", "code": null, "reason": "Sąd formułuje ogólną zasadę, że ograniczona liczba wykonawców wynikająca z przedmiotu zamówienia nie narusza konkurencji."}, "sim_emb": 0.689, "najblizsza_emb": "KIO 455/16_2", "grupa_emb": "C", "sim_rouge": 0.12, "najblizsza_rouge": "KIO 455/16_4", "grupa_rouge": "C"}, {"sygnatura": "KIO 455/16", "tekst": "stosowanie zasady uczciwej konkurencji nie może prowadzić do nabycia dostaw czy usług, które nie odpowiadają potrzebom zamawiającego", "grupa": "C", "przepisy": ["art. 7 ust. 1 ustawy Pzp"], "gold_id": null, "gold_code": null, "sim": 0.106, "niepewne": false, "najblizsza_id": "KIO 455/16_2", "rouge": {"rouge1": {"p": 0.118, "r": 0.037, "f": 0.056}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.118, "r": 0.037, "f": 0.056}}, "sedzia": {"label": "teza", "code": null, "reason": "Zdanie wyznacza konkretną granicę stosowania zasady uczciwej konkurencji w relacji do potrzeb zamawiającego."}, "sim_emb": 0.624, "najblizsza_emb": "KIO 455/16_2", "grupa_emb": "C", "sim_rouge": 0.087, "najblizsza_rouge": "KIO 455/16_1", "grupa_rouge": "C"}, {"sygnatura": "KIO 455/16", "tekst": "granicą rygoryzmu przy formułowaniu wymagań w zakresie parametrów technicznych zamówienia są potrzeby Zamawiającego, obiektywnie skonkretyzowane w przygotowanym przez Zamawiającego opisie przedmiotu zamówienia, jednakże co należy podkreślać, opis przedmiotu zamówienia musi być precyzyjny i jednoznaczny, dający się zidentyfikować i określić, a obowiązki te Zamawiający wykonać winien rzetelnie", "grupa": "C", "przepisy": ["art. 29 ust. 1 ustawy Pzp"], "gold_id": null, "gold_code": null, "sim": 0.203, "niepewne": false, "najblizsza_id": "KIO 455/16_2", "rouge": {"rouge1": {"p": 0.13, "r": 0.111, "f": 0.12}, "rouge2": {"p": 0.022, "r": 0.019, "f": 0.02}, "rougeL": {"p": 0.109, "r": 0.093, "f": 0.1}}, "sedzia": {"label": "teza", "code": null, "reason": "Sąd określa kryteria rygoryzmu parametrów technicznych oraz wymogi precyzyjności opisu przedmiotu zamówienia."}, "sim_emb": 0.64, "najblizsza_emb": "KIO 455/16_2", "grupa_emb": "C", "sim_rouge": 0.093, "najblizsza_rouge": "KIO 455/16_2", "grupa_rouge": "C"}, {"sygnatura": "KIO 455/16", "tekst": "zgodnie z literalną wykładnią art. 29 ust. 2 ustawy użyty w treści tego przepisu zwrot 'mógłby utrudniać uczciwą konkurencję' stanowi o tym, że dla uznania naruszenia ustanowionego w powyższej normie prawnej zakazu wystarczające jest jedynie takie działanie Zamawiającego, które mogłoby sprzyjać naruszeniu zasady uczciwej konkurencji, niekoniecznie zaś godzić w nią bezpośrednio", "grupa": "C", "przepisy": ["art. 29 ust. 2 ustawy Pzp"], "gold_id": null, "gold_code": null, "sim": 0.201, "niepewne": false, "najblizsza_id": "KIO 455/16_2", "rouge": {"rouge1": {"p": 0.235, "r": 0.222, "f": 0.229}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.137, "r": 0.13, "f": 0.133}}, "sedzia": {"label": "teza", "code": null, "reason": "Sąd interpretuje niejasne pojęcie 'mógłby utrudniać', wskazując, że wystarczy samo sprzyjanie naruszeniu zasady."}, "si : "B", "gold_1": "III OPS 2/25_6", "sim_1": 0.448, "grupa_2": "C", "gold_2": "III OPS 2/25_6", "sim_2": 0.812}, {"sygnatura": "III OPS 2/25", "tekst": "Dlatego w sytuacji, gdy pełnomocnik, który wniósł skargę, na wezwanie Sądu nie dołączył do akt sprawy sądowoadministracyjnej dokumentu pełnomocnictwa, skarga powinna zostać odrzucona na podstawie art. 58 § 1 pkt 3 P.p.s.a w związku z art. 49 § 1 w zw. z art. 46 § 3 P.p.s.a.", "grupa_1": "C", "gold_1": "III OPS 2/25_1", "sim_1": 0.22, "grupa_2": "B", "gold_2": "III OPS 2/25_7", "sim_2": 0.849}], "metryki_2": {"A_dobre": 16, "B_zle": 5, "C_nieznane": 29, "niepewne_dopasowania": 2, "potwierdzone_A": 14, "potwierdzone_B": 1, "precyzja_potwierdzonych": 0.933, "kompletnosc_potwierdzonych": 0.867, "precyzja_pewna": 0.762, "kompletnosc": 1.0}}, "porownanie_rouge": {"zgodne": 43, "n": 50, "rozbieznosci": [{"sygnatura": "I OPS 1/25", "tekst": "W uchwale składu 7 sędziów Naczelnego Sądu Administracyjnego z dnia 21 września 2020 r. sygn. akt II FPS 1/20 wskazano, że zwrot normatywny 'przedstawia powstałe zagadnienie prawne do rozstrzygnięcia', o którym mowa w art. 269 § 1 p.p.s.a. należy odczytywać łącznie z poprzedzającym go zwrotem 'nie podziela stanowiska zajętego w uchwale'. Będzie to oznaczać, że każdy skład orzekający sądu administracyjnego, chcący skorzystać z procedury przewidzianej w art. 269 § 1 p.p.s.a. i przełamać wiążące w tej uchwale stanowisko, powinien być związany treścią pytania, które tą uchwałę wywołało.", "grupa_1": "A", "gold_1": "I OPS 1/25_2", "sim_1": 0.472, "grupa_2": "C", "gold_2": "I OPS 1/25_2", "sim_2": 0.392}, {"sygnatura": "I OPS 1/25", "tekst": "Powyższe stanowisko wyrażone w powołanej uchwale II FPS 1/20 należałoby uzupełnić o stwierdzenie, że wymóg tożsamości zadanego pytania przez sąd administracyjny z pytaniem, które wywołało przełamywaną uchwałę, dotyczy zarówno takiej sytuacji w której pytanie wykracza poza ramy wiążące w uchwale jak i sytuacji, w której pytanie nie obejmuje w całości ram wiążących w uchwale.", "grupa_1": "A", "gold_1": "I OPS 1/25_2", "sim_1": 0.441, "grupa_2": "C", "gold_2": "I OPS 1/25_1", "sim_2": 0.226}, {"sygnatura": "II AKa 169/20", "tekst": "Zarówno z doktryny prawniczej, jak i orzecznictwa Sądu Najwyższego, niekwestionowany jest podgląd, iż niewłaściwe jest ogólne powoływanie się przez sąd na przeprowadzone na rozprawie dowody, gdyż konieczne jest wskazanie i ustalenie, które z nich, w całości lub w konkretnym fragmencie, odnoszą się do określonych okoliczności faktycznych, wymagających uzasadnienia w sprawie.", "grupa_1": "A", "gold_1": "II AKa 169/20_3", "sim_1": 0.668, "grupa_2": "C", "gold_2": "II AKa 169/20_3", "sim_2": 0.463}, {"sygnatura": "II AKa 169/20", "tekst": "W razie istnienia sprzeczności między dowodami sąd powinien wyjaśnić w uzasadnieniu, na których z nich się oparł oraz dlaczego odrzucił inne; oznacza to, że z taką samą sumiennością sąd powinien oceniać zarówno te dowody, które odrzuca, jak i te, na których opiera wyrok. Brak takiego wyjaśnienia i oceny uniemożliwia odparcie zarzutu przekroczenia przez sąd granic swobodnej oceny dowodów i czyni taki zarzut zasadnym", "grupa_1": "A", "gold_1": "II AKa 169/20_3", "sim_1": 0.658, "grupa_2": "C", "gold_2": "II AKa 169/20_3", "sim_2": 0.537}, {"sygnatura": "II AKa 169/20", "tekst": "Gdyby zaś orzekający sąd uznał, że sporządzenie uzasadnienia wyroku na formularzu UK 2 nie daje właściwego instrumentarium procesowego dla zrealizowania wskazanego standardu, może odstąpić od tego obowiązku, sporządzając uzasadnienie wyroku w dotychczasowej formie", "grupa_1": "A", "gold_1": "II AKa 169/20_4", "sim_1": 0.776, "grupa_2": "C", "gold_2": "II AKa 169/20_4", "sim_2": 0.516}, {"sygnatura": "II AKa 169/20", "tekst": "Wady uzasadnienia wykazane wyżej, nawet o charakterze rażącym – jak w rozpoznawanej sprawie – nie mogą stanowić podstawy uchylenia wyroku. Stosownie do treści art. 455 lit. a k.p.k., nie można uchylić wyroku z tego powodu, że jego uzasadnienie nie spełnia wymogów określonych w art. 424.", "grupa_1": "A", "gold_1": "II AKa 169/20_5", "sim_1": 0.402, "grupa_2": "C", "gold_2": "II AKa 169/20_5", "sim_2": 0.481}, {"sygnatura": "III OPS 2/25", "tekst": "Jakkolwiek wezwanie do usunięcia braku formalnego jest adresowane do pełnomocnika, to z prawnego punktu widzenia, wezwana do usunięcia braku jest strona i strona ponosi konsekwencje braku reakcji pełnomocnika na wezwanie do usunięcia braku", "grupa_1": "B", "gold_1": "III OPS 2/25_6", "sim_1": 0.448, "grupa_2": "C", "gold_2": "III OPS 2/25_6", "sim_2": 0.389}], "metryki_2": {"A_dobre": 11, "B_zle": 4, "C_nieznane": 35, "niepewne_dopasowania": 2, "potwierdzone_A": 10, "potwierdzone_B": 1, "precyzja_potwierdzonych": 0.909, "kompletnosc_potwierdzonych": 0.667, "precyzja_pewna": 0.733, "kompletnosc": 0.733}}, "podobienstwo_A_std": {"tfidf": {"sr": 0.7468, "std": 0.1922, "n": 17}, "emb": {"sr": 0.922, "std": 0.0594, "n": 17}, "rougeL": {"sr": 0.7519, "std": 0.2591, "n": 17}}, "czas_orzeczenia_std": {"sr": 550.04, "std": 201.9011, "n": 10}}, "czas_ekstrakcji_s": 1565.4535131454468, "sedzia": "gemma4-31b", "etykieta": "Gemma 4 31B · vLLM · przebieg 1", "info": {"nazwa": "Gemma 4 31B, wersja instrukcyjna (Google)", "hf": "google/gemma-4-31B-it-qat-w4a16-ct", "rewizja": "52f3f65", "kwantyzacja": "QAT – wagi 4-bit, aktywacje 16-bit (W4A16, compressed-tensors)", "architektura": "Gemma4ForConditionalGeneration, 60 warstw", "parser": "gemma4", "serwowanie": "vLLM 0.30.0 (ROCm 7.2) · AMD Radeon AI PRO R9700 32 GB · kontekst 32 768 tokenów · KV cache fp8 · 4 zapytania naraz · temperature 0, seed 0 · rozumowanie włączone"}, "sedzia_info": {"nazwa": "Gemma 4 31B, wersja instrukcyjna (Google)", "hf": "google/gemma-4-31B-it-qat-w4a16-ct", "rewizja": "52f3f65", "kwantyzacja": "QAT – wagi 4-bit, aktywacje 16-bit (W4A16, compressed-tensors)", "architektura": "Gemma4ForConditionalGeneration, 60 warstw", "parser": "gemma4", "serwowanie": "vLLM 0.30.0 (ROCm 7.2) · AMD Radeon AI PRO R9700 32 GB · kontek ale', występujące w art. 269 § 1 p.p.s.a należy rozumieć ściśle, obejmuje nim ono wykładnię zawartą w sentencji uchwały, oczywiście tylko w granicach uzasadnionych treścią wniosku lub postanowienia. Wykładania podana w sentencji uchwał, jednak wykraczająca poza te granice, jak również te poglądy prawne wyrażone w uzasadnieniu uchwały, które nie mają bezpośredniego związku z 'zajętym stanowiskiem' są pozbawione mocy wiążącej.", "grupa": "A", "przepisy": ["art. 269 § 1 p.p.s.a."], "gold_id": "I OPS 1/25_1", "gold_code": null, "sim": 0.978, "niepewne": false, "najblizsza_id": "I OPS 1/25_1", "rouge": {"rouge1": {"p": 0.954, "r": 1.0, "f": 0.976}, "rouge2": {"p": 0.953, "r": 1.0, "f": 0.976}, "rougeL": {"p": 0.954, "r": 1.0, "f": 0.976}}, "sedzia": {"label": "teza", "code": null, "reason": "Zawiera interpretację pojęcia 'stanowisko zajęte w uchwale', ograniczając jego moc wiążącą do sentencji."}, "sim_emb": 0.997, "najblizsza_emb": "I OPS 1/25_1", "grupa_emb": "A", "sim_rouge": 1.0, "najblizsza_rouge": "I OPS 1/25_1", "grupa_rouge": "A"}, {"sygnatura": "I OPS 1/25", "tekst": "W uchwale składu 7 sędziów Naczelnego Sądu Administracyjnego z dnia 21 września 2020 r. sygn. akt II FPS 1/20 wskazano, że zwrot normatywny 'przedstawia powstałe zagadnienie prawne do rozstrzygnięcia', o którym mowa w art. 269 § 1 p.p.s.a. należy odczytywać łącznie z poprzedzającym go zwrotem 'nie podziela stanowiska zajętego w uchwale'. Będzie to oznaczać, że każdy skład orzekający sądu administracyjnego, chcący skorzystać z procedury przewidzianej w art. 269 § 1 p.p.s.a. i przełamać wiążące w tej uchwale stanowisko, powinien być związany treścią pytania, które tą uchwałę wywołało. Odnosi się to zarówno do pytania zawartego we wniosku właściwego podmiotu w przypadku pytań abstrakcyjnych, bądź pytania zwartego w postanowieniu NSA w przypadku pytań konkretnych. Innymi słowy zadane pytanie przez sąd administracyjny w trybie art. 269 § 1 p.p.s.a. powinno być tożsame (identyczne) z pytaniem, które wywołało przełamywaną uchwałę.", "grupa": "A", "przepisy": ["art. 269 § 1 p.p.s.a."], "gold_id": "I OPS 1/25_2", "gold_code": null, "sim": 0.846, "niepewne": false, "najblizsza_id": "I OPS 1/25_2", "rouge": {"rouge1": {"p": 0.59, "r": 1.0, "f": 0.742}, "rouge2": {"p": 0.586, "r": 1.0, "f": 0.739}, "rougeL": {"p": 0.59, "r": 1.0, "f": 0.742}}, "sedzia": {"label": "teza", "code": null, "reason": "Wprowadza konkretny test tożsamości pytania w trybie art. 269 § 1 p.p.s.a. z pytaniem pierwotnym."}, "sim_emb": 0.906, "najblizsza_emb": "I OPS 1/25_2", "grupa_emb": "A", "sim_rouge": 1.0, "najblizsza_rouge": "I OPS 1/25_2", "grupa_rouge": "A"}, {"sygnatura": "I OPS 1/25", "tekst": "Powyższe stanowisko wyrażone w powołanej uchwale II FPS 1/20 należałoby uzupełnić o stwierdzenie, że wymóg tożsamości zadanego pytania przez sąd administracyjny z pytaniem, które wywołało przełamywaną uchwałę, dotyczy zarówno takiej sytuacji w której pytanie wykracza poza ramy wiążące w uchwale jak i sytuacji, w której pytanie nie obejmuje w całości ram wiążących w uchwale.", "grupa": "A", "przepisy": ["art. 269 § 1 p.p.s.a."], "gold_id": "I OPS 1/25_2", "gold_code": null, "sim": 0.449, "niepewne": true, "najblizsza_id": "I OPS 1/25_2", "rouge": {"rouge1": {"p": 0.491, "r": 0.342, "f": 0.403}, "rouge2": {"p": 0.185, "r": 0.128, "f": 0.152}, "rougeL": {"p": 0.255, "r": 0.177, "f": 0.209}}, "sedzia": {"label": "teza", "code": null, "reason": "Doprecyzowuje zakres stosowania wymogu tożsamości pytania w zależności od ram wiążących uchwały."}, "sim_emb": 0.764, "najblizsza_emb": "I OPS 1/25_2", "grupa_emb": "C", "sim_rouge": 0.226, "najblizsza_rouge": "I OPS 1/25_1", "grupa_rouge": "C"}, {"sygnatura": "I OPS 1/25", "tekst": "W uzasadnieniu tej uchwały wskazano, że skoro z treści art. 269 § 2 p.p.s.a. wynika, że nie stosuje się w przepisu art. 267 p.p.s.a. oznacza to, iż Naczelny Sąd Administracyjny nie może podjąć w tym trybie postanowienia o odmowie udzielenia odpowiedzi, bowiem ustawodawca nie dopuszcza izsza_emb": "II Ka 215/13_2", "grupa_emb": "A", "sim_rouge": 0.882, "najblizsza_rouge": "II Ka 215/13_2", "grupa_rouge": "A"}, {"sygnatura": "II AKa 169/20", "tekst": "Niekwestionowany jest pogląd, że zrealizowanie obowiązku ujętego w treści art. 6 ust. 1 Konwencji, wymaga odniesienia się w uzasadnieniu wyroku do każdego istotnego – na tle konkretnej sprawy – argumentu, a zatem brak odniesienia się do takiej argumentacji stanowi o naruszeniu standardu rzetelnego procesu.", "grupa": "A", "przepisy": ["art. 6 ust. 1 Konwencji"], "gold_id": "II AKa 169/20_1", "gold_code": null, "sim": 0.937, "niepewne": false, "najblizsza_id": "II AKa 169/20_1", "rouge": {"rouge1": {"p": 0.905, "r": 1.0, "f": 0.95}, "rouge2": {"p": 0.902, "r": 1.0, "f": 0.949}, "rougeL": {"p": 0.905, "r": 1.0, "f": 0.95}}, "sedzia": {"label": "teza", "code": null, "reason": "Formułuje interpretacyjny standard rzetelnego procesu, wskazując obowiązek odniesienia się do każdego istotnego argumentu."}, "sim_emb": 0.982, "najblizsza_emb": "II AKa 169/20_1", "grupa_emb": "A", "sim_rouge": 1.0, "najblizsza_rouge": "II AKa 169/20_1", "grupa_rouge": "A"}, {"sygnatura": "II AKa 169/20", "tekst": "Przyjmuje bowiem, że uzasadnienie orzeczeń jest decydującym komponentem prawa do rzetelnego procesu sądowego i podkreśla, że uzasadnienie orzeczenia jest podstawą kontroli zewnętrznej orzeczenia przez organ wyższej instancji, bowiem dokumentuje argumenty przemawiające za przyjętym rozstrzygnięciem", "grupa": "A", "przepisy": ["art. 45 ust. 1 Konstytucji RP"], "gold_id": "II AKa 169/20_2", "gold_code": null, "sim": 0.958, "niepewne": false, "najblizsza_id": "II AKa 169/20_2", "rouge": {"rouge1": {"p": 0.912, "r": 1.0, "f": 0.954}, "rouge2": {"p": 0.909, "r": 1.0, "f": 0.952}, "rougeL": {"p": 0.912, "r": 1.0, "f": 0.954}}, "sedzia": {"label": "teza", "code": null, "reason": "Definiuje funkcję uzasadnienia orzeczenia jako podstawy kontroli zewnętrznej i dokumentacji argumentacji sądu."}, "sim_emb": 0.986, "najblizsza_emb": "II AKa 169/20_2", "grupa_emb": "A", "sim_rouge": 1.0, "najblizsza_rouge": "II AKa 169/20_2", "grupa_rouge": "A"}, {"sygnatura": "II AKa 169/20", "tekst": "Chodzi więc o to, aby w części wstępnej uzasadnienia zwięźle, bez zbędnych dla sprawy detali, podano poszczególne ustalone przez sąd fakty decydujące o przypisaniu bądź o nieprzypisaniu oskarżonemu określonego przestępstwa, wskazując przy tym, na jakich dowodach się oparto, przy dokonywaniu poszczególnych ustaleń. Następnie zaś, także zwięźle, ale przekonująco, z podaniem określonych argumentów należy wykazać, dlaczego tym dowodom sąd dał wiarę i dlaczego odmówił wiarygodności innym.", "grupa": "C", "przepisy": ["art. 424 § 1 k.p.k."], "gold_id": null, "gold_code": null, "sim": 0.229, "niepewne": false, "najblizsza_id": "II AKa 169/20_3", "rouge": {"rouge1": {"p": 0.308, "r": 0.25, "f": 0.276}, "rouge2": {"p": 0.078, "r": 0.063, "f": 0.07}, "rougeL": {"p": 0.169, "r": 0.138, "f": 0.152}}, "sedzia": {"label": "teza", "code": null, "reason": "Podaje konkretne kryteria i strukturę prawidłowego uzasadnienia w zakresie ustaleń faktycznych i oceny dowodów."}, "sim_emb": 0.783, "najblizsza_emb": "II AKa 169/20_3", "grupa_emb": "C", "sim_rouge": 0.138, "najblizsza_rouge": "II AKa 169/20_3", "grupa_rouge": "C"}, {"sygnatura": "II AKa 169/20", "tekst": "Zarówno z doktryny prawniczej, jak i orzecznictwa Sądu Najwyższego, niekwestionowany jest podgląd, iż niewłaściwe jest ogólne powoływanie się przez sąd na przeprowadzone na rozprawie dowody, gdyż konieczne jest wskazanie i ustalenie, które z nich, w całości lub w konkretnym fragmencie, odnoszą się do określonych okoliczności faktycznych, wymagających uzasadnienia w sprawie.", "grupa": "A", "przepisy": ["art. 424 § 1 k.p.k."], "gold_id": "II AKa 169/20_3", "gold_code": null, "sim": 0.671, "niepewne": false, "najblizsza_id": "II AKa 169/20_3", "rouge": {"rouge1": {"p": 0.84, "r": 0.525, "f": 0.646}, "rouge2": {"p": 0.755, "r": 0.468, "f": 0.578}, "rougeL": {"p": 0.74, "r": 0.463, "f": 0.569}}, "sedzia": {"label": "teza", "code": null, "reason": "Ustanawia zasadę zakazu ogólnego powoływania się na dowody, wymagając ich precyzyjnego przypisania do faktów."}, "sim_emb": 0.904, "najblizsza_emb": "II AKa 169/20_3", "grupa_emb": "A", "sim_rouge": 0.463, "najblizsza_rouge": "II AKa 169/20_3", "grupa_rouge": "C"}, {"sygnatura": "II AKa 169/20", "tekst": "W razie istnienia sprzeczności między dowodami sąd powinien wyjaśnić w uzasadnieniu, na których z nich się oparł oraz dlaczego odrzucił inne; oznacza to, że z taką samą sumiennością sąd powinien oceniać zarówno te dowody, które odrzuca, jak i te, na których opiera wyrok.", "grupa": "A", "przepisy": ["art. 424 § 1 k.p.k."], "gold_id": "II AKa 169/20_3", "gold_code": null, "sim": 0.785, "niepewne": false, "najblizsza_id": "II AKa 169/20_3", "rouge": {"rouge1": {"p": 1.0, "r": 0.537, "f": 0.699}, "rouge2": {"p": 1.0, "r": 0.532, "f": 0.694}, "rougeL": {"p": 1.0, "r": 0.537, "f": 0.699}}, "sedzia": {"label": "teza", "code": null, "reason": "Określa obowiązek sądu w przypadku sprzecznych dowodów, nakazując sumienną ocenę zarówno dowodów przyjętych, jak i odrzuconych."}, "sim_emb": 0.932, "najblizsza_emb": "II AKa 169/20_3", "grupa_emb": "A", "sim_rouge": 0.537, "najblizsza_rouge": "II AKa 169/20_3", "grupa_rouge": "C"}, {"sygnatura": "II AKa 169/20", "tekst": "Brak takiego wyjaśnienia i oceny uniemożliwia odparcie zarzutu przekroczenia przez sąd granic swobodnej oceny dowodów i czyni taki zarzut zasadnym", "grupa": "C", "przepisy": ["art. 424 § 1 k.p.k."], "gold_id": null, "gold_code": null, "sim": 0.122, "niepewne": false, "najblizsza_id": "II AKa 169/20_3", "rouge": {"rouge1": {"p": 0.3, "r": 0.075, "f": 0.12}, "rouge2": {"p": 0.053, "r": 0.013, "f": 0.02}, "rougeL": {"p": 0.25, "r": 0.062, "f": 0.1}}, "sedzia": {"label": "teza", "code": null, "reason": "Wskazuje konkretny skutek prawny braku wyjaśnień w uzasadnieniu, uznając wtedy zarzut przekroczenia granic oceny dowodów za zasadny."}, "sim_emb": 0.744, "najblizsza_emb": "II AKa 169/20_5", "grupa_emb": "C", "sim_rouge": 0.065, "najblizsza_rouge": "II AKa 169/20_2", "grupa_rouge": "C"}, {"sygnatura": "II AKa 169/20", "tekst": "Gdyby zaś orzekający sąd uznał, że sporządzenie uzasadnienia wyroku na formularzu UK 2 nie daje właściwego instrumentarium procesowego dla zrealizowania wskazanego standardu, może odstąpić od tego obowiązku, sporządzając uzasadnienie wyroku w dotychczasowej formie", "grupa": "A", "przepisy": ["art. 99 a § 1 k.p.k."], "gold_id": "II AKa 169/20_4", "gold_code": null, "sim": 0.778, "niepewne": false, "najblizsza_id": "II AKa 169/20_4", "rouge": {"rouge1": {"p": 1.0, "r": 0.516, "f": 0.68}, "rouge2": {"p": 1.0, "r": 0.508, "f": 0.674}, "rougeL": {"p": 1.0, "r": 0.516, "f": 0.68}}, "sedzia": {"label": "teza", "code": null, "reason": "Wypełnia lukę proceduralną, dopuszczając odstąpienie od formularza UK 2 na rzecz tradycyjnej formy uzasadnienia."}, "sim_emb": 0.892, "najblizsza_emb": "II AKa 169/20_4", "grupa_emb": "A", "sim_rouge": 0.516, "najblizsza_rouge": "II AKa 169/20_4", "grupa_rouge": "C"}, {"sygnatura": "II AKa 169/20", "tekst": "Stosownie do treści art. 455 lit. a k.p.k., nie można uchylić wyroku z tego powodu, że jego uzasadnienie nie spełnia wymogów określonych w art. 424 k.p.k.", "grupa": "C", "przepisy": ["art. 455 lit. a k.p.k.", "art. 424 k.p.k."], "gold_id": null, "gold_code": null, "sim": 0.214, "niepewne": false, "najblizsza_id": "II AKa 169/20_4", "rouge": {"rouge1": {"p": 0.462, "r": 0.188, "f": 0.267}, "rouge2": {"p": 0.08, "r": 0.032, "f": 0.045}, "rougeL": {"p": 0.308, "r": 0.125, "f": 0.178}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Stanowi wyłącznie parafrazę treści art. 455 lit. a k.p.k., nie wnosząc żadnej interpretacji."}, "sim_emb": 0.788, "najblizsza_emb": "II AKa 169/20_4", "grupa_emb": "C", "sim_rouge": 0.148, "najblizsza_rouge": "II AKa 169/20_5", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "Upoważnienie do uprzedzenia o od
