wej wymowie okolicznościami prowadzącymi do wniosku, że wykonanie wyroku przed rozpoznaniem kasacji spowodowałoby dla skazanej skutki wyjątkowo dolegliwe i w zasadzie nieodwracalne.", "grupa": "A", "przepisy": ["art. 532 § 1 k.p.k."], "gold_id": "I KK 97/26_1", "gold_code": null, "sim": 0.802, "niepewne": false, "najblizsza_id": "I KK 97/26_1", "rouge": {"rouge1": {"p": 0.63, "r": 0.895, "f": 0.739}, "rouge2": {"p": 0.528, "r": 0.757, "f": 0.622}, "rougeL": {"p": 0.611, "r": 0.868, "f": 0.717}}, "sedzia": {"label": "teza", "code": null, "reason": "Formułuje konkretny, dwuczłonowy test przesłanek wstrzymania wykonania kary (skutki wyjątkowo dolegliwe i nieodwracalne)."}, "sim_emb": 0.911, "najblizsza_emb": "I KK 97/26_1", "grupa_emb": "A", "sim_rouge": 0.868, "najblizsza_rouge": "I KK 97/26_1", "grupa_rouge": "A"}, {"sygnatura": "I KK 97/26", "tekst": "Niezmiennie Sąd Najwyższy podkreśla, że owe skutki mogą zaistnieć wówczas, gdy już pobieżna analiza wniesionej kasacji świadczy o jej zasadności, a tym samym o konieczności uchylenia zaskarżonego nią wyroku. Dochodzi wtedy do sytuacji, w której skazany odbywałby karę, w okolicznościach, w których z racji na charakter uchybień, którymi jest dotknięty zaskarżony wyrok, orzeczenie nie powinno być wykonywane.", "grupa": "A", "przepisy": ["art. 532 § 1 k.p.k."], "gold_id": "I KK 97/26_2", "gold_code": null, "sim": 0.579, "niepewne": false, "najblizsza_id": "I KK 97/26_2", "rouge": {"rouge1": {"p": 0.439, "r": 0.862, "f": 0.581}, "rouge2": {"p": 0.375, "r": 0.75, "f": 0.5}, "rougeL": {"p": 0.404, "r": 0.793, "f": 0.535}}, "sedzia": {"label": "teza", "code": null, "reason": "Określa kryterium uznania wystąpienia dolegliwych skutków poprzez analizę zasadności wniesionej kasacji."}, "sim_emb": 0.896, "najblizsza_emb": "I KK 97/26_2", "grupa_emb": "A", "sim_rouge": 0.793, "najblizsza_rouge": "I KK 97/26_2", "grupa_rouge": "A"}, {"sygnatura": "I KK 97/26", "tekst": "Z kolei okoliczności dotyczące wieku skazanej, czy jej stanu zdrowia nie stanowią przesłanek do zastosowania instytucji wstrzymania wykonania orzeczenia. Okoliczności te mogą okazać się przydatnymi w ewentualnym postępowaniu o przerwę w wykonaniu kary w trybie art. 153 k.k.w. lub odroczenie jej wykonania na podstawie art. 151 k.k.w., nie mogą jednak być przesłanką do zastosowania instytucji uregulowanej w art. 532 § 1 k.p.k.", "grupa": "A", "przepisy": ["art. 153 k.k.w.", "art. 151 k.k.w.", "art. 532 § 1 k.p.k."], "gold_id": "I KK 97/26_3", "gold_code": null, "sim": 0.662, "niepewne": false, "najblizsza_id": "I KK 97/26_3", "rouge": {"rouge1": {"p": 0.492, "r": 0.857, "f": 0.625}, "rouge2": {"p": 0.4, "r": 0.706, "f": 0.511}, "rougeL": {"p": 0.475, "r": 0.829, "f": 0.604}}, "sedzia": {"label": "teza", "code": null, "reason": "Wykładnia ograniczająca zakres przesłanek wstrzymania wykonania kary poprzez wyłączenie z nich wieku i stanu zdrowia."}, "sim_emb": 0.923, "najblizsza_emb": "I KK 97/26_3", "grupa_emb": "A", "sim_rouge": 0.829, "najblizsza_rouge": "I KK 97/26_3", "grupa_rouge": "A"}, {"sygnatura": "II K 78/13", "tekst": "W tym miejscu należy zwrócić uwagę, że dla ustalenia istnienia przesłanek do wydania wyroku łącznego znaczenie ma nie data wydania wyroku łącznego w sprawie IIK 322/04, obejmującego kary orzeczone w sprawach IIK 842/02 i IIK 642/03 a data wydania poszczególnych wyroków.", "grupa": "B", "przepisy": ["art. 569 § 1 kpk", "art. 85 kk"], "gold_id": "II K 78/13_1", "gold_code": "2", "sim": 0.932, "niepewne": false, "najblizsza_id": "II K 78/13_1", "rouge": {"rouge1": {"p": 0.841, "r": 1.0, "f": 0.914}, "rouge2": {"p": 0.837, "r": 1.0, "f": 0.911}, "rougeL": {"p": 0.841, "r": 1.0, "f": 0.914}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Zdanie odnosi się do konkretnych sygnatur akt, co czyni je zastosowaniem prawa do stanu faktycznego sprawy."}, "sim_emb": 0.979, "najblizsza_emb": "II K 78/13_1", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "II K 78/13_1", "grupa_rouge": "B"}, {"sygnatura": "III OSK 2732/23", "tekst": "Rozpoznając sprawę Naczelny Sąd Administracyjny związany jest granicami skargi. Związanie granicami skargi oznacza związanie podstawami zaskarżenia wskazanymi w skardze kasacyjnej oraz jej wnioskami. Naczelny Sąd Administracyjny bada przy tym wszystkie podniesione przez stronę skarżącą kasacyjnie zarzuty naruszenia prawa (tak NSA w uchwale pełnego składu z 26 października 2009 r. sygn. akt I OPS 10/09, opubl. w ONSAiWSA 2010 z. 1 poz. 1).", "grupa": "B", "przepisy": ["art. 183 § 1 P.p.s.a."], "gold_id": "III OSK 2732/23_1", "gold_code": "1", "sim": 0.505, "niepewne": false, "najblizsza_id": "III OSK 2732/23_1", "rouge": {"rouge1": {"p": 0.238, "r": 1.0, "f": 0.385}, "rouge2": {"p": 0.226, "r": 1.0, "f": 0.368}, "rougeL": {"p": 0.238, "r": 1.0, "f": 0.385}}, "sedzia": {"label": "teza", "code": null, "reason": "Zdanie formułuje zasadę zakresu kognicji NSA, przyjmując interpretację z uchwały pełnego składu jako podstawę rozstrzygnięcia."}, "sim_emb": 0.842, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "B"}, {"sygnatura": "III OSK 2732/23", "tekst": "Rola Naczelnego Sąd Administracyjnego w postępowaniu kasacyjnym ogranicza się do skontrolowania i zweryfikowania zarzutów wnoszącego skargę kasacyjną.", "grupa": "C", "przepisy": ["art. 176 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.282, "niepewne": false, "najblizsza_id": "III OSK 2732/23_3", "rouge": {"rouge1": {"p": 0.294, "r": 0.2, "f": 0.238}, "rouge2": {"p": 0.188, "r": 0.125, "f": 0.15}, "rougeL": {"p": 0.294, "r": 0.2, "f": 0.238}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Stanowi jedynie opisową parafrazę ogólnego charakteru postępowania kasacyjnego wynikającego z przepisów prawa."}, "sim_emb": 0.791, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "C", "sim_rouge": 0.333, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "W odniesieniu do zawartego w skardze kasacyjnej wniosku o przyznanie kosztów nieopłaconej pomocy prawnej udzielonej z urzędu należy wyjaśnić, że o wynagrodzeniu dla pełnomocnika z urzędu rozstrzyga zawsze wojewódzki sąd administracyjny w postępowaniu uregulowanym w art. 250 i następnych Prawa o postępowaniu przed sądami administracyjnymi.", "grupa": "B", "przepisy": ["art. 250 P.p.s.a."], "gold_id": "III OSK 2732/23_3", "gold_code": "1", "sim": 0.756, "niepewne": false, "najblizsza_id": "III OSK 2732/23_3", "rouge": {"rouge1": {"p": 0.556, "r": 1.0, "f": 0.714}, "rouge2": {"p": 0.545, "r": 1.0, "f": 0.706}, "rougeL": {"p": 0.556, "r": 1.0, "f": 0.714}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Jest to parafraza kompetencji wojewódzkiego sądu administracyjnego wynikająca wprost z przywołanych przepisów P.p.s.a."}, "sim_emb": 0.894, "najblizsza_emb": "III OSK 2732/23_3", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OSK 2732/23_3", "grupa_rouge": "B"}, {"sygnatura": "III OPS 2/25", "tekst": "Przejawem rozbieżności jest sytuacja, w której zagadnienie prawne wynikające z określonych przepisów nie było w dotychczasowym orzecznictwie rozstrzygane w sposób jednolity, w konsekwencji wydawane są przez sądy różne rozstrzygnięcia na tej samej podstawie prawnej i w analogicznym stanie faktycznym", "grupa": "C", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.195, "niepewne": false, "najblizsza_id": "III OPS 2/25_1", "rouge": {"rouge1": {"p": 0.256, "r": 0.312, "f": 0.282}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.179, "r": 0.219, "f": 0.197}}, "sedzia": {"label": "teza", "code": null, "reason": "Zdanie definiuje pojęcie rozbieżności w orzecznictwie, określając konkretne kryteria jej wystąpienia."}, "sim_emb": 0.757, "najblizsza_emb": "III OPS 2/25_2", "grupa_emb": "C", "sim_rouge": 0.278, "najblizsza_rouge": "III OPS 2/25_2", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Naczelny Sąd Administracyjny w postanowieniu wydanym w składzie siedmiu sędziów Naczelnego Sądu Administracyjnego z 17 grudnia 2014 r. sygn. akt II OPS 2/14, dotyczącym przesłanek podjęcia uchwały abstrakcyjnej wskazał nadto, że przez istnienie rozbieżności należy rozumieć nie tylko różnice poglądów prawnych wyrażanych w orzecznictwie, ale także tendencję do utrwalania się określonych stanowisk interpretacyjnych", "grupa": "C", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.284, "niepewne": false, "najblizsza_id": "III OPS 2/25_4", "rouge": {"rouge1": {"p": 0.111, "r": 0.4, "f": 0.174}, "rouge2": {"p": 0.038, "r": 0.143, "f": 0.06}, "rougeL": {"p": 0.093, "r": 0.333, "f": 0.145}}, "sedzia": {"label": "teza", "code": null, "reason": "Sąd przyjmuje interpretację pojęcia rozbieżności z innego orzeczenia jako operacyjną podstawę rozstrzygnięcia."}, "sim_emb": 0.777, "najblizsza_emb": "III OPS 2/25_1", "grupa_emb": "C", "sim_rouge": 0.333, "najblizsza_rouge": "III OPS 2/25_4", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "W konsekwencji, przedmiotem uchwały abstrakcyjnej nie mogą być przepisy, które nie stanowiły podstawy prawnej orzekania, albo te przepisy, które stanowiąc taką podstawę prawną, nie wywołały rozbieżności w orzecznictwie.", "grupa": "C", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.269, "niepewne": false, "najblizsza_id": "III OPS 2/25_1", "rouge": {"rouge1": {"p": 0.286, "r": 0.25, "f": 0.267}, "rouge2": {"p": 0.148, "r": 0.129, "f": 0.138}, "rougeL": {"p": 0.286, "r": 0.25, "f": 0.267}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Stanowi jedynie logiczne następstwo wymogu istnienia rozbieżności dla podjęcia uchwały abstrakcyjnej."}, "sim_emb": 0.697, "najblizsza_emb": "III OPS 2/25_1", "grupa_emb": "C", "sim_rouge": 0.25, "najblizsza_rouge": "III OPS 2/25_1", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Do dochowania warunków formalnych pisma procesowego nie wystarcza złożenie przez pełnomocnika dowolnego pełnomocnictwa, lecz musi to być dokument pełnomocnictwa odpowiadający niezbędnym wymaganiom przypisanym dla pełnomocnictwa procesowego, z którego wynika upoważnienie do działania w imieniu strony w danej sprawie.", "grupa": "C", "przepisy": ["art. 37 § 1 P.p.s.a.", "art. 46 § 3 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.334, "niepewne": false, "najblizsza_id": "III OPS 2/25_5", "rouge": {"rouge1": {"p": 0.211, "r": 0.533, "f": 0.302}, "rouge2": {"p": 0.054, "r": 0.143, "f": 0.078}, "rougeL": {"p": 0.105, "r": 0.267, "f": 0.151}}, "sedzia": {"label": "teza", "code": null, "reason": "Rozstrzyga wątpliwość interpretacyjną, odróżniając dowolne pełnomocnictwo od pełnomocnictwa procesowego spełniającego wymogi."}, "sim_emb": 0.781, "najblizsza_emb": "III OPS 2/25_5", "grupa_emb": "C", "sim_rouge": 0.278, "najblizsza_rouge": "III OPS 2/25_6", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Jakkolwiek wezwanie do usunięcia braku formalnego jest adresowane do pełnomocnika, to z prawnego punktu widzenia, wezwana do usunięcia braku jest strona i strona ponosi konsekwencje braku reakcji pełnomocnika na wezwanie do usunięcia braku.", "grupa": "B", "przepisy": ["art. 39 P.p.s.a.", "art. 49 § 1 P.p.s.a."], "gold_id": "III OPS 2/25_6", "gold_code": "7", "sim": 0.461, "niepewne": true, "najblizsza_id": "III OPS 2/25_6", "rouge": {"rouge1": {"p": 0.242, "r": 0.444, "f": 0.314}, "rouge2": {"p": 0.094, "r": 0.176, "f": 0.122}, "rougeL": {"p": 0.212, "r": 0.389, "f": 0.275}}, "sedzia": {"label": "teza", "code": null, "reason": "Formułuje ogólną zasadę odpowiedzialności strony za brak reakcji pełnomocnika na wezwanie sądu."}, "sim_emb": 0.815, "najblizsza_emb": "III OPS 2/25_6", "grupa_emb": "C", "sim_rouge": 0.389, "najblizsza_rouge": "III OPS 2/25_6", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Sąd nie ma kompetencji do uznania, że nieuzupełniony istotny brak formalny skargi, jakim jest brak dokumentu pełnomocnictwa upoważniającego sporządzającego skargę pełnomocnika do jej wniesienia, może stać się innego rodzaju brakiem formalnym (brakiem podpisu strony pod skargą), który w dalszym ciągu podlegałby uzupełnieniu.", "grupa": "C", "przepisy": ["art. 46 § 3 P.p.s.a.", "art. 58 § 1 pkt 3 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.236, "niepewne": false, "najblizsza_id": "III OPS 2/25_7", "rouge": {"rouge1": {"p": 0.143, "r": 0.24, "f": 0.179}, "rouge2": {"p": 0.024, "r": 0.042, "f": 0.031}, "rougeL": {"p": 0.095, "r": 0.16, "f": 0.119}}, "sedzia": {"label": "teza", "code": null, "reason": "Wypełnia lukę interpretacyjną, zakazując uznania braku pełnomocnictwa za brak podpisu strony."}, "sim_emb": 0.761, "najblizsza_emb": "III OPS 2/25_6", "grupa_emb": "C", "sim_rouge": 0.333, "najblizsza_rouge": "III OPS 2/25_6", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Systemowe odczytanie art. 29 P.p.s.a. i art. 37 P.p.s.a. nie pozostawia wątpliwości, że w przypadku osoby prawnej pełnomocnik powinien przy pierwszej czynności procesowej nie tylko przedłożyć udzielone mu pełnomocnictwo, stosownie do art. 37 § 1 P.p.s.a. i art. 46 § 3 P.p.s.a., lecz także dokumenty potwierdzające umocowanie do reprezentacji strony przez osobę, która udzieliła pełnomocnictwa - stosownie do art. 29 P.p.s.a.", "grupa": "C", "przepisy": ["art. 29 P.p.s.a.", "art. 37 § 1 P.p.s.a.", "art. 46 § 3 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.321, "niepewne": false, "najblizsza_id": "III OPS 2/25_5", "rouge": {"rouge1": {"p": 0.172, "r": 0.667, "f": 0.274}, "rouge2": {"p": 0.018, "r": 0.071, "f": 0.028}, "rougeL": {"p": 0.121, "r": 0.467, "f": 0.192}}, "sedzia": {"label": "teza", "code": null, "reason": "Przedstawia systemową interpretację przepisów, określając zakres dokumentów wymaganych przy reprezentacji osoby prawnej."}, "sim_emb": 0.72, "najblizsza_emb": "III OPS 2/25_5", "grupa_emb": "C", "sim_rouge": 0.467, "najblizsza_rouge": "III OPS 2/25_5", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "pełnomocnik został zwolniony z tego obowiązku tylko w sytuacji, gdy sąd ma możliwość ustalenia umocowania osoby udzielającej pełnomocnictwa do takiego działania w oparciu o dostęp elektroniczny do wykazu lub rejestru, ale pod warunkiem, że w skardze podano podstawę umocowania tej osoby.", "grupa": "C", "przepisy": ["art. 29 P.p.s.a.", "art. 37 § 1 P.p.s.a.", "art. 46 § 3 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.17, "niepewne": false, "najblizsza_id": "III OPS 2/25_5", "rouge": {"rouge1": {"p": 0.122, "r": 0.333, "f": 0.179}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.073, "r": 0.2, "f": 0.107}}, "sedzia": {"label": "teza", "code": null, "reason": "Ustanawia konkretny, dwuczłonowy test warunków zwalniających pełnomocnika z obowiązku przedłożenia dokumentów umocowania."}, "sim_emb": 0.726, "najblizsza_emb": "III OPS 2/25_6", "grupa_emb": "C", "sim_rouge": 0.24, "najblizsza_rouge": "III OPS 2/25_7", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Podpisanie skargi przez osobę, która nie przedstawiła dokumentu pełnomocnictwa stanowi brak formalny skargi podlegający usunięciu, na podstawie art. 49 § 1 w związku z art. 57 § 1 i w związku z art. 46 § 1 pkt 4 P.p.s.a., przez jej wezwanie do dołączenia dokumentu pełnomocnictwa; nieusunięcie braku formalnego skargi stanowi podstawę do jej odrzucenia zgodnie z art. 58 § 1 pkt 3 P.p.s.a w związku z art. 49 § 1 i w związku z art. 46 § 3 P.p.s.a.", "grupa": "C", "przepisy": ["art. 49 § 1 P.p.s.a.", "art. 57 § 1 P.p.s.a.", "art. 46 § 1 pkt 4 P.p.s.a.", "art. 58 § 1 pkt 3 P.p.s.a.", "art. 46 § 3 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.334, "niepewne": false, "najblizsza_id": "III OPS 2/25_7", "rouge": {"rouge1": {"p": 0.203, "r": 0.6, "f": 0.303}, "rouge2": {"p": 0.123, "r": 0.375, "f": 0.186}, "rougeL": {"p": 0.135, "r": 0.4, "f": 0.202}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Stanowi wyłącznie streszczenie procedury usuwania braków formalnych wynikającej wprost z przywołanych przepisów."}, "sim_emb": 0.814, "najblizsza_emb": "III OPS 2/25_7", "grupa_emb": "C", "sim_rouge": 0.4, "najblizsza_rouge": "III OPS 2/25_5", "grupa_rouge": "C"}, {"sygnatura": "KIO 455/16", "tekst": "Postępowanie przed Izbą stanowi postępowanie kontradyktoryjne, czyli sporne, a z istoty tego postępowania wynika, iż spór toczą Strony postępowania i to one mają obowiązek wykazywania dowodów, z których wywodzą określone skutki prawne.", "grupa": "C", "przepisy": ["art. 190 ust. 1 ustawy Pzp"], "gold_id": null, "gold_code": null, "sim": 0.349, "niepewne": false, "najblizsza_id": "KIO 455/16_4", "rouge": {"rouge1": {"p": 0.312, "r": 0.4, "f": 0.351}, "rouge2": {"p": 0.097, "r": 0.125, "f": 0.109}, "rougeL": {"p": 0.281, "r": 0.36, "f": 0.316}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Zdanie stanowi jedynie opis zasady kontradyktoryjności, która wynika wprost z charakteru postępowania spornego."}, "sim_emb": 0.725, "najblizsza_emb": "KIO 455/16_4", "grupa_emb": "C", "sim_rouge": 0.36, "najblizsza_rouge": "KIO 455/16_4", "grupa_rouge": "C"}, {"sygnatura": "KIO 455/16", "tekst": "Ciężar dowodu, zgodnie z art. 6 k.c. w zw. z art. 14 ustawy p.z.p. spoczywa na osobie, która z danego faktu wywodzi skutki prawne. Ciężar dowodu rozumieć należy z jednej strony jako obarczenie strony procesu obowiązkiem przekonania sądu (w tym przypadku Krajowej Izby Odwoławczej) dowodami o słuszności swoich twierdzeń, a z drugiej konsekwencjami zaniechania realizacji tego obowiązku, lub jego nieskuteczności, zaś tą konsekwencją jest zazwyczaj niekorzystny dla strony wynik postępowania", "grupa": "C", "przepisy": ["art. 6 k.c.", "art. 14 ustawy Pzp"], "gold_id": null, "gold_code": null, "sim": 0.31, "niepewne": false, "najblizsza_id": "KIO 455/16_4", "rouge": {"rouge1": {"p": 0.214, "r": 0.6, "f": 0.316}, "rouge2": {"p": 0.043, "r": 0.125, "f": 0.065}, "rougeL": {"p": 0.114, "r": 0.32, "f": 0.168}}, "sedzia": {"label": "teza", "code": null, "reason": "Sąd formułuje dwuelementarną definicję ciężaru dowodu, wykraczającą poza literalne brzmienie przywołanych przepisów."}, "sim_emb": 0.734, "najblizsza_emb": "KIO 455/16_4", "grupa_emb": "C", "sim_rouge": 0.32, "najblizsza_rouge": "KIO 455/16_4", "grupa_rouge": "C"}, {"sygnatura": "KIO 455/16", "tekst": "Postępowanie przed Krajową Izbą Odwoławczą toczy się z uwzględnieniem zasady kontradyktoryjności, zatem to strony obowiązane są przedstawiać dowody a Krajowa Izba Odwoławcza nie ma obowiązku wymuszania ani zastępowania stron w jego wypełnianiu", "grupa": "C", "przepisy": ["art. 190 ust. 1 ustawy Pzp"], "gold_id": null, "gold_code": null, "sim": 0.296, "niepewne": false, "najblizsza_id": "KIO 455/16_4", "rouge": {"rouge1": {"p": 0.25, "r": 0.32, "f": 0.281}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.125, "r": 0.16, "f": 0.14}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Jest to parafraza zasady kontradyktoryjności i wynikających z niej obowiązków stron oraz sądu."}, "sim_emb": 0.736, "najblizsza_emb": "KIO 455/16_4", "grupa_emb": "C", "sim_rouge": 0.16, "najblizsza_rouge": "KIO 455/16_4", "grupa_rouge": "C"}, {"sygnatura": "KIO 455/16", "tekst": "Sąd Okręgowy w Bydgoszczy w wyroku z dnia 27 maja 2009 roku sygn. akt: II Ca 158/09 wskazał - [...] zakaz ten [art. 29 ust. 2 pzp] nie oznacza konieczności nabycia przez zamawiającego dostaw, usług czy robót budowlanych nie odpowiadających jego potrzebom, zarówno co do jakości, funkcjonalności czy wymaganych parametrów technicznych, jedynie nakazuje dopuścić konkurencję między wykonawcami mogącymi spełnić postawione wymogi w odniesieniu do przedmiotu zamówienia bez ograniczenia dostępu do zamówienia", "grupa": "C", "przepisy": ["art. 29 ust. 2 ustawy Pzp"], "gold_id": null, "gold_code": null, "sim": 0.158, "niepewne": false, "najblizsza_id": "KIO 455/16_2", "rouge": {"rouge1": {"p": 0.143, "r": 0.185, "f"  "niepewne": false, "najblizsza_id": "II AKa 169/20_3", "rouge": {"rouge1": {"p": 0.84, "r": 0.525, "f": 0.646}, "rouge2": {"p": 0.755, "r": 0.468, "f": 0.578}, "rougeL": {"p": 0.74, "r": 0.463, "f": 0.569}}, "sedzia": {"label": "teza", "code": null, "reason": "Ustanawia normatywny standard przywoływania dowodów w uzasadnieniu, zakazując ogólnych odniesień na rzecz konkretnych ustaleń."}, "sim_emb": 0.904, "najblizsza_emb": "II AKa 169/20_3", "grupa_emb": "A", "sim_rouge": 0.463, "najblizsza_rouge": "II AKa 169/20_3", "grupa_rouge": "C"}, {"sygnatura": "II AKa 169/20", "tekst": "W razie istnienia sprzeczności między dowodami sąd powinien wyjaśnić w uzasadnieniu, na których z nich się oparł oraz dlaczego odrzucił inne; oznacza to, że z taką samą sumiennością sąd powinien oceniać zarówno te dowody, które odrzuca, jak i te, na których opiera wyrok. Brak takiego wyjaśnienia i oceny uniemożliwia odparcie zarzutu przekroczenia przez sąd granic swobodnej oceny dowodów i czyni taki zarzut zasadnym", "grupa": "A", "przepisy": ["art. 424 § 1 k.p.k."], "gold_id": "II AKa 169/20_3", "gold_code": null, "sim": 0.659, "niepewne": false, "najblizsza_id": "II AKa 169/20_3", "rouge": {"rouge1": {"p": 0.746, "r": 0.588, "f": 0.657}, "rouge2": {"p": 0.694, "r": 0.544, "f": 0.61}, "rougeL": {"p": 0.683, "r": 0.537, "f": 0.601}}, "sedzia": {"label": "teza", "code": null, "reason": "Określa obowiązki sądu przy rozstrzyganiu sprzeczności dowodowej i wskazuje skutek prawny zaniechania tych obowiązków."}, "sim_emb": 0.922, "najblizsza_emb": "II AKa 169/20_3", "grupa_emb": "A", "sim_rouge": 0.537, "najblizsza_rouge": "II AKa 169/20_3", "grupa_rouge": "C"}, {"sygnatura": "II AKa 169/20", "tekst": "Gdyby zaś orzekający sąd uznał, że sporządzenie uzasadnienia wyroku na formularzu UK 2 nie daje właściwego instrumentarium procesowego dla zrealizowania wskazanego standardu, może odstąpić od tego obowiązku, sporządzając uzasadnienie wyroku w dotychczasowej formie", "grupa": "A", "przepisy": ["art. 9 "f": 0.107}}, "sedzia": {"label": "teza", "code": null, "reason": "Zdanie formułuje zasadę dotyczącą źródła upoważnienia do pouczenia o odpowiedzialności karnej, wykraczając poza prostą parafrazę."}, "sim_emb": 0.81, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "C", "sim_rouge": 0.1, "najblizsza_rouge": "III K 1961/20_2", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "W orzecznictwie Sądu Najwyższego wskazuje się, że dla przypisania sprawcy popełnienia przestępstwa stypizowanego w art. 233 § 1 kk . niezbędne jest wykazanie zaistnienia znamion strony podmiotowej, w przypadku przestępstwa złożenia fałszywych zeznań - umyślności działania bądź zaniechania. Umyślność może w tym wypadku przejawiać się zamiarem bezpośrednim albo wynikowym. Minimalnym warunkiem spełnienia znamion strony podmiotowej w odniesieniu do omawianego przestępstwa jest przewidywanie przez sprawcę nieprawdziwości jego oświadczeń o posiadanych wiadomościach na temat faktów badanych w postępowaniu i zarazem godzenie się z tym stanem, wyrażające się złożeniem takich zeznań w formie przewidzianej przez prawo procesowe.", "grupa": "A", "przepisy": ["art. 233 § 1 kk"], "gold_id": "III K 1961/20_1", "gold_code": null, "sim": 0.967, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 0.923, "r": 1.0, "f": 0.96}, "rouge2": {"p": 0.922, "r": 1.0, "f": 0.96}, "rougeL": {"p": 0.923, "r": 1.0, "f": 0.96}}, "sedzia": {"label": "teza", "code": null, "reason": "Podaje konkretny, wielostopniowy test i kryteria oceny znamion strony podmiotowej przestępstwa z art. 233 § 1 kk."}, "sim_emb": 0.982, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "A", "sim_rouge": 1.0, "najblizsza_rouge": "III K 1961/20_1", "grupa_rouge": "A"}, {"sygnatura": "III K 1961/20", "tekst": "Podkreślenia przy tym wymaga, że zakresem czynu wyczerpującego znamiona przestępstwa złożenia fałszywych zeznań objąć można tę treść zeznań, do której odnoszą się przesłanki strony podmiotowej (por. np. wyrok SN z 15 stycznia 1999 r., II KKN 129/97, Prok. i Pr. 1999/9/1).", "grupa": "A", "przepisy": ["art. 233 § 1 kk"], "gold_id": "III K 1961/20_2", "gold_code": null, "sim": 0.677, "niepewne": false, "najblizsza_id": "III K 1961/20_2", "rouge": {"rouge1": {"p": 0.455, "r": 1.0, "f": 0.625}, "rouge2": {"p": 0.442, "r": 1.0, "f": 0.613}, "rougeL": {"p": 0.455, "r": 1.0, "f": 0.625}}, "sedzia": {"label": "teza", "code": null, "reason": "Wskazuje konkretną regułę ograniczającą zakres czynu do treści objętej przesłankami strony podmiotowej."}, "sim_emb": 0.912, "najblizsza_emb": "III K 1961/20_2", "grupa_emb": "A", "sim_rouge": 1.0, "najblizsza_rouge": "III K 1961/20_2", "grupa_rouge": "A"}, {"sygnatura": "I KK 97/26", "tekst": "Podzielić należy stanowisko obrońców skazanej, którzy w uzasadnieniu wniosku o wstrzymanie wykonania orzeczonej wobec niej kary pozbawienia wolności wskazują na wyjątkowość tej instytucji oraz fakt, iż musi być ona uzasadniona szczególnymi w swej wymowie okolicznościami prowadzącymi do wniosku, że wykonanie wyroku przed rozpoznaniem kasacji spowodowałoby dla skazanej skutki wyjątkowo dolegliwe i w zasadzie nieodwracalne. Niezmiennie Sąd Najwyższy podkreśla, że owe skutki mogą zaistnieć wówczas, gdy już pobieżna analiza wniesionej kasacji świadczy o jej zasadności, a tym samym o konieczności uchylenia zaskarżonego nią wyroku. Dochodzi wtedy do sytuacji, w której skazany odbywałby karę, w okolicznościach, w których z racji na charakter uchybień, którymi jest dotknięty zaskarżony wyrok, orzeczenie nie powinno być wykonywane.", "grupa": "A", "przepisy": ["art. 532 § 1 k.p.k."], "gold_id": "I KK 97/26_1", "gold_code": null, "sim": 0.657, "niepewne": false, "najblizsza_id": "I KK 97/26_1", "rouge": {"rouge1": {"p": 0.315, "r": 0.921, "f": 0.47}, "rouge2": {"p": 0.255, "r": 0.757, "f": 0.381}, "rougeL": {"p": 0.297, "r": 0.868, "f": 0.443}}, "sedzia": {"label": "teza", "code": null, "reason": "Formułuje konkretny test przesłanek wstrzymania wykonania kary, wskazując na konieczność zasadności kasacji i nieodwracalność skutków."}, "sim_emb": 0.888, "najblizsza_emb": "I KK 97/26_1", "grupa_emb": "A", "sim_rouge": 0.868, "najblizsza_rouge": "I KK 97/26_1", "grupa_rouge": "A"}, {"sygnatura": "I KK 97/26", "tekst": "Z kolei okoliczności dotyczące wieku skazanej, czy jej stanu zdrowia nie stanowią przesłanek do zastosowania instytucji wstrzymania wykonania orzeczenia. Okoliczności te mogą okazać się przydatnymi w ewentualnym postępowaniu o przerwę w wykonaniu kary w trybie art. 153 k.k.w. lub odroczenie jej wykonania na podstawie art. 151 k.k.w., nie mogą jednak być przesłanką do zastosowania instytucji uregulowanej w art. 532 § 1 k.p.k.", "grupa": "A", "przepisy": ["art. 153 k.k.w.", "art. 151 k.k.w.", "art. 532 § 1 k.p.k."], "gold_id": "I KK 97/26_3", "gold_code": null, "sim": 0.66, "niepewne": false, "najblizsza_id": "I KK 97/26_3", "rouge": {"rouge1": {"p": 0.492, "r": 0.857, "f": 0.625}, "rouge2": {"p": 0.4, "r": 0.706, "f": 0.511}, "rougeL": {"p": 0.475, "r": 0.829, "f": 0.604}}, "sedzia": {"label": "teza", "code": null, "reason": "Określa zakres normatywny przepisu poprzez wyłączenie wieku i stanu zdrowia jako przesłanek wstrzymania wykonania orzeczenia."}, "sim_emb": 0.923, "najblizsza_emb": "I KK 97/26_3", "grupa_emb": "A", "sim_rouge": 0.829, "najblizsza_rouge": "I KK 97/26_3", "grupa_rouge": "A"}, {"sygnatura": "II K 78/13", "tekst": "W tym miejscu należy zwrócić uwagę, że dla ustalenia istnienia przesłanek do wydania wyroku łącznego znaczenie ma nie data wydania wyroku łącznego w sprawie IIK 322/04, obejmującego kary orzeczone w sprawach IIK 842/02 i IIK 642/03 a data wydania poszczególnych wyroków.", "grupa": "B", "przepisy": ["art. 569 § 1 kpk", "art. 85 kk"], "gold_id": "II K 78/13_1", "gold_code": "2", "sim": 0.932, "niepewne": false, "najblizsza_id": "II K 78/13_1", "rouge": {"rouge1": {"p": 0.841, "r": 1.0, "f": 0.914}, "rouge2": {"p": 0.837, "r": 1.0, "f": 0.911}, "rougeL": {"p": 0.841, "r": 1.0, "f": 0. nowi jedynie ogólny opis roli sądu kasacyjnego, który wynika wprost z natury tego postępowania."}, "sim_emb": 0.791, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "C", "sim_rouge": 0.333, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Normy prawne zawarte w art. 93 ust. 4 P.s.w.n. i art. 184 ust. 5 P.s.w. nie są tożsame. Zgodnie z art. 184 ust. 5 P.s.w. studentowi, który po ukończeniu jednego kierunku studiów kontynuował naukę na drugim kierunku studiów, nie przysługiwały świadczenia o których mowa w art. 173 P.s.w., chyba że kontynuował on studia po ukończeniu studiów pierwszego stopnia w celu uzyskania tytułu zawodowego magistra lub równorzędnego, jednakże nie dłużej niż przez okres trzech lat. Natomiast stosownie do treści art. 93 ust. 4 P.s.w.n. łączny okres, przez który przysługują świadczenia, o których mowa w art. 86 ust. 1 pkt 1-4 i art. 359 ust. 1 tej ustawy wynosi 12 semestrów, bez względu na ich pobieranie przez studenta, z zastrzeżeniem że w ramach tego okresu świadczenia przysługują na studiach: 1) pierwszego stopnia - nie dłużej niż przez 9 semestrów; 2) drugiego stopnia - nie dłużej niż przez 7 semestrów.", "grupa": "C", "przepisy": ["art. 93 ust. 4 P.s.w.n.", "art. 184 ust. 5 P.s.w.", "art. 173 P.s.w.", "art. 86 ust. 1 pkt 1-4 P.s.w.n.", "art. 359 ust. 1 P.s.w.n."], "gold_id": null, "gold_code": null, "sim": 0.213, "niepewne": false, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 0.062, "r": 0.474, "f": 0.109}, "rouge2": {"p": 0.028, "r": 0.222, "f": 0.049}, "rougeL": {"p": 0.055, "r": 0.421, "f": 0.097}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Stanowi zestawienie i parafrazę treści dwóch różnych przepisów bez ich interpretacji lub wypełnienia luki."}, "sim_emb": 0.622, "najblizsza_emb": "III OSK 2732/23_2", "grupa_emb": "C", "sim_rouge": 0.421, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "o wynagrodzeniu dla pełnomocnika z urzędu rozstrzyga zawsze wojewódzki sąd administracyjny w postępowaniu uregulowanym w art. 250 i następnych Prawa o postępowaniu przed sądami administracyjnymi.", "grupa": "B", "przepisy": ["art. 250 P.p.s.a."], "gold_id": "III OSK 2732/23_3", "gold_code": "1", "sim": 1.0, "niepewne": false, "najblizsza_id": "III OSK 2732/23_3", "rouge": {"rouge1": {"p": 1.0, "r": 1.0, "f": 1.0}, "rouge2": {"p": 1.0, "r": 1.0, "f": 1.0}, "rougeL": {"p": 1.0, "r": 1.0, "f": 1.0}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Jest to jedynie stwierdzenie kompetencji organu do rozstrzygnięcia kwestii wynagrodzenia, wynikające wprost z przepisów."}, "sim_emb": 1.0, "najblizsza_emb": "III OSK 2732/23_3", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OSK 2732/23_3", "grupa_rouge": "B"}, {"sygnatura": "III OPS 2/25", "tekst": "Przejawem rozbieżności jest sytuacja, w której zagadnienie prawne wynikające z określonych przepisów nie było w dotychczasowym orzecznictwie rozstrzygane w sposób jednolity, w konsekwencji wydawane są przez sądy różne rozstrzygnięcia na tej samej podstawie prawnej i w analogicznym stanie faktycznym", "grupa": "C", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.189, "niepewne": false, "najblizsza_id": "III OPS 2/25_1", "rouge": {"rouge1": {"p": 0.256, "r": 0.312, "f": 0.282}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.179, "r": 0.219, "f": 0.197}}, "sedzia": {"label": "teza", "code": null, "reason": "Zdanie definiuje pojęcie rozbieżności w orzecznictwie jako przesłankę do podjęcia uchwały abstrakcyjnej."}, "sim_emb": 0.757, "najblizsza_emb": "III OPS 2/25_2", "grupa_emb": "C", "sim_rouge": 0.278, "najblizsza_rouge": "III OPS 2/25_2", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Naczelny Sąd Administracyjny w postanowieniu wydanym w składzie siedmiu sędziów Naczelnego Sądu Administracyjnego z 17 grudnia 2014 r. sygn. akt II OPS 2/14, dotyczącym przesłanek podjęcia uchwały abstrakcyjnej wskazał nadto, że przez istnienie rozbieżności należy rozumieć nie tylko różnice poglądów prawnych wyrażanych w orzecznictwie, ale także tendencję do utrwalania się określonych stanowisk interpretacyjnych", "grupa": "C", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.27, "niepewne": false, "najblizsza_id": "III OPS 2/25_4", "rouge": {"rouge1": {"p": 0.111, "r": 0.4, "f": 0.174}, "rouge2": {"p": 0.038, "r": 0.143, "f": 0.06}, "rougeL": {"p": 0.093, "r": 0.333, "f": 0.145}}, "sedzia": {"label": "teza", "code": null, "reason": "Przywołuje i przyjmuje interpretację z innego orzeczenia, rozszerzając pojęcie rozbieżności o tendencję do utrwalania stanowisk."}, "sim_emb": 0.777, "najblizsza_emb": "III OPS 2/25_1", "grupa_emb": "C", "sim_rouge": 0.333, "najblizsza_rouge": "III OPS 2/25_4", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Rozbieżność w orzecznictwie musi być trwała i rzeczywista, co z kolei implikuje i pogłębia dalsze niejednolite stosowanie prawa", "grupa": "B", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": "III OPS 2/25_2", "gold_code": "6", "sim": 0.977, "niepewne": false, "najblizsza_id": "III OPS 2/25_2", "rouge": {"rouge1": {"p": 1.0, "r": 1.0, "f": 1.0}, "rouge2": {"p": 1.0, "r": 1.0, "f": 1.0}, "rougeL": {"p": 1.0, "r": 1.0, "f": 1.0}}, "sedzia": {"label": "nie_teza", "code": "6", "reason": "Zdanie jest kołowe i puste; nie definiuje, po czym rozpoznać trwałość i rzeczywistość rozbieżności."}, "sim_emb": 0.999, "najblizsza_emb": "III OPS 2/25_2", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OPS 2/25_2", "grupa_rouge": "B"}, {"sygnatura": "III OPS 2/25", "tekst": "W konsekwencji, przedmiotem uchwały abstrakcyjnej nie mogą być przepisy, które nie stanowiły podstawy prawnej orzekania, albo te przepisy, które stanowiąc taką podstawę prawną, nie wywołały rozbieżności w orzecznictwie", "grupa": "C", "przepisy": ["art. 15 § 1 pkt 2 P. iązek", "grupa": "C", "przepisy": ["art. 34 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.188, "niepewne": false, "najblizsza_id": "III OPS 2/25_5", "rouge": {"rouge1": {"p": 0.16, "r": 0.267, "f": 0.2}, "rouge2": {"p": 0.042, "r": 0.071, "f": 0.053}, "rougeL": {"p": 0.16, "r": 0.267, "f": 0.2}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Stanowi jedynie parafrazę treści przepisu, wskazując na fakultatywność ustanowienia pełnomocnika."}, "sim_emb": 0.688, "najblizsza_emb": "III OPS 2/25_5", "grupa_emb": "C", "sim_rouge": 0.273, "najblizsza_rouge": "III OPS 2/25_3", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Do dochowania warunków formalnych pisma procesowego nie wystarcza złożenie przez pełnomocnika dowolnego pełnomocnictwa, lecz musi to być dokument pełnomocnictwa odpowiadający niezbędnym wymaganiom przypisanym dla pełnomocnictwa procesowego, z którego wynika upoważnienie do działania w imieniu strony w danej sprawie", "grupa": "C", "przepisy": ["art. 37 § 1 P.p.s.a.", "art. 46 § 3 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.307, "niepewne": false, "najblizsza_id": "III OPS 2/25_5", "rouge": {"rouge1": {"p": 0.211, "r": 0.533, "f": 0.302}, "rouge2": {"p": 0.054, "r": 0.143, "f": 0.078}, "rougeL": {"p": 0.105, "r": 0.267, "f": 0.151}}, "sedzia": {"label": "teza", "code": null, "reason": "Doprecyzowuje wymogi formalne pełnomocnictwa, wskazując, że musi ono odpowiadać konkretnym wymaganiom pełnomocnictwa procesowego."}, "sim_emb": 0.78, "najblizsza_emb": "III OPS 2/25_5", "grupa_emb": "C", "sim_rouge": 0.278, "najblizsza_rouge": "III OPS 2/25_6", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Zatem sąd i strona przeciwna może uznać za pełnomocnika tylko osobę działającą z właściwym umocowaniem, która wykaże swe umocowanie odpowiednim dokumentem pełnomocnictwa", "grupa": "C", "przepisy": ["art. 37 § 1 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.21, "niepewne": false, "najblizsza_id": "III cji."}, {"typ": "FN", "sygnatura": "II Ka 215/13", "gold_id": "II Ka 215/13_2", "gold_code": null, "tekst": "Kolejnym uchybieniem Sądu Rejonowego, które należy zauważyć jest łączne i jednoczesne stosowanie dwóch różnych instytucji normujących wydawanie wyroku łącznego. Sąd I instancji łącznie w tym samym zakresie stosuje instytucję umorzenia postepowania w sprawie o wydanie wyroku łącznego regulowaną przez art. 572 k.p.k. oraz instytucję odrębnego wykonywania łączonych wyroków jednostkowych w zakresie w jakim nie zostały objęte wyrokiem łącznym – regulowaną przez art. 576 § 1 k.p.k. Sąd Rejonowy nie dostrzega, iż są to dwie odrębne i w zasadzie konkurencyjne uregulowania i łączne ich stosowanie co do tych samych elementów łączonych wyroków jednostkowych jest błędne.", "decyzja": "nie_teza", "kod": "2", "uzasadnienie": "Opisuje błąd stosowania przepisów w tej sprawie, nie formułuje ogólnej zasady."}, {"typ": "FN", "sygnatura": "II AKa 169/20", "gold_id": "II AKa 169/20_5", "gold_code": null, "tekst": "Wady uzasadnienia wykazane wyżej, nawet o charakterze rażącym – jak w rozpoznawanej sprawie – nie mogą jednak stanowić podstawy uchylenia wyroku. Stosownie do treści art. 455 lit. a k.p.k., nie można uchylić wyroku z tego powodu, że jego uzasadnienie nie spełnia wymogów określonych w art. 424 k.p.k.", "decyzja": "nie_teza", "kod": "1", "uzasadnienie": "Parafraza przepisu art. 455 lit. a k.p.k. bez dodatkowej interpretacji."}, {"typ": "FP", "sygnatura": "III OPS 2/25", "gold_id": "III OPS 2/25_1", "gold_code": "1", "tekst": "Zgodnie z art. 15 § 1 pkt 2 P.p.s.a., warunkiem rozpoznania wniosku uprawnionego podmiotu o podjęcie uchwały jest wystąpienie sytuacji, gdy stosowanie przepisu, który ma być wyjaśniany, wywołało rozbieżności w orzecznictwie sądów administracyjnych. Przejawem rozbieżności jest sytuacja, w której zagadnienie prawne wynikające z określonych przepisów nie było w dotychczasowym orzecznictwie rozstrzygane w sposób jednolity, w konsekwencji wydawane są przez sądy różne rozstrzygnięcia na tej samej podstawie prawnej i w analogicznym stanie faktycznym", "decyzja": "teza", "kod": null, "uzasadnienie": "Zawiera interpretację pojęcia 'rozbieżności w orzecznictwie', wypełniając lukę w przepisie art. 15 § 1 pkt 2 P.p.s.a."}, {"typ": "FP", "sygnatura": "III OPS 2/25", "gold_id": "III OPS 2/25_3", "gold_code": "1", "tekst": "Zgodnie z art. 268 P.p.s.a., wniosek o podjęcie uchwały wymaga uzasadnienia. W uzasadnieniu wniosku należy wskazać konkretne przepisy prawa oraz to, w jaki sposób ich stosowanie wywołało w orzecznictwie sądów administracyjnych rozbieżności", "decyzja": "teza", "kod": null, "uzasadnienie": "Precyzuje wymogi uzasadnienia wniosku, interpretując art. 268 P.p.s.a."}]}, "zgodnosc_sedziego_n": 16, "potwierdzone": 8, "potwierdzone_A": 3, "potwierdzone_B": 2, "potwierdzone_poza_arkuszem": 3, "precyzja_potwierdzonych": 0.6, "kompletnosc_potwierdzonych": 0.2, "wiersze": [{"sygnatura": "I OPS 1/25", "tekst": "Naczelny Sąd Administracyjny w składzie siedmiu sędziów stwierdza, że zakres przedmiotowy uchwały Naczelnego Sądu Administracyjnego z dnia 14 listopada 2022 r. sygn. akt I OPS 2/22 nie jest tożsamy z zakresem przedmiotowym zagadnienia prawnego przedstawionego w powołanym postanowieniu.", "grupa": "C", "przepisy": ["art. 269 § 1 p.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.242, "niepewne": false, "najblizsza_id": "I OPS 1/25_3", "rouge": {"rouge1": {"p": 0.205, "r": 0.195, "f": 0.2}, "rouge2": {"p": 0.053, "r": 0.05, "f": 0.051}, "rougeL": {"p": 0.128, "r": 0.122, "f": 0.125}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Odnosi się do konkretnego orzeczenia (sygn. I OPS 2/22) i faktycznego zakresu sprawy tej instancji."}, "sim_emb": 0.647, "najblizsza_emb": "I OPS 1/25_2", "grupa_emb": "C", "sim_rouge": 0.122, "najblizsza_rouge": "I OPS 1/25_3", "grupa_rouge": "C"}, {"sygnatura": "I OPS 1/25", "tekst": "Naczelny Sąd Administracyjny w składzie siedmiu sędziów stwierdza, że przedstawione prze ne": false, "najblizsza_id": "II Ka 215/13_1", "rouge": {"rouge1": {"p": 0.507, "r": 0.923, "f": 0.655}, "rouge2": {"p": 0.414, "r": 0.763, "f": 0.537}, "rougeL": {"p": 0.479, "r": 0.872, "f": 0.618}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Parafrazuje przepisy dotyczące wydawania wyroku łącznego bez interpretacji."}, "sim_emb": 0.949, "najblizsza_emb": "II Ka 215/13_1", "grupa_emb": "A", "sim_rouge": 0.872, "najblizsza_rouge": "II Ka 215/13_1", "grupa_rouge": "A"}, {"sygnatura": "II Ka 215/13", "tekst": "Kolejnym uchybieniem Sądu Rejonowego, które należy zauważyć jest łączne i jednoczesne stosowanie dwóch różnych instytucji normujących wydawanie wyroku łącznego. Sąd I instancji łącznie w tym samym zakresie stosuje instytucję umorzenia postepowania w sprawie o wydanie wyroku łącznego regulowaną przez art. 572 k.p.k. oraz instytucję odrębnego wykonywania łączonych wyroków jednostkowych w zakresie w jakim nie zostały objęte wyrokiem łącznym – regulowaną przez art. 576 § 1 k.p.k. Sąd Rejonowy nie dostrzega, iż są to dwie odrębne i w zasadzie konkurencyjne uregulowania i łączne ich stosowanie co do tych samych elementów łączonych wyroków jednostkowych jest błędne.", "grupa": "A", "przepisy": ["art. 572 k.p.k.", "art. 576 § 1 k.p.k."], "gold_id": "II Ka 215/13_2", "gold_code": null, "sim": 0.701, "niepewne": false, "najblizsza_id": "II Ka 215/13_2", "rouge": {"rouge1": {"p": 0.522, "r": 0.941, "f": 0.671}, "rouge2": {"p": 0.363, "r": 0.66, "f": 0.468}, "rougeL": {"p": 0.489, "r": 0.882, "f": 0.629}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Opisuje błąd stosowania przepisów w tej sprawie, nie formułuje ogólnej zasady."}, "sim_emb": 0.922, "najblizsza_emb": "II Ka 215/13_2", "grupa_emb": "A", "sim_rouge": 0.882, "najblizsza_rouge": "II Ka 215/13_2", "grupa_rouge": "A"}, {"sygnatura": "II AKa 169/20", "tekst": "Konkludując, na gruncie prawa do rzetelnego procesu, tak pierwszoinstancyjnego, jak i odwoławczego, czy kasacyjnego zarówno w ujęciu konwencyjnym na tle art. 6 ust. 1 EKPCz), jak i w ujęciu standardu konstytucyjnego na tle art. 45 ust. 1 Konstytucji RP, jakość uzasadnienia wyroku jest istotnym elementem tego prawa.", "grupa": "C", "przepisy": ["art. 6 ust. 1 EKPCz", "art. 45 ust. 1 Konstytucji RP"], "gold_id": null, "gold_code": null, "sim": 0.262, "niepewne": false, "najblizsza_id": "II AKa 169/20_4", "rouge": {"rouge1": {"p": 0.383, "r": 0.281, "f": 0.324}, "rouge2": {"p": 0.152, "r": 0.111, "f": 0.128}, "rougeL": {"p": 0.277, "r": 0.203, "f": 0.234}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Stwierdzenie brzmi jak parafraza znanej zasady prawa procesowego."}, "sim_emb": 0.807, "najblizsza_emb": "II AKa 169/20_1", "grupa_emb": "C", "sim_rouge": 0.237, "najblizsza_rouge": "II AKa 169/20_1", "grupa_rouge": "C"}, {"sygnatura": "II AKa 169/20", "tekst": "Brak takiego wyjaśnienia i oceny uniemożliwia odparcie zarzutu przekroczenia przez sąd granic swobodnej oceny dowodów i czyni taki zarzut zasadnym.", "grupa": "C", "przepisy": ["art. 424 § 1 k.p.k."], "gold_id": null, "gold_code": null, "sim": 0.136, "niepewne": false, "najblizsza_id": "II AKa 169/20_3", "rouge": {"rouge1": {"p": 0.3, "r": 0.075, "f": 0.12}, "rouge2": {"p": 0.053, "r": 0.013, "f": 0.02}, "rougeL": {"p": 0.25, "r": 0.062, "f": 0.1}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Odnosi się do stanu faktycznego rozpoznawanej sprawy."}, "sim_emb": 0.745, "najblizsza_emb": "II AKa 169/20_5", "grupa_emb": "C", "sim_rouge": 0.065, "najblizsza_rouge": "II AKa 169/20_2", "grupa_rouge": "C"}, {"sygnatura": "II AKa 169/20", "tekst": "Wady uzasadnienia wykazane wyżej, nawet o charakterze rażącym – jak w rozpoznawanej sprawie – nie mogą jednak stanowić podstawy uchylenia wyroku. Stosownie do treści art. 455 lit. a k.p.k., nie można uchylić wyroku z tego powodu, że jego uzasadnienie nie spełnia wymogów określonych w art. 424 k.p.k.", "grupa": "A", "przepisy": ["art. 424 k.p.k.", "art. 455 lit. a k.p.k."], "gold_id": "II AKa 169/20_5", "gold_code": null, "sim": 0.412, "niepewne": true, "najblizsza_id": "II AKa 169/20_5", "rouge": {"rouge1": {"p": 0.333, "r": 0.556, "f": 0.417}, "rouge2": {"p": 0.182, "r": 0.308, "f": 0.229}, "rougeL": {"p": 0.289, "r": 0.481, "f": 0.361}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Parafraza przepisu art. 455 lit. a k.p.k. bez dodatkowej interpretacji."}, "sim_emb": 0.861, "najblizsza_emb": "II AKa 169/20_5", "grupa_emb": "A", "sim_rouge": 0.481, "najblizsza_rouge": "II AKa 169/20_5", "grupa_rouge": "C"}, {"sygnatura": "II AKa 169/20", "tekst": "W sprawie zachodzi konieczność przeprowadzenia na nowo przewodu sądowego w całości. Wskazane w części pierwszej uchybienia i to o charakterze rażącym, dotyczące rażącej obrazy art. 7 k.p.k., w konsekwencji których sąd pierwszej instancji błędnie ustalił stan faktyczny co do obu przypisanych R. C. (1) czynów, uniemożliwiają ich konwalidację w postępowaniu apelacyjnym z uwagi na ograniczony zakres tego postępowania.", "grupa": "C", "przepisy": ["art. 7 k.p.k.", "art. 437 § 2 k.p.k."], "gold_id": null, "gold_code": null, "sim": 0.242, "niepewne": false, "najblizsza_id": "II AKa 169/20_3", "rouge": {"rouge1": {"p": 0.328, "r": 0.237, "f": 0.275}, "rouge2": {"p": 0.053, "r": 0.038, "f": 0.044}, "rougeL": {"p": 0.172, "r": 0.125, "f": 0.145}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Opisuje konkretną sytuację faktyczną rozpoznawanej sprawy."}, "sim_emb": 0.737, "najblizsza_emb": "II AKa 169/20_1", "grupa_emb": "C", "sim_rouge": 0.185, "najblizsza_rouge": "II AKa 169/20_5", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "Zgodnie bowiem z treścią art. 233 § 6 kk , sprawca odpowiada za podanie nieprawdy lub zatajenie prawdy w oświadczeniu, które ma służyć za dowód w postępowaniu innym niż sądowe, prowadzonym na podstawie ustawy, jeżeli przepisy takiej ustawy przewidują możliwość odbierania takiego oświadczenia pod rygorem odpowiedzialności karnej.", "grupa": "C", "przepisy": ["art. 233 § 6 kk"], "gold_id": null, "gold_code": null, "sim": 0.236, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 0.244, "r": 0.131, "f": 0.171}, "rouge2": {"p": 0.045, "r": 0.024, "f": 0.031}, "rougeL": {"p": 0.156, "r": 0.083, "f": 0.109}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Tekst jest parafrazą przepisu art. 233 § 6 kk bez dodatkowej interpretacji."}, "sim_emb": 0.818, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "C", "sim_rouge": 0.1, "najblizsza_rouge": "III K 1961/20_2", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "Upoważnienie do uprzedzenia o odpowiedzialności karnej za złożenie fałszywego oświadczenia, o którym mowa w art. 233 § 6 kk musi wynikać z ustawy, na podstawie której prowadzone jest postępowanie.", "grupa": "C", "przepisy": ["art. 233 § 6 kk"], "gold_id": null, "gold_code": null, "sim": 0.234, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 0.429, "r": 0.143, "f": 0.214}, "rouge2": {"p": 0.074, "r": 0.024, "f": 0.036}, "rougeL": {"p": 0.214, "r": 0.071, "f": 0.107}}, "sedzia": {"label": "teza", "code": null, "reason": "Zawiera interpretację przepisu, że upoważnienie do ostrzeżenia musi wynikać z ustawy."}, "sim_emb": 0.81, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "C", "sim_rouge": 0.1, "najblizsza_rouge": "III K 1961/20_2", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "Umyślność może w tym wypadku przejawiać się zamiarem bezpośrednim albo wynikowym. Minimalnym warunkiem spełnienia znamion strony podmiotowej w odniesieniu do omawianego przestępstwa jest przewidywanie przez sprawcę nieprawdziwości jego oświadczeń o posiadanych wiadomościach na temat faktów badanych w postępowaniu i zarazem godzenie się z tym stanem, wyrażające się złożeniem takich zeznań w formie przewidzianej przez prawo procesowe.", "grupa": "A", "przepisy": ["art. 233 § 1 kk"], "gold_id": "III K 1961/20_1", "gold_code": null, "sim": 0.857, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 1.0, "r": 0.667, "f": 0.8}, "rouge2": {"p": 1.0, "r": 0.663, "f": 0.797}, "rougeL": {"p": 1.0, "r": 0.667, "f": 0.8}}, "sedzia": {"label": "teza", "code": null, "reason": "Definiuje warunki znamion strony podmiotowej, wskazując na wymaganą świadomość fałszywości."}, "sim_emb": 0.882, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "A", "sim_rouge": 0.667, "najblizsza_rouge": "III K 1961/20_1", "grupa_rouge": "A"}, {"sygnatura": "III K 1961/20", "tekst": "Tym samym działał on z ewidentnym zamiarem i to co najmniej wynikowym, mógł bowiem zdawać sobie sprawę z nieprawdziwości swoich oświadczeń złożonych w przepisanych formach procesowych przed organem administracyjnym.", "grupa": "C", "przepisy": ["art. 233 § 1 kk"], "gold_id": null, "gold_code": null, "sim": 0.246, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 0.379, "r": 0.131, "f": 0.195}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.276, "r": 0.095, "f": 0.142}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Odnosi się bezpośrednio do stanu faktycznego sprawy (świadomość sprawcy w konkretnym przypadku)."}, "sim_emb": 0.693, "najblizsza_emb": "III K 1961/20_2", "grupa_emb": "C", "sim_rouge": 0.095, "najblizsza_rouge": "III K 1961/20_1", "grupa_rouge": "C"}, {"sygnatura": "I KK 97/26", "tekst": "Niezmiennie Sąd Najwyższy podkreśla, że owe skutki mogą zaistnieć wówczas, gdy już pobieżna analiza wniesionej kasacji świadczy o jej zasadności, a tym samym o konieczności uchylenia zaskarżonego nią wyroku.", "grupa": "A", "przepisy": ["art. 532 § 1 k.p.k."], "gold_id": "I KK 97/26_2", "gold_code": null, "sim": 0.777, "niepewne": false, "najblizsza_id": "I KK 97/26_2", "rouge": {"rouge1": {"p": 0.793, "r": 0.793, "f": 0.793}, "rouge2": {"p": 0.75, "r": 0.75, "f": 0.75}, "rougeL": {"p": 0.793, "r": 0.793, "f": 0.793}}, "sedzia": {"label": "teza", "code": null, "reason": "Zawiera interpretację przepisu, określając warunek zasadności kasacji i konieczności uchylenia wyroku."}, "sim_emb": 0.873, "najblizsza_emb": "I KK 97/26_2", "grupa_emb": "A", "sim_rouge": 0.793, "najblizsza_rouge": "I KK 97/26_2", "grupa_rouge": "A"}, {"sygnatura": "I KK 97/26", "tekst": "Dokonując wstępnej kontroly zaskarżonego kasacją wyroku, Sąd Najwyższy nie znalazł podstaw do jednoznacznego uznania, iż uwzględnienie podniesionych w kasacji zarzutów jest na tyle prawdopodobne, że uzasadniałoby wstrzymanie wykonania orzeczonych wobec skazanej A. Ś. kar.", "grupa": "C", "przepisy": ["art. 532 § 1 k.p.k."], "gold_id": null, "gold_code": null, "sim": 0.212, "niepewne": false, "najblizsza_id": "I KK 97/26_1", "rouge": {"rouge1": {"p": 0.324, "r": 0.289, "f": 0.306}, "rouge2": {"p": 0.03, "r": 0.027, "f": 0.029}, "rougeL": {"p": 0.118, "r": 0.105, "f": 0.111}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Odnosi się do konkretnych okoliczności sprawy (skazanej A. Ś.) i oceny prawnej w kontekście tej sprawy."}, "sim_emb": 0.785, "najblizsza_emb": "I KK 97/26_2", "grupa_emb": "C", "sim_rouge": 0.143, "najblizsza_rouge": "I KK 97/26_3", "grupa_rouge": "C"}, {"sygnatura": "I KK 97/26", "tekst": "Z kolei okoliczności dotyczące wieku skazanej, czy jej stanu zdrowia nie stanowią przesłanek do zastosowania instytucji wstrzymania wykonania orzeczenia. Okoliczności te mogą okazać się przydatnymi w ewentualnym postępowaniu o przerwę w wykonaniu kary w trybie art. 153 k.k.w. lub odroczenie jej wykonania na podstawie art. 151 k.k.w., nie mogą jednak być przesłanką do zastosowania instytucji uregulowanej w art. 532 § 1 k.p.k.", "grupa": "A", "przepisy": ["art. 153 k.k.w.", "art. 151 k.k.w.", "art. 532 § 1 k.p.k."], "gold_id": "I KK 97/26_3", "gold_code": null, "sim": 0.684, "niepewne": false, "najblizsza_id": "I KK 97/26_3", "rouge": {"rouge1": {"p": 0.492, "r": 0.857, "f": 0.625}, "rouge2": {"p": 0.4, "r": 0.706, "f": 0.511}, "rougeL": {"p": 0.475, "r": 0.829, "f": 0.604}}, "sedzia": ouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Naczelny Sąd Administracyjny bada przy tym wszystkie podniesione przez stronę skarżącą kasacyjnie zarzuty naruszenia prawa (tak NSA w uchwale pełnego składu z 26 października 2009 r. sygn. akt I OPS 10/09, opubl. w ONSAiWSA 2010 z. 1 poz. 1).", "grupa": "B", "przepisy": ["art. 183 P.p.s.a."], "gold_id": "III OSK 2732/23_1", "gold_code": "1", "sim": 0.579, "niepewne": false, "najblizsza_id": "III OSK 2732/23_1", "rouge": {"rouge1": {"p": 0.375, "r": 1.0, "f": 0.545}, "rouge2": {"p": 0.359, "r": 1.0, "f": 0.528}, "rougeL": {"p": 0.375, "r": 1.0, "f": 0.545}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Parafraza przepisu prawa bez dodatkowej interpretacji."}, "sim_emb": 0.913, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "B"}, {"sygnatura": "III OSK 2732/23", "tekst": "Zgodnie z art. 174 P.p.s.a. skargę kasacyjną można oprzeć na następujących podstawach: 1) naruszeniu prawa materialnego przez błędną jego wykładnię lub niewłaściwe zastosowanie, a także 2) naruszeniu przepisów postępowania, jeżeli uchybienie to mogło mieć istotny wpływ na wynik sprawy.", "grupa": "C", "przepisy": ["art. 174 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.181, "niepewne": false, "najblizsza_id": "III OSK 2732/23_3", "rouge": {"rouge1": {"p": 0.103, "r": 0.16, "f": 0.125}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.103, "r": 0.16, "f": 0.125}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Parafraza przepisu prawa bez dodatkowej interpretacji."}, "sim_emb": 0.614, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "C", "sim_rouge": 0.2, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Stosownie do treści art. 176 P.p.s.a. strona skarżąca kasacyjnie ma obowiązek przytoczyć podstawy skargi kasacyjnej wnoszonej od wyroku Sądu pierwszej instancji i szczegółowo je uzasadnić wskazując, które przepisy ustawy zostały naruszone, na czym to naruszenie polegało i jaki miało wpływ na wynik sprawy.", "grupa": "C", "przepisy": ["art. 176 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.186, "niepewne": false, "najblizsza_id": "III OSK 2732/23_1", "rouge": {"rouge1": {"p": 0.116, "r": 0.333, "f": 0.172}, "rouge2": {"p": 0.048, "r": 0.143, "f": 0.071}, "rougeL": {"p": 0.093, "r": 0.267, "f": 0.138}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Parafraza przepisu prawa bez dodatkowej interpretacji."}, "sim_emb": 0.686, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "C", "sim_rouge": 0.267, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Skarga kasacyjna nie jest zasadna, a zaskarżony wyrok odpowiada prawu.", "grupa": "C", "przepisy": ["art. 184 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.104, "niepewne": false, "najblizsza_id": "III OSK 2732/23_1", "rouge": {"rouge1": {"p": 0.1, "r": 0.067, "f": 0.08}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.1, "r": 0.067, "f": 0.08}}, "sedzia": {"label": "nie_teza", "code": "3", "reason": "Stwierdzenie sentencyjne orzeczenia."}, "sim_emb": 0.63, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "C", "sim_rouge": 0.067, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Strona skarżąca kasacyjnie podniosła jedynie zarzut naruszenia przez Sąd pierwszej instancji przepisów prawa materialnego polegający na dokonaniu błędnej wykładni art. 184 ust. 5 w związku z art. 173 P.s.w. poprzez przyjęcie, że sformułowanie 'przez okres 3 lat' oznacza okres trzech lat dalszego kształcenia się rozumianego jako łączny czas kiedy dana osoba miała status studenta, podczas gdy przedmiotowe sformułowanie oznacza okres trzech lat, w którym danej osobie przysługuje możliwość pobierania świadczenia, o którym mowa w art. 173 ww. ustawy.", "grupa": "C", "przepisy": ["art. 184 ust. 5 P.s.w.", "art. 173 P.s.w."], "gold_id": null, "gold_code": null, "sim": 0.176, "niepewne": false, "najblizsza_id": "III OSK 2732/23_1", "rouge": {"rouge1": {"p": 0.115, "r": 0.6, "f": 0.194}, "rouge2": {"p": 0.039, "r": 0.214, "f": 0.066}, "rougeL": {"p": 0.077, "r": 0.4, "f": 0.129}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Opis stanu faktycznego rozpoznawanej sprawy."}, "sim_emb": 0.598, "najblizsza_emb": "III OSK 2732/23_2", "grupa_emb": "C", "sim_rouge": 0.4, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Tym samym w kontrolowanej przez Sąd pierwszej instancji sprawie administracyjnej ani art. 173 P.s.w., ani też art. 184 ust. 5 P.s.w. nie miały zastosowania. Postępowanie administracyjne zostało wszczęte na wniosek z dnia 21 lutego 2021 r. a decyzja organu drugiej instancji została wydana w dniu 8 czerwca 2022 r. Organy nie stosowały przepisów ustawy Prawo o szkolnictwie wyższym, tylko przepisy ustawy z dnia 20 lipca 2018 r. Prawo o szkolnictwie wyższym i nauce (Dz. U. z 2022 r. poz. 574 z późn. zm.), dalej P.s.w.n.", "grupa": "C", "przepisy": ["art. 173 P.s.w.", "art. 184 ust. 5 P.s.w.", "art. 169 pkt 3 ustawy z dnia 3 lipca 2018 r."], "gold_id": null, "gold_code": null, "sim": 0.166, "niepewne": false, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 0.094, "r": 0.421, "f": 0.154}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.047, "r": 0.211, "f": 0.077}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Opis stanu faktycznego rozpoznawanej sprawy."}, "sim_emb": 0.65, "najblizsza_emb": "III OSK 2732/23_2", "grupa_emb": "C", "sim_rouge": 0.211, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Art. 173 ust. 1 pkt 1 P.s.w. regulował jedną z form pomocy materialnej dla studentów w postaci stypendium socjalnego i także art. 86 ust. 1 pkt 1 P.s.w.n. określa formę pomocy materialnej jako stypendium socjalne. Można więc stwierdzić, że przepisy te określały podobne formy pomocy materialnej.", "grupa": "C", "przepisy": ["art. 173 ust. 1 pkt 1 P.s.w.", "art. 86 ust. 1 pkt 1 P.s.w.n."], "gold_id": null, "gold_code": null, "sim": 0.265, "niepewne": false, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 0.152, "r": 0.368, "f": 0.215}, "rouge2": {"p": 0.022, "r": 0.056, "f": 0.032}, "rougeL": {"p": 0.109, "r": 0.263, "f": 0.154}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Parafraza przepisu prawa bez dodatkowej interpretacji."}, "sim_emb": 0.669, "najblizsza_emb": "III OSK 2732/23_2", "grupa_emb": "C", "sim_rouge": 0.263, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Normy prawne zawarte w art. 93 ust. 4 P.s.w.n. i art. 184 ust. 5 P.s.w. nie są tożsame. Zgodnie z art. 184 ust. 5 P.s.w. studentowi, który po ukończeniu jednego kierunku studiów kontynuował naukę na drugim kierunku studiów, nie przysługiwały świadczenia o których mowa w art. 173 P.s.w., chyba że kontynuował on studia po ukończeniu studiów pierwszego stopnia w celu uzyskania tytułu zawodowego magistra lub równorzędnego, jednakże nie dłużej niż przez okres trzech lat.", "grupa": "C", "przepisy": ["art. 93 ust. 4 P.s.w.n.", "art. 184 ust. 5 P.s.w.", "art. 173 P.s.w."], "gold_id": null, "gold_code": null, "sim": 0.14, "niepewne": false, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 0.095, "r": 0.368, "f": 0.151}, "rouge2": {"p": 0.055, "r": 0.222, "f": 0.088}, "rougeL": {"p": 0.095, "r": 0.368, "f": 0.151}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Parafraza przepisu prawa bez dodatkowej interpretacji."}, "sim_emb": 0.66, "najblizsza_emb": "III OSK 2732/23_2", "grupa_emb": "C", "sim_rouge": 0.368, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Natomiast stosownie do treści art. 93 ust. 4 P.s.w.n. łączny okres, przez który przysługują świadczenia, o których mowa w art. 86 ust. 1 pkt 1-4 i art. 359 ust. 1 tej ustawy wynosi 12 semestrów, bez względu na ich pobieranie przez studenta, z zastrzeżeniem że w ramach tego okresu świadczenia przysługują na studiach: 1) pierwszego stopnia - nie dłużej niż przez 9 semestrów; 2) drugiego stopnia - nie dłużej niż przez 7 semestrów. Art. 93 ust. 4 P.s.w.n. stanowił w tej sprawie podstawę do rozstrzygania administracyjnego w przedmiocie odmowy przyznania stypendium socjalnego.", "grupa": "B", "przepisy": ["art. 93 ust. 4 P.s.w.n.", "art. 86 ust. 1 pkt 1-4 P.s.w.n.", "art. 359 ust. 1 P.s.w.n."], "gold_id": "III OSK 2732/23_2", "gold_code": "4", "sim": 0.483, "niepewne": true, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 0.209, "r": 1.0, "f": 0.345}, "rouge2": {"p": 0.2, "r": 1.0, "f": 0.333}, "rougeL": {"p": 0.209, "r": 1.0, "f": 0.345}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Parafraza przepisu prawa bez dodatkowej interpretacji."}, "sim_emb": 0.798, "najblizsza_emb": "III OSK 2732/23_2", "grupa_emb": "C", "sim_rouge": 1.0, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "B"}, {"sygnatura": "III OSK 2732/23", "tekst": "Tym samym skoro w tej sprawie ani organy administracyjne nie stosowały art. 184 ust. 5 P.s.w. i art. 173 P.s.w. i Sąd pierwszej instancji trafnie kontrolując zaskarżoną decyzję nie stwierdził naruszenia prawa materialnego w zakresie zarówno zastosowania, jak i wykładni art. 93 ust. 4 i art. 86 ust. 1 pkt 1 P.s.w.n., to zarzut naruszenia prawa poprzez błędną wykładnię i niewłaściwe zastosowanie przepisów prawa materialnego, które nie mogły być i nie były w sprawie stosowanie, czyni ten zrzut bezzasadnym.", "grupa": "C", "przepisy": ["art. 184 ust. 5 P.s.w.", "art. 173 P.s.w.", "art. 93 ust. 4 P.s.w.n.", "art. 86 ust. 1 pkt 1 P.s.w.n."], "gold_id": null, "gold_code": null, "sim": 0.206, "niepewne": false, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 0.127, "r": 0.526, "f": 0.204}, "rouge2": {"p": 0.064, "r": 0.278, "f": 0.104}, "rougeL": {"p": 0.089, "r": 0.368, "f": 0.143}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Opis stanu faktycznego rozpoznawanej sprawy."}, "sim_emb": 0.655, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "C", "sim_rouge": 0.368, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Ponieważ innych zarzutów nie zawiera skarga kasacyjna, to Naczelny Sąd Administracyjny w punkcie pierwszym wyroku oddalił ją na podstawie art. 184 P.p.s.a.", "grupa": "C", "przepisy": ["art. 184 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.226, "niepewne": false, "najblizsza_id": "III OSK 2732/23_1", "rouge": {"rouge1": {"p": 0.227, "r": 0.333, "f": 0.27}, "rouge2": {"p": 0.095, "r": 0.143, "f": 0.114}, "rougeL": {"p": 0.136, "r": 0.2, "f": 0.162}}, "sedzia": {"label": "nie_teza", "code": "3", "reason": "Stwierdzenie sentencyjne orzeczenia."}, "sim_emb": 0.671, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "C", "sim_rouge": 0.2, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "W odniesieniu do zawartego w skardze kasacyjnej wniosku o przyznanie kosztów nieopłaconej pomocy prawnej udzielonej z urzędu należy wyjaśnić, że o wynagrodzeniu dla pełnomocnika z urzędu rozstrzyga zawsze wojewódzki sąd administracyjny w postępowaniu uregulowanym w art. 250 i następnych Prawa o postępowaniu przed sądami administracyjnymi. Zgodnie z art. 254 § 1 P.p.s.a. wniosek o przyznanie kosztów nieopłaconej pomocy prawnej składa się do właściwego wojewódzkiego sądu administracyjnego. Stąd w postępowaniu kasacyjnym wniosek ten nie podlegał rozpoznaniu.", "grupa": "B", "przepisy": ["art. 250 P.p.s.a.", "art. 254 § 1 P.p.s.a."], "gold_id": "III OSK 2732/23_3", "gold_code": "1", "sim": 0.643, "niepewne": false, "najblizsza_id": "III OSK 2732/23_3", "rouge": {"rouge1": {"p": 0.338, "r": 1.0, "f": 0.505}, "rouge2": {"p": 0.329, "r": 1.0, "f": 0.495}, "rougeL": {"p": 0.338, "r": 1.0, "f": 0.505}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Parafraza przepisu prawa bez dodatkowej interpretacji."}, "sim_emb": 0.817, "najblizsza_emb": "III OSK 2732/23_3", "grupa_emb": "C", "sim_rouge": 1.0, "najblizsza_rouge": "III OSK 2732/23_3", "grupa_rouge": "B"}, {"sygnatura": "III OSK 2732/23", "tekst": "W punkcie drugim wyroku Naczelny Sąd Administracyjny stosując art. 207 § 2 P.p.s.a. uznał, że w tej sprawie zachodzi szczególny przypadek uzasadniający odstąpienie od zasądzenia w całości od strony skarżącej kasacyjnie na rzecz strony przeciwnej zwrotu kosztów postępowania kasacyjnego.", "grupa": "C", "przepisy": ["art. 207 § 2 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.238, "niepewne": false, "najblizsza_id": "III OSK 2732/23_1", "rouge": {"rouge1": {"p": 0.184, "r": 0.467, "f": 0.264}, "rouge2": {"p": 0.108, "r": 0.286, "f": 0.157}, "rougeL": {"p": 0.184, "r": 0.467, "f": 0.264}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Opis stanu faktycznego rozpoznawanej sprawy."}, "sim_emb": 0.634, "najblizsza_emb": "III OSK 2732/23_3", "grupa_emb": "C", "sim_rouge": 0.467, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Zgodnie z art. 15 § 1 pkt 2 P.p.s.a., warunkiem rozpoznania wniosku uprawnionego podmiotu o podjęcie uchwały jest wystąpienie sytuacji, gdy stosowanie przepisu, który ma być wyjaśniany, wywołało rozbieżności w orzecznictwie sądów administracyjnych. Przejawem rozbieżności jest sytuacja, w której zagadnienie prawne wynikające z określonych przepisów nie było w dotychczasowym orzecznictwie rozstrzygane w sposób jednolity, w konsekwencji wydawane są przez sądy różne rozstrzygnięcia na tej samej podstawie prawnej i w analogicznym stanie faktycznym", "grupa": "B", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": "III OPS 2/25_1", "gold_code": "1", "sim": 0.682, "niepewne": false, "najblizsza_id": "III OPS 2/25_1", "rouge": {"rouge1": {"p": 0.451, "r": 1.0, "f": 0.621}, "rouge2": {"p": 0.443, "r": 1.0, "f": 0.614}, "rougeL": {"p": 0.451, "r": 1.0, "f": 0.621}}, "sedzia": {"label": "teza", "code": null, "reason": "Zawiera interpretację pojęcia 'rozbieżności w orzecznictwie', wypełniając lukę w przepisie art. 15 § 1 pkt 2 P.p.s.a."}, "sim_emb": 0.964, "najblizsza_emb": "III OPS 2/25_1", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OPS 2/25_1", "grupa_rouge": "B"}, {"sygnatura": "III OPS 2/25", "tekst": "W konsekwencji, przedmiotem uchwały abstrakcyjnej nie mogą być przepisy, które nie stanowiły podstawy prawnej orzekania, albo te przepisy, które stanowiąc taką podstawę prawną, nie wywołały rozbieżności w orzecznictwie", "grupa": "C", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.267, "niepewne": false, "najblizsza_id": "III OPS 2/25_1", "rouge": {"rouge1": {"p": 0.286, "r": 0.25, "f": 0.267}, "rouge2": {"p": 0.148, "r": 0.129, "f": 0.138}, "rougeL": {"p": 0.286, "r": 0.25, "f": 0.267}}, "sedzia": {"label": "teza", "code": null, "reason": "Definiuje granice zastosowania uchwały abstrakcyjnej, interpretując art. 268 P.p.s.a."}, "sim_emb": 0.692, "najblizsza_emb": "III OPS 2/25_1", "grupa_emb": "C", "sim_rouge": 0.25, "najblizsza_rouge": "III OPS 2/25_1", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Zgodnie z art. 268 P.p.s.a., wniosek o podjęcie uchwały wymaga uzasadnienia. W uzasadnieniu wniosku należy wskazać konkretne przepisy prawa oraz to, w jaki sposób ich stosowanie wywołało w orzecznictwie sądów administracyjnych rozbieżności", "grupa": "B", "przepisy": ["art. 268 P.p.s.a."], "gold_id": "III OPS 2/25_3", "gold_code": "1", "sim": 0.616, "niepewne": false, "najblizsza_id": "III OPS 2/25_3", "rouge": {"rouge1": {"p": 0.344, "r": 1.0, "f": 0.512}, "rouge2": {"p": 0.323, "r": 1.0, "f": 0.488}, "rougeL": {"p": 0.344, "r": 1.0, "f": 0.512}}, "sedzia": {"label": "teza", l art. 85 k.k. z karami objętymi wyrokiem łącznym.", "grupa": "A", "przepisy": ["art. 575 § 1 k.p.k.", "art. 85 k.k."], "gold_id": "II Ka 215/13_1", "gold_code": null, "sim": 0.853, "niepewne": false, "najblizsza_id": "II Ka 215/13_1", "rouge": {"rouge1": {"p": 0.783, "r": 0.923, "f": 0.847}, "rouge2": {"p": 0.644, "r": 0.763, "f": 0.699}, "rougeL": {"p": 0.739, "r": 0.872, "f": 0.8}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Parafrazuje przepis art. 575 § 1 k.p.k. bez dodatkowej interpretacji."}, "sim_emb": 0.975, "najblizsza_emb": "II Ka 215/13_1", "grupa_emb": "A", "sim_rouge": 0.872, "najblizsza_rouge": "II Ka 215/13_1", "grupa_rouge": "A"}, {"sygnatura": "II Ka 215/13", "tekst": "Sąd I instancji łącznie w tym samym zakresie stosuje instytucję umorzenia postepowania w sprawie o wydanie wyroku łącznego regulowaną przez art. 572 k.p.k. oraz instytucję odrębnego wykonywania łączonych wyroków jednostkowych w zakresie w jakim nie zostały objęte wyrokiem łącznym – regulowaną przez art. 576 § 1 k.p.k. Sąd Rejonowy nie dostrzega, iż są to dwie odrębne i w zasadzie konkurencyjne uregulowania i łączne ich stosowanie co do tych samych elementów łączonych wyroków jednostkowych jest błędne.", "grupa": "A", "przepisy": ["art. 572 k.p.k.", "art. 576 § 1 k.p.k."], "gold_id": "II Ka 215/13_2", "gold_code": null, "sim": 0.714, "niepewne": false, "najblizsza_id": "II Ka 215/13_2", "rouge": {"rouge1": {"p": 0.644, "r": 0.922, "f": 0.758}, "rouge2": {"p": 0.458, "r": 0.66, "f": 0.541}, "rougeL": {"p": 0.616, "r": 0.882, "f": 0.726}}, "sedzia": {"label": "teza", "code": null, "reason": "Stwierdza, że dwa przepisy (art. 572 i 576 k.p.k.) są wzajemnie konkurencyjne i nie mogą być stosowane łącznie."}, "sim_emb": 0.941, "najblizsza_emb": "II Ka 215/13_2", "grupa_emb": "A", "sim_rouge": 0.882, "najblizsza_rouge": "II Ka 215/13_2", "grupa_rouge": "A"}, {"sygnatura": "II AKa 169/20", "tekst": "Brak takiego wyjaśnienia i oceny uniemożliwia odparcie zarzutu przekroczenia przez sąd granic swobodnej oceny dowodów i czyni taki zarzut zasadnym.", "grupa": "C", "przepisy": ["art. 424 § 1 k.p.k.", "art. 6 ust. 1 EKPCz", "art. 45 ust. 1 Konstytucji RP"], "gold_id": null, "gold_code": null, "sim": 0.138, "niepewne": false, "najblizsza_id": "II AKa 169/20_3", "rouge": {"rouge1": {"p": 0.3, "r": 0.075, "f": 0.12}, "rouge2": {"p": 0.053, "r": 0.013, "f": 0.02}, "rougeL": {"p": 0.25, "r": 0.062, "f": 0.1}}, "sedzia": {"label": "teza", "code": null, "reason": "Interpretuje konieczność wyjaśnienia w uzasadnieniu, by uniknąć zarzutu przekroczenia swobody oceny dowodów."}, "sim_emb": 0.745, "najblizsza_emb": "II AKa 169/20_5", "grupa_emb": "C", "sim_rouge": 0.065, "najblizsza_rouge": "II AKa 169/20_2", "grupa_rouge": "C"}, {"sygnatura": "II AKa 169/20", "tekst": "Wady uzasadnienia wykazane wyżej, nawet o charakterze rażącym – jak w rozpoznawanej sprawie – nie mogą stanowić podstawy uchylenia wyroku. Stosownie do treści art. 455 lit. a k.p.k., nie można uchylić wyroku z tego powodu, że jego uzasadnienie nie spełnia wymogów określonych w art. 424 k.p.k. Wady te mogą stanowić jednak podstawę do udzielenia sędziemu wytyku lub do zainicjonowana postępowania dyscyplinarnego.", "grupa": "A", "przepisy": ["art. 455 lit. a k.p.k.", "art. 424 k.p.k."], "gold_id": "II AKa 169/20_5", "gold_code": null, "sim": 0.742, "niepewne": false, "najblizsza_id": "II AKa 169/20_5", "rouge": {"rouge1": {"p": 0.441, "r": 0.963, "f": 0.605}, "rouge2": {"p": 0.362, "r": 0.808, "f": 0.5}, "rougeL": {"p": 0.441, "r": 0.963, "f": 0.605}}, "sedzia": {"label": "teza", "code": null, "reason": "Wskazuje, że wady uzasadnienia nie uchylają wyroku, ale mogą prowadzić do wytyku lub postępowania dyscyplinarnego."}, "sim_emb": 0.913, "najblizsza_emb": "II AKa 169/20_5", "grupa_emb": "A", "sim_rouge": 0.963, "najblizsza_rouge": "II AKa 169/20_5", "grupa_rouge": "A"}, {"sygnatura": "II AKa 169/20", "tekst": "W sprawie zachodzi konieczność przeprowadzenia na nowo przewodu sądowego w całości. Wskazane w części pierwszej uchybienia i to o charakterze rażącym, dotyczące rażącej obrazy art. 7 k.p.k., w konsekwencji których sąd pierwszej instancji błędnie ustalił stan faktyczny co do obu przypisanych R. C. (1) czynów, uniemożliwiają ich konwalidację w postępowaniu apelacyjnym z uwagi na ograniczony zakres tego postępowania.", "grupa": "C", "przepisy": ["art. 437 § 2 k.p.k.", "art. 7 k.p.k."], "gold_id": null, "gold_code": null, "sim": 0.241, "niepewne": false, "najblizsza_id": "II AKa 169/20_3", "rouge": {"rouge1": {"p": 0.328, "r": 0.237, "f": 0.275}, "rouge2": {"p": 0.053, "r": 0.038, "f": 0.044}, "rougeL": {"p": 0.172, "r": 0.125, "f": 0.145}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Odnosi się do konkretnych uchybień i błędnego ustalenia stanu faktycznego w tej sprawie."}, "sim_emb": 0.737, "najblizsza_emb": "II AKa 169/20_1", "grupa_emb": "C", "sim_rouge": 0.185, "najblizsza_rouge": "II AKa 169/20_5", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "Zgodnie bowiem z treścią art. 233 § 6 kk , sprawca odpowiada za podanie nieprawdy lub zatajenie prawdy w oświadczeniu, które ma służyć za dowód w postępowaniu innym niż sądowe, prowadzonym na podstawie ustawy, jeżeli przepisy takiej ustawy przewidują możliwość odbierania takiego oświadczenia pod rygorem odpowiedzialności karnej.", "grupa": "C", "przepisy": ["art. 233 § 6 kk"], "gold_id": null, "gold_code": null, "sim": 0.232, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 0.244, "r": 0.131, "f": 0.171}, "rouge2": {"p": 0.045, "r": 0.024, "f": 0.031}, "rougeL": {"p": 0.156, "r": 0.083, "f": 0.109}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Parafraza przepisu art. 233 § 6 kk bez dodatkowej interpretacji."}, "sim_emb": 0.818, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "C", "sim_rouge": 0.1, "najblizsza_rouge": "III K 1961/20_2", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "Upoważnienie do uprzedzenia o odpowiedzialności karnej za złożenie fałszywego oświadczenia, o którym mowa w art. 233 § 6 kk musi wynikać z ustawy, na podstawie której prowadzone jest postępowanie.", "grupa": "C", "przepisy": ["art. 233 § 6 kk"], "gold_id": null, "gold_code": null, "sim": 0.224, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 0.429, "r": 0.143, "f": 0.214}, "rouge2": {"p": 0.074, "r": 0.024, "f": 0.036}, "rougeL": {"p": 0.214, "r": 0.071, "f": 0.107}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Opis warunku formalnego wynikającego z przepisu, bez interpretacji."}, "sim_emb": 0.81, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "C", "sim_rouge": 0.1, "najblizsza_rouge": "III K 1961/20_2", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "W orzecznictwie Sądu Najwyższego wskazuje się, że dla przypisania sprawcy popełnienia przestępstwa stypizowanego w art. 233 § 1 kk . niezbędne jest wykazanie zaistnienia znamion strony podmiotowej, w przypadku przestępstwa złożenia fałszywych zeznań - umyślności działania bądź zaniechania.", "grupa": "A", "przepisy": ["art. 233 § 1 kk"], "gold_id": "III K 1961/20_1", "gold_code": null, "sim": 0.662, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 0.857, "r": 0.357, "f": 0.504}, "rouge2": {"p": 0.794, "r": 0.325, "f": 0.462}, "rougeL": {"p": 0.8, "r": 0.333, "f": 0.471}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Stwierdzenie ogólnej zasady o konieczności dowodu strony podmiotowej, wynikającej z przepisu."}, "sim_emb": 0.944, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "A", "sim_rouge": 0.333, "najblizsza_rouge": "III K 1961/20_1", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "Minimalnym warunkiem spełnienia znamion strony podmiotowej w odniesieniu do omawianego przestępstwa jest przewidywanie przez sprawcę nieprawdziwości jego oświadczeń o posiadanych wiadomościach na temat faktów badanych w postępowaniu i zarazem godzenie się z tym stanem, wyrażające się złożeniem takich zeznań w formie przewidzianej przez prawo procesowe.", "grupa": "A", "przepisy": ["art. 233 § 1 kk"], "gold_id": "III K 1961/20_1", "gold_code": null, "sim": 0.8, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 1.0, "r": 0.536, "f": 0.698}, "rouge2": {"p": 1.0, "r": 0.53, "f": 0.693}, "rougeL": {"p": 1.0, "r": 0.536, "f": 0.698}}, "sedzia": {"label": "teza", "code": null, "reason": "Wypełnienie luki interpretacyjnej – konkretne kryteria strony podmiotowej nie uregulowane wprost w przepisie."}, "sim_emb": 0.881, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "A", "sim_rouge": 0.536, "najblizsza_rouge": "III K 1961/20_1", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "Analiza materiału dowodowego niniejszej sprawy jednoznacznie wskazuje, że [...] Tym samym działał on z ewidentnym zamiarem i to co najmniej wynikowym, mógł bowiem zdawać sobie sprawę z nieprawdziwości swoich oświadczeń złożonych w przepisanych formach procesowych przed organem administracyjnym.", "grupa": "C", "przepisy": ["art. 233 § 1 kk"], "gold_id": null, "gold_code": null, "sim": 0.237, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 0.297, "r": 0.131, "f": 0.182}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.216, "r": 0.095, "f": 0.132}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Ocena faktyczna zastosowana do konkretnego przypadku sprawy."}, "sim_emb": 0.713, "najblizsza_emb": "III K 1961/20_2", "grupa_emb": "C", "sim_rouge": 0.095, "najblizsza_rouge": "III K 1961/20_1", "grupa_rouge": "C"}, {"sygnatura": "I KK 97/26", "tekst": "Niezmiennie Sąd Najwyższy podkreśla, że owe skutki mogą zaistnieć wówczas, gdy już pobieżna analiza wniesionej kasacji świadczy o jej zasadności, a tym samym o konieczności uchylenia zaskarżonego nią wyroku.", "grupa": "A", "przepisy": ["art. 532 § 1 k.p.k."], "gold_id": "I KK 97/26_2", "gold_code": null, "sim": 0.777, "
