 0.094, "r": 0.421, "f": 0.154}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.047, "r": 0.211, "f": 0.077}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "opisuje faktyczne zastosowanie przepisów w tej sprawie"}, "sim_emb": 0.65, "najblizsza_emb": "III OSK 2732/23_2", "grupa_emb": "C", "sim_rouge": 0.211, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Art. 173 ust. 1 pkt 1 P.s.w. regulował jedną z form pomocy materialnej dla studentów w postaci stypendium socjalnego i także art. 86 ust. 1 pkt 1 P.s.w.n. określa formę pomocy materialnej jako stypendium socjalne. Można więc stwierdzić, że przepisy te określały podobne formy pomocy materialnej.", "grupa": "C", "przepisy": ["art. 173 ust. 1 pkt 1 P.s.w.", "art. 86 ust. 1 pkt 1 P.s.w.n."], "gold_id": null, "gold_code": null, "sim": 0.268, "niepewne": false, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 0.152, "r": 0.368, "f": 0.215}, "rouge2": {"p": 0.022, "r": 0.056, "f": 0.032}, "rougeL": {"p": 0.109, "r": 0.263, "f": 0.154}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "porównuje przepisy w kontekście tej sprawy"}, "sim_emb": 0.669, "najblizsza_emb": "III OSK 2732/23_2", "grupa_emb": "C", "sim_rouge": 0.263, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Normy prawne zawarte w art. 93 ust. 4 P.s.w.n. i art. 184 ust. 5 P.s.w. nie są tożsame. Zgodnie z art. 184 ust. 5 P.s.w. studentowi, który po ukończeniu jednego kierunku studiów kontynuował naukę na drugim kierunku studiów, nie przysługiwały świadczenia o których mowa w art. 173 P.s.w., chyba że kontynuował on studia po ukończeniu studiów pierwszego stopnia w celu uzyskania tytułu zawodowego magistra lub równorzędnego, jednakże nie dłużej niż przez okres trzech lat.", "grupa": "C", "przepisy": ["art. 93 ust. 4 P.s.w.n.", "art. 184 ust. 5 P.s.w.", "art. 173 P.s.w."], "gold_id": null, "gold_code": null, "sim": 0.136, "niepewne": false, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 0.095, "r": 0.368, "f": 0.151}, "rouge2": {"p": 0.055, "r": 0.222, "f": 0.088}, "rougeL": {"p": 0.095, "r": 0.368, "f": 0.151}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "odnosi się do konkretnego zastosowania przepisów w tej sprawie"}, "sim_emb": 0.66, "najblizsza_emb": "III OSK 2732/23_2", "grupa_emb": "C", "sim_rouge": 0.368, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Natomiast stosownie do treści art. 93 ust. 4 P.s.w.n. łączny okres, przez który przysługują świadczenia, o których mowa w art. 86 ust. 1 pkt 1-4 i art. 359 ust. 1 tej ustawy wynosi 12 semestrów, bez względu na ich pobieranie przez studenta, z zastrzeżeniem że w ramach tego okresu świadczenia przysługują na studiach: 1) pierwszego stopnia - nie dłużej niż przez 9 semestrów; 2) drugiego stopnia - nie dłużej niż przez 7 semestrów. Art. 93 ust. 4 P.s.w.n. stanowił w tej sprawie podstawę do rozstrzygania administracyjnego w przedmiocie odmowy przyznania stypendium socjalnego.", "grupa": "B", "przepisy": ["art. 93 ust. 4 P.s.w.n.", "art. 86 ust. 1 pkt 1-4 P.s.w.n.", "art. 359 ust. 1 P.s.w.n."], "gold_id": "III OSK 2732/23_2", "gold_code": "4", "sim": 0.477, "niepewne": true, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 0.209, "r": 1.0, "f": 0.345}, "rouge2": {"p": 0.2, "r": 1.0, "f": 0.333}, "rougeL": {"p": 0.209, "r": 1.0, "f": 0.345}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "odnosi się do konkretnego zastosowania przepisu w tej sprawie"}, "sim_emb": 0.798, "najblizsza_emb": "III OSK 2732/23_2", "grupa_emb": "C", "sim_rouge": 1.0, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "B"}, {"sygnatura": "III OSK 2732/23", "tekst": "Tym samym skoro w tej sprawie ani organy administracyjne nie stosowały art. 184 ust. 5 P.s.w. i art. 173 P.s.w. i Sąd pierwszej instancji trafnie kontrolując zaskarżoną decyzję nie stwierdził naruszenia prawa materialnego w zakresie zarówno zastosowania, jak i wykładni art. 93 ust. 4 i art. 86 ust. 1 pkt 1 P.s.w.n., to zarzut naruszenia prawa poprzez błędną wykładnię i niewłaściwe zastosowanie przepisów prawa materialnego, które nie mogły być i nie były w sprawie stosowanie, czyni ten zrzut bezzasadnym.", "grupa": "C", "przepisy": ["art. 184 ust. 5 P.s.w.", "art. 173 P.s.w.", "art. 93 ust. 4 P.s.w.n.", "art. 86 ust. 1 pkt 1 P.s.w.n."], "gold_id": null, "gold_code": null, "sim": 0.199, "niepewne": false, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 0.127, "r": 0.526, "f": 0.204}, "rouge2": {"p": 0.064, "r": 0.278, "f": 0.104}, "rougeL": {"p": 0.089, "r": 0.368, "f": 0.143}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "odnosi się do oceny skargi w kontekście tej sprawy"}, "sim_emb": 0.655, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "C", "sim_rouge": 0.368, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Ponieważ innych zarzutów nie zawiera skarga kasacyjna, to Naczelny Sąd Administracyjny w punkcie pierwszym wyroku oddalił ją na podstawie art. 184 P.p.s.a.", "grupa": "C", "przepisy": ["art. 184 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.233, "niepewne": false, "najblizsza_id": "III OSK 2732/23_1", "rouge": {"rouge1": {"p": 0.227, "r": 0.333, "f": 0.27}, "rouge2": {"p": 0.095, "r": 0.143, "f": 0.114}, "rougeL": {"p": 0.136, "r": 0.2, "f": 0.162}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "odnosi się do konkretnego rozstrzygnięcia tej sprawy"}, "sim_emb": 0.671, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "C", "sim_rouge": 0.2, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "W odniesieniu do zawartego w skardze kasacyjnej wniosku o przyznanie kosztów nieopłaconej pomocy prawnej udzielonej z urzędu należy wyjaśnić, że o wynagrodzeniu dla pełnomocnika z urzędu rozstrzyga zawsze wojewódzki sąd administracyjny w postępowaniu uregulowanym w art. 250 i następnych Prawa o postępowaniu przed sądami administracyjnymi. Zgodnie z art. 254 § 1 P.p.s.a. wniosek o przyznanie kosztów nieopłaconej pomocy prawnej składa się do właściwego wojewódzkiego sądu administracyjnego. Stąd w postępowaniu kasacyjnym wniosek ten nie podlegał rozpoznaniu.", "grupa": "B", "przepisy": ["art. 250 P.p.s.a.", "art. 254 § 1 P.p.s.a."], "gold_id": "III OSK 2732/23_3", "gold_code": "1", "sim": 0.635, "niepewne": false, "najblizsza_id": "III OSK 2732/23_3", "rouge": {"rouge1": {"p": 0.338, "r": 1.0, "f": 0.505}, "rouge2": {"p": 0.329, "r": 1.0, "f": 0.495}, "rougeL": {"p": 0.338, "r": 1.0, "f": 0.505}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "parafraza procedury wynikającej z art. 254 P.p.s.a."}, "sim_emb": 0.817, "najblizsza_emb": "III OSK 2732/23_3", "grupa_emb": "C", "sim_rouge": 1.0, "najblizsza_rouge": "III OSK 2732/23_3", "grupa_rouge": "B"}, {"sygnatura": "III OSK 2732/23", "tekst": "W punkcie drugim wyroku Naczelny Sąd Administracyjny stosując art. 207 § 2 P.p.s.a. uznał, że w tej sprawie zachodzi szczególny przypadek uzasadniający odstąpienie od zasądzenia w całości od strony skarżącej kasacyjnie na rzecz strony przeciwnej zwrotu kosztów postępowania kasacyjnego.", "grupa": "C", "przepisy": ["art. 207 § 2 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.248, "niepewne": false, "najblizsza_id": "III OSK 2732/23_1", "rouge": {"rouge1": {"p": 0.184, "r": 0.467, "f": 0.264}, "rouge2": {"p": 0.108, "r": 0.286, "f": 0.157}, "rougeL": {"p": 0.184, "r": 0.467, "f": 0.264}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "odnosi się do konkretnego rozstrzygnięcia w tej sprawie"}, "sim_emb": 0.634, "najblizsza_emb": "III OSK 2732/23_3", "grupa_emb": "C", "sim_rouge": 0.467, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Zgodnie z art. 15 § 1 pkt 2 P.p.s.a., warunkiem rozpoznania wniosku uprawnionego podmiotu o podjęcie uchwały jest wystąpienie sytuacji, gdy stosowanie przepisu, który ma być wyjaśniany, wywołało rozbieżności w orzecznictwie sądów administracyjnych. Przejawem rozbieżności jest sytuacja, w której zagadnienie prawne wynikające z określonych przepisów nie było w dotychczasowym orzecznictwie rozstrzygane w sposób jednolity, w konsekwencji wydawane są przez sądy różne rozstrzygnięcia na tej samej podstawie prawnej i w analogicznym stanie faktycznym", "grupa": "B", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": "III OPS 2/25_1", "gold_code": "1", "sim": 0.68, "niepewne": false, "najblizsza_id": "III OPS 2/25_1", "rouge": {"rouge1": {"p": 0.451, "r": 1.0, "f": 0.621}, "rouge2": {"p": 0.443, "r": 1.0, "f": 0.614}, "rougeL": {"p": 0.451, "r": 1.0, "f": 0.621}}, "sedzia": {"label": "teza", "code": null, "reason": "Zawiera interpretację pojęcia 'rozbieżności w orzecznictwie', wypełniając lukę w przepisie art. 15 § 1 pkt 2 P.p.s.a."}, "sim_emb": 0.964, "najblizsza_emb": "III OPS 2/25_1", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OPS 2/25_1", "grupa_rouge": "B"}, {"sygnatura": "III OPS 2/25", "tekst": "W konsekwencji, przedmiotem uchwały abstrakcyjnej nie mogą być przepisy, które nie stanowiły podstawy prawnej orzekania, albo te przepisy, które stanowiąc taką podstawę prawną, nie wywołały rozbieżności w orzecznictwie", "grupa": "C", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.265, "niepewne": false, "najblizsza_id": "III OPS 2/25_1", "rouge": {"rouge1": {"p": 0.286, "r": 0.25, "f": 0.267}, "rouge2": {"p": 0.148, "r": 0.129, "f": 0.138}, "rougeL": {"p": 0.286, "r": 0.25, "f": 0.267}}, "sedzia": {"label": "teza", "code": null, "reason": "Definiuje zakres przepisów, które mogą być przedmiotem uchwały abstrakcyjnej, wyprowadzając granice z art. 268 P.p.s.a."}, "sim_emb": 0.692, "najblizsza_emb": "III OPS 2/25_1", "grupa_emb": "C", "sim_rouge": 0.25, "najb i wynikać z ustawy, co nie wynika wprost z przepisu."}, "sim_emb": 0.81, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "C", "sim_rouge": 0.1, "najblizsza_rouge": "III K 1961/20_2", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "Umyślność może w tym wypadku przejawiać się zamiarem bezpośrednim albo wynikowym. Minimalnym warunkiem spełnienia znamion strony podmiotowej w odniesieniu do omawianego przestępstwa jest przewidywanie przez sprawcę nieprawdziwości jego oświadczeń o posiadanych wiadomościach na temat faktów badanych w postępowaniu i zarazem godzenie się z tym stanem, wyrażające się złożeniem takich zeznań w formie przewidzianej przez prawo procesowe.", "grupa": "A", "przepisy": ["art. 233 § 1 kk"], "gold_id": "III K 1961/20_1", "gold_code": null, "sim": 0.857, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 1.0, "r": 0.667, "f": 0.8}, "rouge2": {"p": 1.0, "r": 0.663, "f": 0.797}, "rougeL": {"p": 1.0, "r": 0.667, "f": 0.8}}, "sedzia": {"label": "teza", "code": null, "reason": "Definiuje wymogi znamion strony podmiotowej, wskazując konkretny test intencji."}, "sim_emb": 0.882, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "A", "sim_rouge": 0.667, "najblizsza_rouge": "III K 1961/20_1", "grupa_rouge": "A"}, {"sygnatura": "III K 1961/20", "tekst": "Analiza materiału dowodowego niniejszej sprawy jednoznacznie wskazuje, że [...] Tym samym działał on z ewidentnym zamiarem i to co najmniej wynikowym, mógł bowiem zdawać sobie sprawę z nieprawdziwości swoich oświadczeń złożonych w przepisanych formach procesowych przed organem administracyjnym.", "grupa": "C", "przepisy": ["art. 233 § 1 kk"], "gold_id": null, "gold_code": null, "sim": 0.23, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 0.297, "r": 0.131, "f": 0.182}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.216, "r": 0.095, "f": 0.132}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Odnosi się bezpośrednio do stanu faktycznego niniejszej sprawy."}, "sim_emb": 0.713, "najblizsza_emb": "III K 1961/20_2", "grupa_emb": "C", "sim_rouge": 0.095, "najblizsza_rouge": "III K 1961/20_1", "grupa_rouge": "C"}, {"sygnatura": "I KK 97/26", "tekst": "Niezmiennie Sąd Najwyższy podkreśla, że owe skutki mogą zaistnieć wówczas, gdy już pobieżna analiza wniesionej kasacji świadczy o jej zasadności, a tym samym o konieczności uchylenia zaskarżonego nią wyroku. Dochodzi wtedy do sytuacji, w której skazany odbywałby karę, w okolicznościach, w których z racji na charakter uchybień, którymi jest dotknięty zaskarżony wyrok, orzeczenie nie powinno być wykonywane.", "grupa": "A", "przepisy": ["art. 532 § 1 k.p.k."], "gold_id": "I KK 97/26_2", "gold_code": null, "sim": 0.574, "niepewne": false, "najblizsza_id": "I KK 97/26_2", "rouge": {"rouge1": {"p": 0.439, "r": 0.862, "f": 0.581}, "rouge2": {"p": 0.375, "r": 0.75, "f": 0.5}, "rougeL": {"p": 0.404, "r": 0.793, "f": 0.535}}, "sedzia": {"label": "teza", "code": null, "reason": "Zawiera kluczową interpretację warunków stosowania wstrzymania wykonania wyroku, która może być przywoływana w innych sprawach."}, "sim_emb": 0.896, "najblizsza_emb": "I KK 97/26_2", "grupa_emb": "A", "sim_rouge": 0.793, "najblizsza_rouge": "I KK 97/26_2", "grupa_rouge": "A"}, {"sygnatura": "I KK 97/26", "tekst": "Dokonując wstępnej kontroly zaskarżonego kasacją wyroku, Sąd Najwyższy nie znalazł podstaw do jednoznacznego uznania, iż uwzględnienie podniesionych w kasacji zarzutów jest na tyle prawdopodobne, że uzasadniałoby wstrzymanie wykonania orzeczonych wobec skazanej A. Ś. kar.", "grupa": "C", "przepisy": ["art. 532 § 1 k.p.k."], "gold_id": null, "gold_code": null, "sim": 0.212, "niepewne": false, "najblizsza_id": "I KK 97/26_2", "rouge": {"rouge1": {"p": 0.206, "r": 0.241, "f": 0.222}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.088, "r": 0.103, "f": 0.095}}, "sedzia": {"label": "nie_teza", "code": "5", "reason": "Stanowi ocenę skuteczności zarzutów podniesionych w kasacji w kontekście tej sprawy."}, "sim_emb": 0.785, "najblizsza_emb": "I KK 97/26_2", "grupa_emb": "C", "sim_rouge": 0.143, "najblizsza_rouge": "I KK 97/26_3", "grupa_rouge": "C"}, {"sygnatura": "I KK 97/26", "tekst": "Z kolei okoliczności dotyczące wieku skazanej, czy jej stanu zdrowia nie stanowią przesłanek do zastosowania instytucji wstrzymania wykonania orzeczenia. Okoliczności te mogą okazać się przydatnymi w ewentualnym postępowaniu o przerwę w wykonaniu kary w trybie art. 153 k.k.w. lub odroczenie jej wykonania na podstawie art. 151 k.k.w., nie mogą jednak być przesłanką do zastosowania instytucji uregulowanej w art. 532 § 1 k.p.k.", "grupa": "A", "przepisy": ["art. 532 § 1 k.p.k.", "art. 153 k.k.w.", "art. 151 k.k.w."], "gold_id": "I KK 97/26_3", "gold_code": null, "sim": 0.676, "niepewne": false, "najblizsza_id": "I KK 97/26_3", "rouge": {"rouge1": {"p": 0.492, "r": 0.857, "f": 0.625}, "rouge2": {"p": 0.4, "r": 0.706, "f": 0.511}, "rougeL": {"p": 0.475, "r": 0.829, "f": 0.604}}, "sedzia": {"label": "teza", "code": null, "reason": "Precyzuje, że okoliczności osobiste nie stanowią podstawy do wstrzymania wykonania kary, co jest interpretacją przepisu art. 532 § 1 k.p.k."}, "sim_emb": 0.923, "najblizsza_emb": "I KK 97/26_3", "grupa_emb": "A", "sim_rouge": 0.829, "najblizsza_rouge": "I KK 97/26_3", "grupa_rouge": "A"}, {"sygnatura": "II K 78/13", "tekst": "Zgodnie z treścią art.569§1kpk w zw. z art.85kk Sąd orzeka karę łączną tylko w takich sytuacjach, gdy sprawca popełnił dwa lub więcej przestępstw, zanim zapadł pierwszy wyrok, chociażby nieprawomocny, co do któregokolwiek z tych przestępstw.", "grupa": "C", "przepisy": ["art. 569§1 kpk", "art. 85 kk"], "gold_id": null, "gold_code": null, "sim": 0.105, "niepewne": false, "najblizsza_id": "II K 78/13_2", "rouge": {"rouge1": {"p": 0.1, "r": 0.333, "f": 0.154}, "rouge2": {"p": 0.026, "r": 0.091, "f": 0.04}, "rougeL": {"p": 0.05, "r": 0.167, "f": 0.077}}, "sedzia": {"label": "nie_teza", "code" y sądu bez nowej interpretacji prawa."}, "sim_emb": 0.913, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "B"}, {"sygnatura": "III OSK 2732/23", "tekst": "Skarga kasacyjna nie jest zasadna, a zaskarżony wyrok odpowiada prawu.", "grupa": "C", "przepisy": ["art. 184 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.13, "niepewne": false, "najblizsza_id": "III OSK 2732/23_1", "rouge": {"rouge1": {"p": 0.1, "r": 0.067, "f": 0.08}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.1, "r": 0.067, "f": 0.08}}, "sedzia": {"label": "nie_teza", "code": "3", "reason": "Sentencja orzeczenia bez szczegółowego uzasadnienia prawnego."}, "sim_emb": 0.63, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "C", "sim_rouge": 0.067, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Tym samym w kontrolowanej przez Sąd pierwszej instancji sprawie administracyjnej ani art. 173 P.s.w., ani też art. 184 ust. 5 P.s.w. nie miały zastosowania.", "grupa": "C", "przepisy": ["art. 173 P.s.w.", "art. 184 ust. 5 P.s.w."], "gold_id": null, "gold_code": null, "sim": 0.202, "niepewne": false, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 0.25, "r": 0.316, "f": 0.279}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.125, "r": 0.158, "f": 0.14}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Stwierdzenie faktyczne dotyczące stosowania przepisów w konkretnej sprawie."}, "sim_emb": 0.603, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "C", "sim_rouge": 0.158, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Można więc stwierdzić, że przepisy te określały podobne formy pomocy materialnej.", "grupa": "C", "przepisy": ["art. 173 P.s.w.", "art. 86 ust. 1 pkt 1 P.s.w.n."], "gold_id": null, "gold_code": null, "sim": 0.031, "niepewne": false, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 0.091, "r": 0.053, "f": 0.067}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.091, "r": 0.053, "f": 0.067}}, "sedzia": {"label": "nie_teza", "code": "6", "reason": "Zbyt ogólna stwierdzenie podobieństwa przepisów bez konkretnej interpretacji."}, "sim_emb": 0.504, "najblizsza_emb": "III OSK 2732/23_2", "grupa_emb": "C", "sim_rouge": 0.067, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Normy prawne zawarte w art. 93 ust. 4 P.s.w.n. i art. 184 ust. 5 P.s.w. nie są tożsame.", "grupa": "C", "przepisy": ["art. 93 ust. 4 P.s.w.n.", "art. 184 ust. 5 P.s.w."], "gold_id": null, "gold_code": null, "sim": 0.2, "niepewne": false, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 0.333, "r": 0.316, "f": 0.324}, "rouge2": {"p": 0.235, "r": 0.222, "f": 0.229}, "rougeL": {"p": 0.278, "r": 0.263, "f": 0.27}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Bezpośrednie stwierdzenie nierównoważności przepisów bez interpretacji."}, "sim_emb": 0.655, "najblizsza_emb": "III OSK 2732/23_2", "grupa_emb": "C", "sim_rouge": 0.263, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Tym samym skoro w tej sprawie ani organy administracyjne nie stosowały art. 184 ust. 5 P.s.w. i art. 173 P.s.w. i Sąd pierwszej instancji trafnie kontrolując zaskarżoną decyzję nie stwierdził naruszenia prawa materialnego w zakresie zarówno zastosowania, jak i wykładni art. 93 ust. 4 i art. 86 ust. 1 pkt 1 P.s.w.n., to zarzut naruszenia prawa poprzez błędną wykładnię i niewłaściwe zastosowanie przepisów prawa materialnego, które nie mogły być i nie były w sprawie stosowanie, czyni ten zrzut bezzasadnym.", "grupa": "C", "przepisy": ["art. 93 ust. 4 P.s.w.n.", "art. 86 ust. 1 pkt 1 P.s.w.n."], "gold_id": null, "gold_code": null, "sim": 0.207, "niepewne": false, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 0.127, "r": 0.526, "f": 0.204}, "rouge2": {"p": 0.064, "r": 0.278, "f": 0.104}, "rougeL": {"p": 0.089, "r": 0.368, "f": 0.143}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Opis faktycznego przebiegu postępowania i stosowania prawa w tej sprawie."}, "sim_emb": 0.655, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "C", "sim_rouge": 0.368, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "W punkcie drugim wyroku Naczelny Sąd Administracyjny stosując art. 207 § 2 P.p.s.a. uznał, że w tej sprawie zachodzi szczególny przypadek uzasadniający odstąpienie od zasądzenia w całości od strony skarżącej kasacyjnie na rzecz strony przeciwnej zwrotu kosztów postępowania kasacyjnego.", "grupa": "C", "przepisy": ["art. 207 § 2 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.278, "niepewne": false, "najblizsza_id": "III OSK 2732/23_1", "rouge": {"rouge1": {"p": 0.184, "r": 0.467, "f": 0.264}, "rouge2": {"p": 0.108, "r": 0.286, "f": 0.157}, "rougeL": {"p": 0.184, "r": 0.467, "f": 0.264}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Decyzja o kosztach oparta na specyficznych okolicznościach tej sprawy."}, "sim_emb": 0.634, "najblizsza_emb": "III OSK 2732/23_3", "grupa_emb": "C", "sim_rouge": 0.467, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Zgodnie z art. 15 § 1 pkt 2 P.p.s.a., warunkiem rozpoznania wniosku uprawnionego podmiotu o podjęcie uchwały jest wystąpienie sytuacji, gdy stosowanie przepisu, który ma być wyjaśniany, wywołało rozbieżności w orzecznictwie sądów administracyjnych. Przejawem rozbieżności jest sytuacja, w której zagadnienie prawne wynikające z określonych przepisów nie było w dotychczasowym orzecznictwie rozstrzygane w sposób jednolity, w konsekwencji wydawane są przez sądy różne rozstrzygnięcia na tej samej podstawie prawnej i w analogicznym stanie faktycznym", "grupa": "B", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": "III OPS 2/25_1", "gold_code": "1", "sim": 0.68, "niepewne": false, "najblizsza_id": "III OPS 2/25_1", "rouge": {"rouge1": {"p": 0.451, "r": 1.0, "f": 0.621}, "rouge2": {"p": 0.443, "r": 1.0, "f": 0.614}, "rougeL": {"p": 0.451, "r": 1.0, "f": 0.621}}, "sedzia": {"label": "teza", "code": null, "reason": "Zawiera interpretację art. 15 § 1 pkt 2 P.p.s.a., definiując warunki rozbieżności w orzecznictwie."}, "sim_emb": 0.964, "najblizsza_emb": "III OPS 2/25_1", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OPS 2/25_1", "grupa_rouge": "B"}, {"sygnatura": "III OPS 2/25", "tekst": "W konsekwencji, przedmiotem uchwały abstrakcyjnej nie mogą być przepisy, które nie stanowiły podstawy prawnej orzekania, albo te przepisy, które stanowiąc taką podstawę prawną, nie wywołały rozbieżności w orzecznictwie", "grupa": "C", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.265, "niepewne": false, "najblizsza_id": "III OPS 2/25_1", "rouge": {"rouge1": {"p": 0.286, "r": 0.25, "f": 0.267}, "rouge2": {"p": 0.148, "r": 0.129, "f": 0.138}, "rougeL": {"p": 0.286, "r": 0.25, "f": 0.267}}, "sedzia": {"label": "teza", "code": null, "reason": "Stwierdza zasadę zakresu uchwały abstrakcyjnej, ograniczając ją do przepisów wywołujących rozbieżności."}, "sim_emb": 0.692, "najblizsza_emb": "III OPS 2/25_1", "grupa_emb": "C", "sim_rouge": 0.25, "najblizsza_rouge": "III OPS 2/25_1", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Zgodnie z art. 268 P.p.s.a., wniosek o podjęcie uchwały wymaga uzasadnienia. W uzasadnieniu wniosku należy wskazać konkretne przepisy prawa oraz to, w jaki sposób ich stosowanie wywołało w orzecznictwie sądów administracyjnych rozbieżności", "grupa": "B", "przepisy": ["art. 268 P.p.s.a."], "gold_id": "III OPS 2/25_3", "gold_code": "1", "sim": 0.621, "niepewne": false, "najblizsza_id": "III OPS 2/25_3", "rouge": {"rouge1": {"p": 0.344, "r": 1.0, "f": 0.512}, "rouge2": {"p": 0.323, "r": 1.0, "f": 0.48 uge2": {"p": 0.177, "r": 0.389, "f": 0.243}, "rougeL": {"p": 0.237, "r": 0.514, "f": 0.325}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Zdanie opisuje stan faktyczny sprawy, wskazując daty popełnienia przestępstw i wydania wyroków, co nie stanowi tezy prawnej."}, "sim_emb": 0.842, "najblizsza_emb": "II K 78/13_1", "grupa_emb": "B", "sim_rouge": 0.514, "najblizsza_rouge": "II K 78/13_1", "grupa_rouge": "C"}, {"sygnatura": "II K 78/13", "tekst": "Również wyrok wydany przez Sąd Okręgowy w Koszalinie, w sprawie IIK 107/03 nie może być objęty wyrokiem łącznym z w/w wyrokami. Rozstrzygnięcie w sprawie IIK 107/03 było przedmiotem analizy z wyrokami objętymi wyrokiem łącznym wydanym w sprawie IIK 322/04, w sprawie IIK 5/05 Sądu Okręgowego w Koszalinie, w której wydano postanowienie w dniu 24 lutego 2005r. Postanowienie to się uprawomocniło. W tym miejscu należy stanowczo stwierdzić, że brak jest przesłanek do wydania wyroku łącznego obejmującego kary wymierzone w sprawie IIK 107/03 Sądu Okręgowego w Koszalinie oraz kary orzeczone w wyrokach Sądu Rejonowego w Kołobrzegu wydanych w sprawach IIK 158/12 i IIK 855/12 ponieważ czyny objęte wyrokami Sądu Rejonowego w Kołobrzegu zostały popełnione po wydaniu wyroku przez Sąd Okręgowy w Koszalinie, w sprawie IIK 107/03.", "grupa": "B", "przepisy": [], "gold_id": "II K 78/13_1", "gold_code": "2", "sim": 0.401, "niepewne": true, "najblizsza_id": "II K 78/13_1", "rouge": {"rouge1": {"p": 0.179, "r": 0.649, "f": 0.281}, "rouge2": {"p": 0.12, "r": 0.444, "f": 0.189}, "rougeL": {"p": 0.142, "r": 0.514, "f": 0.222}}, "sedzia": {"label": "nie_teza", "code": "2", "reason": "Zdanie opisuje stan faktyczny sprawy, wskazując brak przesłanek do wydania wyroku łącznego, co nie stanowi tezy prawnej."}, "sim_emb": 0.808, "najblizsza_emb": "II K 78/13_1", "grupa_emb": "C", "sim_rouge": 0.514, "najblizsza_rouge": "II K 78/13_1", "grupa_rouge": "C"}, {"sygnatura": "V U 1113/13", "tekst": "Wniosek o uzasadnienie wyroku podlega odrzuceniu." : "III OSK 2732/23_3", "rouge": {"rouge1": {"p": 0.103, "r": 0.16, "f": 0.125}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.103, "r": 0.16, "f": 0.125}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Parafraza podstaw skargi kasacyjnej z art. 174 P.p.s.a., nie zawiera interpretacji."}, "sim_emb": 0.614, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "C", "sim_rouge": 0.2, "najblizsza_rouge": "III OSK 2732/23_1", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "Art. 93 ust. 4 P.s.w.n. stanowił w tej sprawie podstawę do rozstrzygania administracyjnego w przedmiocie odmowy przyznania stypendium socjalnego.", "grupa": "B", "przepisy": ["art. 93 ust. 4 P.s.w.n."], "gold_id": "III OSK 2732/23_2", "gold_code": "4", "sim": 1.0, "niepewne": false, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 1.0, "r": 1.0, "f": 1.0}, "rouge2": {"p": 1.0, "r": 1.0, "f": 1.0}, "rougeL": {"p": 1.0, "r": 1.0, "f": 1.0}}, "sedzia": {"label": "nie_teza", "code": "4", "reason": "Sprawozdanie z zastosowania podstawy prawnej w tej sprawie, nie opis faktów."}, "sim_emb": 1.0, "najblizsza_emb": "III OSK 2732/23_2", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "B"}, {"sygnatura": "III OSK 2732/23", "tekst": "Tym samym skoro w tej sprawie ani organy administracyjne nie stosowały art. 184 ust. 5 P.s.w. i art. 173 P.s.w. i Sąd pierwszej instancji trafnie kontrolując zaskarżoną decyzję nie stwierdził naruszenia prawa materialnego w zakresie zarówno zastosowania, jak i wykładni art. 93 ust. 4 i art. 86 ust. 1 pkt 1 P.s.w.n., to zarzut naruszenia prawa poprzez błędną wykładnię i niewłaściwe zastosowanie przepisów prawa materialnego, które nie mogły być i nie były w sprawie stosowanie, czyni ten zrzut bezzasadnym.", "grupa": "C", "przepisy": ["art. 184 ust. 5 P.s.w.", "art. 173 P.s.w.", "art. 93 ust. 4 P.s.w.n.", "art. 86 ust. 1 pkt 1 P.s.w.n."], "gold_id": null, "gold_code": null, "sim": 0.227, "nie 2": {"p": 1.0, "r": 1.0, "f": 1.0}, "rougeL": {"p": 1.0, "r": 1.0, "f": 1.0}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Zdanie stanowi parafrazę przepisu art. 15 § 1 pkt 2 P.p.s.a., nie zawiera interpretacji ani rozstrzygnięcia wątpliwości interpretacyjnych."}, "sim_emb": 1.0, "najblizsza_emb": "III OPS 2/25_1", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OPS 2/25_1", "grupa_rouge": "B"}, {"sygnatura": "III OPS 2/25", "tekst": "Przejawem rozbieżności jest sytuacja, w której zagadnienie prawne wynikające z określonych przepisów nie było w dotychczasowym orzecznictwie rozstrzygane w sposób jednolity, w konsekwencji wydawane są przez sądy różne rozstrzygnięcia na tej samej podstawie prawnej i w analogicznym stanie faktycznym.", "grupa": "C", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": null, "gold_code": null, "sim": 0.189, "niepewne": false, "najblizsza_id": "III OPS 2/25_1", "rouge": {"rouge1": {"p": 0.256, "r": 0.312, "f": 0.282}, "rouge2": {"p": 0.0, "r": 0.0, "f": 0.0}, "rougeL": {"p": 0.179, "r": 0.219, "f": 0.197}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Zdanie opisuje definicję rozbieżności w orzecznictwie wynikającą wprost z przepisów, nie wymaga interpretacji."}, "sim_emb": 0.758, "najblizsza_emb": "III OPS 2/25_2", "grupa_emb": "C", "sim_rouge": 0.278, "najblizsza_rouge": "III OPS 2/25_2", "grupa_rouge": "C"}, {"sygnatura": "III OPS 2/25", "tekst": "Rozbieżność w orzecznictwie musi być trwała i rzeczywista, co z kolei implikuje i pogłębia dalsze niejednolite stosowanie prawa.", "grupa": "B", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": "III OPS 2/25_2", "gold_code": "6", "sim": 1.0, "niepewne": false, "najblizsza_id": "III OPS 2/25_2", "rouge": {"rouge1": {"p": 1.0, "r": 1.0, "f": 1.0}, "rouge2": {"p": 1.0, "r": 1.0, "f": 1.0}, "rougeL": {"p": 1.0, "r": 1.0, "f": 1.0}}, "sedzia": {"label": "nie_teza", "code": "6", "reason": "Zdanie jest kołowe i nie zawiera konkretnej treści normatywnej, ty ści karnej.", "grupa": "C", "przepisy": ["art. 233 § 6 kk"], "gold_id": null, "gold_code": null, "sim": 0.237, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 0.244, "r": 0.131, "f": 0.171}, "rouge2": {"p": 0.045, "r": 0.024, "f": 0.031}, "rougeL": {"p": 0.156, "r": 0.083, "f": 0.109}}, "sedzia": null, "sim_emb": 0.818, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "C", "sim_rouge": 0.1, "najblizsza_rouge": "III K 1961/20_2", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "Ustawa z dnia 5 stycznia 2011r. o kierujących pojazdami, w oparciu o którą oskarżony wystąpił do Urzędu Miasta R. o wydanie dokumentu prawa jazdy w celu wygenerowania profilu kandydata na kierowcę oraz o wydanie wtórnika dokumentu prawa jazdy, przewiduje obowiązek odbierania oświadczeń pod rygorem odpowiedzialności karnej w przypadku ubiegania się o wydanie dokumentu uprawniającego do kierowania pojazdem (art. 11 ust. 1 pkt 6 lit. c) oraz w przypadku odbierania oświadczenia o utracie dokumentu prawa jazdy w celu wydania wtórnika tego dokumentu (art. 18 ust. 2 pkt 1 lit. a).", "grupa": "C", "przepisy": ["art. 11 ust. 1 pkt 6 lit. c ustawy o kierujących pojazdami", "art. 18 ust. 2 pkt 1 lit. a ustawy o kierujących pojazdami"], "gold_id": null, "gold_code": null, "sim": 0.178, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 0.178, "r": 0.19, "f": 0.184}, "rouge2": {"p": 0.011, "r": 0.012, "f": 0.012}, "rougeL": {"p": 0.089, "r": 0.095, "f": 0.092}}, "sedzia": null, "sim_emb": 0.64, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "C", "sim_rouge": 0.1, "najblizsza_rouge": "III K 1961/20_2", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "W orzecznictwie Sądu Najwyższego wskazuje się, że dla przypisania sprawcy popełnienia przestępstwa stypizowanego w art. 233 § 1 kk niezbędne jest wykazanie zaistnienia znamion strony podmiotowej, w przypadku przestępstwa złożenia fałszywych zeznań - umyślności działania bądź zaniechania.", "grupa": "A", "przepisy": ["art. 233 § 1 kk"], "gold_id": "III K 1961/20_1", "gold_code": null, "sim": 0.649, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 0.857, "r": 0.357, "f": 0.504}, "rouge2": {"p": 0.794, "r": 0.325, "f": 0.462}, "rougeL": {"p": 0.8, "r": 0.333, "f": 0.471}}, "sedzia": null, "sim_emb": 0.942, "najblizsza_emb": "III K 1961/20_1", "grupa_emb": "A", "sim_rouge": 0.333, "najblizsza_rouge": "III K 1961/20_1", "grupa_rouge": "C"}, {"sygnatura": "III K 1961/20", "tekst": "Analiza materiału dowodowego niniejszej sprawy jednoznacznie wskazuje, że na dzień składania przedmiotowych wniosków do Urzędu Miasta w R. oskarżony miał świadomość cofnięcia mu uprawnień do kierowania pojazdami, z czym jawnie się nie zgadzał, a także tego, że nie utracił on dokumentu prawa jazdy, tylko zostało mu zatrzymane. Mimo to nie podał prawdy w formularzu wniosku w oczywistym celu wygenerowania (...) oraz uzyskania wtórnika prawa jazdy, a okoliczności te były badane w postępowaniach administracyjnych zainaugurowanych przedmiotowymi wnioskami.", "grupa": "C", "przepisy": [], "gold_id": null, "gold_code": null, "sim": 0.211, "niepewne": false, "najblizsza_id": "III K 1961/20_1", "rouge": {"rouge1": {"p": 0.187, "r": 0.167, "f": 0.176}, "rouge2": {"p": 0.027, "r": 0.024, "f": 0.025}, "rougeL": {"p": 0.107, "r": 0.095, "f": 0.101}}, "sedzia": null, "sim_emb": 0.634, "najblizsza_emb": "III K 1961/20_2", "grupa_emb": "C", "sim_rouge": 0.1, "najblizsza_rouge": "III K 1961/20_2", "grupa_rouge": "C"}, {"sygnatura": "I KK 97/26", "tekst": "Sąd Najwyższy podkreśla, że skutki wyjątkowo dolegliwe i nieodwracalne mogą zaistnieć, gdy pobieżna analiza kasacji świadczy o jej zasadności, a tym samym o konieczności uchylenia zaskarżonego wyroku.", "grupa": "A", "przepisy": ["art. 532 § 1 k.p.k."], "gold_id": "I KK 97/26_2", "gold_code": null, "sim": 0.626, "niepewne": false, "najblizsza_id": "I KK 97/26_2", "rouge": {"rouge1": {"p": 0.704 gania administracyjnego w przedmiocie odmowy przyznania stypendium socjalnego.", "grupa": "B", "przepisy": ["art. 93 ust. 4 P.s.w.n."], "gold_id": "III OSK 2732/23_2", "gold_code": "4", "sim": 1.0, "niepewne": false, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 1.0, "r": 1.0, "f": 1.0}, "rouge2": {"p": 1.0, "r": 1.0, "f": 1.0}, "rougeL": {"p": 1.0, "r": 1.0, "f": 1.0}}, "sedzia": {"label": "nie_teza", "code": "4", "reason": "Sprawozdanie z zastosowania podstawy prawnej w tej sprawie, nie opis faktów."}, "sim_emb": 1.0, "najblizsza_emb": "III OSK 2732/23_2", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "B"}, {"sygnatura": "III OSK 2732/23", "tekst": "Tym samym skoro w tej sprawie ani organy administracyjne nie stosowały art. 184 ust. 5 P.s.w. i art. 173 P.s.w. i Sąd pierwszej instancji trafnie kontrolując zaskarżoną decyzję nie stwierdził naruszenia prawa materialnego w zakresie zarówno zastosowania, jak i wykładni art. 93 ust. 4 i art. 86 ust. 1 pkt 1 P.s.w.n., to zarzut naruszenia prawa poprzez błędną wykładnię i niewłaściwe zastosowanie przepisów prawa materialnego, które nie mogły być i nie były w sprawie stosowanie, czyni ten zrzut bezzasadnym.", "grupa": "C", "przepisy": ["art. 184 ust. 5 P.s.w.", "art. 173 P.s.w.", "art. 93 ust. 4 P.s.w.n.", "art. 86 ust. 1 pkt 1 P.s.w.n."], "gold_id": null, "gold_code": null, "sim": 0.227, "niepewne": false, "najblizsza_id": "III OSK 2732/23_2", "rouge": {"rouge1": {"p": 0.127, "r": 0.526, "f": 0.204}, "rouge2": {"p": 0.064, "r": 0.278, "f": 0.104}, "rougeL": {"p": 0.089, "r": 0.368, "f": 0.143}}, "sedzia": {"label": "nie_teza", "code": "5", "reason": "Ocena zarzutu naruszenia prawa przez organy i sąd pierwszej instancji."}, "sim_emb": 0.655, "najblizsza_emb": "III OSK 2732/23_1", "grupa_emb": "C", "sim_rouge": 0.368, "najblizsza_rouge": "III OSK 2732/23_2", "grupa_rouge": "C"}, {"sygnatura": "III OSK 2732/23", "tekst": "W odniesieniu do zawartego w skardze kasacyjnej wniosku o przyznanie kosztów nieopłaconej pomocy prawnej udzielonej z urzędu należy wyjaśnić, że o wynagrodzeniu dla pełnomocnika z urzędu rozstrzyga zawsze wojewódzki sąd administracyjny w postępowaniu uregulowanym w art. 250 i następnych Prawa o postępowaniu przed sądami administracyjnymi.", "grupa": "B", "przepisy": ["art. 250 P.p.s.a."], "gold_id": "III OSK 2732/23_3", "gold_code": "1", "sim": 0.742, "niepewne": false, "najblizsza_id": "III OSK 2732/23_3", "rouge": {"rouge1": {"p": 0.556, "r": 1.0, "f": 0.714}, "rouge2": {"p": 0.545, "r": 1.0, "f": 0.706}, "rougeL": {"p": 0.556, "r": 1.0, "f": 0.714}}, "sedzia": {"label": "nie_teza", "code": "4", "reason": "Sprawozdanie z zastosowania przepisów o kosztach w tej sprawie."}, "sim_emb": 0.894, "najblizsza_emb": "III OSK 2732/23_3", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OSK 2732/23_3", "grupa_rouge": "B"}, {"sygnatura": "III OPS 2/25", "tekst": "Zgodnie z art. 15 § 1 pkt 2 P.p.s.a., warunkiem rozpoznania wniosku uprawnionego podmiotu o podjęcie uchwały jest wystąpienie sytuacji, gdy stosowanie przepisu, który ma być wyjaśniany, wywołało rozbieżności w orzecznictwie sądów administracyjnych.", "grupa": "B", "przepisy": ["art. 15 § 1 pkt 2 P.p.s.a."], "gold_id": "III OPS 2/25_1", "gold_code": "1", "sim": 1.0, "niepewne": false, "najblizsza_id": "III OPS 2/25_1", "rouge": {"rouge1": {"p": 1.0, "r": 1.0, "f": 1.0}, "rouge2": {"p": 1.0, "r": 1.0, "f": 1.0}, "rougeL": {"p": 1.0, "r": 1.0, "f": 1.0}}, "sedzia": {"label": "teza", "code": 1, "reason": "Zdanie rozstrzyga wątpliwość interpretacyjną dotyczącą warunków rozpoznania wniosku o podjęcie uchwały, precyzując, że muszą wystąpić rozbieżności w orzecznictwie sądów administracyjnych."}, "sim_emb": 1.0, "najblizsza_emb": "III OPS 2/25_1", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "III OPS 2/25_1", "grupa_rouge": "B"}, {"sygnatura": "III OPS 2/25", "tekst": "Przez istnienie rozbieżności należy rozumieć nie tylko różnice poglądów p nia, czy przesłanki z art. 179 ust. 1 ustawy zostały spełnione - to ocena skuteczności zarzutu strony, nie neutralny opis faktu."}, "sim_emb": 0.999, "najblizsza_emb": "KIO 455/16_2", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "KIO 455/16_2", "grupa_rouge": "B"}, {"sygnatura": "KIO 455/16", "tekst": "Zgodnie z brzmieniem przepisu art. 192 ust 2 ustawy Prawo zamówień publicznych Izba uwzględnia odwołanie, jeżeli stwierdzi naruszenie przepisów ustawy, które miało wpływ lub może mieć istotny wpływ na wynik postępowania o udzielenie zamówienia.", "grupa": "B", "przepisy": ["art. 192 ust. 2 ustawy Prawo zamówień publicznych"], "gold_id": "KIO 455/16_3", "gold_code": "1", "sim": 0.937, "niepewne": false, "najblizsza_id": "KIO 455/16_3", "rouge": {"rouge1": {"p": 0.941, "r": 1.0, "f": 0.97}, "rouge2": {"p": 0.909, "r": 0.968, "f": 0.937}, "rougeL": {"p": 0.941, "r": 1.0, "f": 0.97}}, "sedzia": {"label": "nie_teza", "code": "1", "reason": "Zdanie parafrazuje brzmienie art. 192 ust. 2 ustawy - nie interpretuje przepisu, tylko przypomina jego treść."}, "sim_emb": 0.999, "najblizsza_emb": "KIO 455/16_3", "grupa_emb": "B", "sim_rouge": 1.0, "najblizsza_rouge": "KIO 455/16_3", "grupa_rouge": "B"}, {"sygnatura": "KIO 455/16", "tekst": "Izba wskazuje, że określone w ustawie zasady, w tym zasady uczciwej konkurencji i równego traktowania wykonawców to „szkielet” każdego z postępowań o udzielnie zamówienia publicznego jak również całego systemu zamówień publicznych.", "grupa": "C", "przepisy": [], "gold_id": null, "gold_code": null, "sim": 0.198, "niepewne": false, "najblizsza_id": "KIO 455/16_2", "rouge": {"rouge1": {"p": 0.355, "r": 0.204, "f": 0.259}, "rouge2": {"p": 0.067, "r": 0.038, "f": 0.048}, "rougeL": {"p": 0.194, "r": 0.111, "f": 0.141}}, "sedzia": {"label": "teza", "code": "1", "reason": "Zdanie formułuje ogólną zasadę, że zasady uczciwej konkurencji i równego traktowania to 'szkielet' systemu zamówień publicznych - to kluczowa interpretacja przepisów."}, "s <script>

}

  return h+'</table>'; }
// wspólne słowa (rdzeń = pierwsze 5 liter, odporne na odmianę) wyróżnione w obu tekstach
function stems(t){ var o={}; (t.toLowerCase().match(/[\p{L}\d]+/gu)||[]).forEach(function(w){ if(w.length>3) o[w.slice(0,5)]=1; }); return o; }

   ['Trafność','wszystkie zgodne decyzje: (TP + TN) / n',P(V.trafnosc)],
   ['Trafny kod przyczyny','przy poprawnych odrzuceniach: kod walidatora = kod arkusza',P(V.kod_trafnosc)+' <small>'+V.kody.filter(function(k){return String(k.arkusz)===String(k.walidator);}).length+' z '+V.kody.length+'</small>'],
   ['Powtarzalność ocen','ta sama teza – ta sama decyzja w innym przebiegu (średnia ± std z par przebiegów)',S&&S.sr!=null?Math.round(100*S.sr)+'% ± '+Math.round(100*S.std)+' pp <small>'+S.przebiegi+' przebiegi</small>':'–']
  ].forEach(function(r){ h+='<tr><td class="lead">'+r[0]+'<small>'+r[1]+'</small></td><td class="num">'+r[2]+'</td></tr>'; });
  h+='</tbody></table></div>';
  if(V.kody.length){ h+='<h3>Kody przyczyn przy poprawnych odrzuceniach</h3><div class="table-wrap"><table><thead><tr><th>Arkusz</th><th>Walidator</th></tr></thead><tbody>'+
    V.kody.map(function(k){ var ok=String(k.arkusz)===String(k.walidator); return '<tr><td>'+esc(kod(k.arkusz)||'–')+'</td><td style="color:'+(ok?'var(--good)':'var(--bad)')+'">'+esc(kod(k.walidator)||'–')+(ok?' ✓':' ✗')+'</td></tr>'; }).join('')+'</tbody></table></div>'; }
  h+='</div><div><h3>Błędy walidatora ('+V.bledy.length+')</h3>';
  h+= V.bledy.length ? V.bledy.map(function(b){
      return '<div class="blad"><div class="meta"><span class="mono">'+esc(b.sygnatura)+'</span> · '+(b.typ==='FN'?'dobra teza odrzucona':'zła teza przepuszczona')+
        ' · arkusz: '+(b.typ==='FN'?'dobra teza':'zła, '+esc(kod(b.gold_code)))+' · walidator: '+(b.decyzja==='teza'?'teza':'nie teza'+(b.kod?', '+esc(kod(b.kod)):''))+'</div>'+
        esc(short(b.tekst,240))+'<div class="meta" style="margin-top:4px">Uzasadnienie walidatora: '+esc(b.uzasadnienie||'–')+'</div></div>'; }).join('')
    : '<div class="empty" style="padding:6px">Brak – wszystkie decyzje zgodne z arkuszem.</div>';
  box.innerHTML=h+'<div class="empty" style="padding:6px;font-size:.74rem">Mała próba – wartości mają duży błąd; czysty test walidatora wymaga nowych tez ocenionych przez prawnika.</div></div></div>';
}

/* ---------- graf: orzeczenie → potwierdzona teza → przepis ---------- */
var network=null, nodesDS=null, edgesDS=null, byId={};
function buildGraph(){
  var T=potwierdzone(), nodes=[], edges=[], cnt={A:0,B:0,C:0,P:0}, przepisy={};
  var doc=css('--node-doc'), docInk=css('--node-doc-ink'), dim=css('--ink-dim'), line=css('--line'), acc=css('--accent'), law=css('--law');
  var ring={A:css('--good'),B:css('--bad'),C:css('--miss')};
  byId={};
  D.orzeczenia.forEach(function(o){
    nodes.push({id:'doc:'+o.sygnatura, label:o.sygnatura, shape:'box', margin:8, borderWidth:0,
      color:{background:doc,border:doc,highlight:{background:doc,border:acc}}, font:{color:docInk,size:12,face:'IBM Plex Sans',bold:true}});
  });
  T.forEach(function(t){
    var w=t.w; byId[t.id]={kind:'T',w:w}; cnt[w.grupa]++;
    nodes.push({id:t.id, label:simPct(w.sim)+' · '+short(w.tekst,32), title:'Podobieństwo do arkusza: '+simPct(w.sim), shape:'dot', size:12, hidden:!visible[w.grupa], wal:w.grupa,
      color:{background:acc,border:ring[w.grupa],highlight:{background:acc,border:ring[w.grupa]}}, borderWidth:3,
      font:{color:dim,size:10,face:'IBM Plex Sans'}});
    edges.push({from:'doc:'+w.sygnatura, to:t.id, color:{color:line}, width:1.2, arrows:{to:{enabled:true,scaleFactor:.4}}, wal:w.grupa, hidden:!visible[w.grupa]});
    (w.przepisy||[]).forEach(function(p){
      var k=normPrzepis(p); if(!k) return; var pid='p:'+k;
      if (!przepisy[pid]){ przepisy[pid]=[]; cnt.P++;
        nodes.push({id:pid, label:short(k,30), shape:'diamond', size:9, hidden:!visible.P, typ:'P',
          color:{background:law,border:law}, font:{color:dim,size:10,face:'IBM Plex Sans'}}); }
      przepisy[pid].push(t.id); byId[pid]={kind:'P',nazwa:k,tezy:przepisy[pid]};
      edges.push({from:t.id, to:pid, dashes:[4,3], color:{color:law,opacity:.6}, width:1, typ:'P', wal:w.grupa, hidden:!(visible.P&&visible[w.grupa])});
    });
  });
  nodesDS=new vis.DataSet(nodes); edgesDS=new vis.DataSet(edges);
  if (network) network.destroy();
  network=new vis.Network(document.getElementById('net'),{nodes:nodesDS,edges:edgesDS},{
    physics:{solver:'forceAtlas2Based',forceAtlas2Based:{gravitationalConstant:-45,springLength:70},stabilization:{iterations:250}},
    interaction:{hover:true,tooltipDelay:150}, edges:{smooth:false}});
  network.on('click',function(p){ if(p.nodes.length) showDetail(p.nodes[0]); });
  legend(cnt, T.length);
}
function applyVisibility(){
  nodesDS.update(nodesDS.get().filter(function(n){return n.wal||n.typ;}).map(function(n){ return {id:n.id, hidden: n.typ==='P' ? !visible.P : !visible[n.wal]}; }));
  edgesDS.update(edgesDS.get().filter(function(e){return e.wal;}).map(function(e){ return {id:e.id, hidden: !visible[e.wal] || (e.typ==='P' && !visible.P)}; }));
}
function legend(cnt, total){
  var L=document.getElementById('legend');
  L.innerHTML='<h3>'+esc(nazwa(sel))+' · '+total+' tez</h3>'+
    '<div class="chip" style="cursor:default"><span class="sw doc"></span>Orzeczenie</div>'+
    '<div class="chip" style="cursor:default"><span class="sw T"></span>Teza potwierdzona</div>'+
    '<button class="chip" id="lg-P" aria-pressed="'+visible.P+'"><span class="sw P"></span>Przepis<b>'+cnt.P+'</b></button>'+
    '<h3 style="margin-top:8px">Walidacja arkuszem (obwódka)</h3>'+
    ['A','B','C'].map(function(k){return '<button class="chip" id="lg-'+k+'" aria-pressed="'+visible[k]+'"><span class="sw '+k+'"></span>'+WAL[k]+'<b>'+cnt[k]+'</b></button>';}).join('');
  ['A','B','C','P'].forEach(function(k){
    document.getElementById('lg-'+k).addEventListener('click',function(){ visible[k]=!visible[k]; this.setAttribute('aria-pressed',visible[k]); applyVisibility(); });
  });
}
function goldById(id){ for(var i=0;i<D.gold.length;i++) if(D.gold[i].id===id) return D.gold[i]; return null; }
function showDetail(id){
  var el=document.getElementById('detailBody'), h='';
  if (id.indexOf('doc:')===0){
    var sig=id.slice(4), o=D.orzeczenia.filter(function(x){return x.sygnatura===sig;})[0];
    var W=D.modele[sel].metryki.wiersze.filter(function(w){return w.sygnatura===sig;});
    var P=W.filter(function(w){return w.sedzia&&w.sedzia.label==='teza';});
    h='<div class="kind doc">Orzeczenie</div><h4>'+esc(sig)+'</h4>'+
      '<div class="row"><span class="k">'+esc(nazwa(sel))+'</span>'+W.length+' wydobytych, '+P.length+' potwierdzonych przez walidator</div>'+
      '<div class="row"><span class="k">Walidacja potwierdzonych arkuszem</span>'+
      ['A','B','C'].map(function(k){return '<span class="tag '+(k==='C'?'n':k)+'">'+WAL[k]+': '+P.filter(function(w){return w.grupa===k;}).length+'</span>';}).join('')+'</div>'+
      (o.obciete?'<div class="row" style="color:var(--bad)">Uzasadnienie obcięte w arkuszu do 32 767 znaków (limit komórki Excela).</div>':'');
  } else if (byId[id] && byId[id].kind==='P'){
    var p=byId[id];
    h='<div class="kind P">Przepis</div><h4>'+esc(p.nazwa)+'</h4><div class="row"><span class="k">Powołany w potwierdzonych tezach</span>'+
      p.tezy.map(function(t){var w=byId[t].w; return '<span class="mono">'+esc(w.sygnatura)+'</span>: '+esc(short(w.tekst,90));}).join('<br>')+'</div>';
  } else {
    var w=byId[id].w, g=w.gold_id?goldById(w.gold_id):null, ng=goldById(w.najblizsza_id||w.gold_id), s=w.sedzia;
    h='<div class="kind T">Teza potwierdzona</div><h4>'+esc(w.sygnatura)+'</h4>'+(ng?'':'<blockquote>'+esc(w.tekst)+'</blockquote>')+
      (w.przepisy&&w.przepisy.length?'<div class="row"><span class="k">Przepisy</span>'+w.przepisy.map(esc).join(', ')+'</div>':'')+
      '<div class="row"><span class="k">Walidator ('+esc(D.modele[sel].sedzia||D.sedzia)+')</span>'+esc(s.reason)+'</div>'+
      '<div class="row"><span class="k">Walidacja arkuszem</span><span class="tag '+(w.grupa==='C'?'n':w.grupa)+'">'+WAL[w.grupa]+(w.niepewne?' · dopasowanie niepewne':'')+'</span>'+
      (g&&g.gold_code?' <span class="tag B">kod '+esc(kod(g.gold_code))+'</span>':'')+'</div>'+
      '<div class="row"><span class="k">Podobieństwo do '+(w.grupa==='C'?'najbliższej ':'')+'tezy z arkusza: '+simPct(w.sim)+'</span>'+meter(w.sim,w.grupa)+
      '<div class="meter-leg"><span>TF-IDF (metoda główna)</span><span>progi '+simPct(D.progi.niepewny)+' / '+simPct(D.progi.dopasowanie)+'</span></div></div>'+
      (w.sim_emb!=null?'<div class="row"><span class="k">EmbeddingGemma (druga opinia): '+simPct(w.sim_emb)+' → '+WAL[w.grupa_emb]+'</span>'+meter(w.sim_emb,w.grupa_emb,D.progi_emb)+
        '<div class="meter-leg"><span>podobieństwo znaczenia</span><span>progi '+simPct(D.progi_emb.niepewny)+' / '+simPct(D.progi_emb.dopasowanie)+'</span></div>'+
        '</div>':'')+
      (w.sim_rouge!=null?'<div class="row"><span class="k">ROUGE-L recall (pokrycie słów tezy z arkusza): '+simPct(w.sim_rouge)+' → '+WAL[w.grupa_rouge]+'</span>'+meter(w.sim_rouge,w.grupa_rouge,D.progi_rouge)+
        '<div class="meter-leg"><span>słowa w tej samej kolejności</span><span>progi '+simPct(D.progi_rouge.niepewny)+' / '+simPct(D.progi_rouge.dopasowanie)+'</span></div>'+rougeTab(w.rouge)+'</div>':'')+
      (rozbiezne(w)?'<div class="row" style="color:var(--unk)">Metody podobieństwa się nie zgadzają – do ręcznej weryfikacji.</div>':'')+
      (ng?'<div class="pair"><span class="lbl">Wydobyta</span><blockquote>'+highlight(w.tekst,ng.tekst)+'</blockquote>'+
          '<span class="lbl">Arkusz · '+esc(ng.id)+'</span><blockquote>'+highlight(ng.tekst,w.tekst)+'</blockquote></div>':'');
  }
  el.innerHTML=h; document.getElementById('detail').hidden=false;
}
document.getElementById('closeDetail').addEventListener('click',function(){document.getElementById('detail').hidden=true;});
document.getElementById('fit').addEventListener('click',function(){ if(network) network.fit({animation:true}); });

/* ---------- podobieństwo do arkusza ---------- */
function cmpTable(){
  var T=potwierdzone().slice().sort(function(a,b){return b.w.sim-a.w.sim;});
  var sims=T.map(function(t){return t.w.sim;});
  var sr=sims.length?sims.reduce(function(a,b){return a+b;},0)/sims.length:null;
  var sdv=sims.length>1?Math.sqrt(sims.reduce(function(a,b){return a+(b-sr)*(b-sr);},0)/(sims.length-1)):0;
  var pm=D.modele[sel].metryki.porownanie_metod;
  document.getElementById('c-sub').textContent=T.length+' potwierdzonych tez · '+nazwa(sel)+(sr!=null?' · TF-IDF średnio '+simPct(sr)+' ± '+simPct(sdv):'')+
    (pm?' · metody zgodne dla '+pm.zgodne+' z '+pm.n+' wydobytych':'');
  var h='<thead><tr><th scope="col">Orzeczenie</th><th scope="col">TF-IDF</th><th scope="col">EmbeddingGemma</th><th scope="col">ROUGE-L R</th><th scope="col">Walidacja</th><th scope="col">Teza wydobyta</th><th scope="col">Najbliższa teza z arkusza</th></tr></thead><tbody>';
  T.forEach(function(t){
    var w=t.w, ng=goldById(w.najblizsza_id||w.gold_id);
    h+='<tr class="click" tabindex="0" data-id="'+t.id+'"><td class="mono">'+esc(w.sygnatura)+'</td>'+
      '<td class="sim"><span class="simval">'+simPct(w.sim)+'</span>'+meter(w.sim,w.grupa)+'</td>'+
      '<td class="sim">'+(w.sim_emb!=null?'<span class="simval">'+simPct(w.sim_emb)+'</span>'+meter(w.sim_emb,w.grupa_emb,D.progi_emb):'–')+'</td>'+
      '<td class="sim">'+(w.sim_rouge!=null?'<span class="simval">'+simPct(w.sim_rouge)+'</span>'+meter(w.sim_rouge,w.grupa_rouge,D.progi_rouge):'–')+'</td>'+
      '<td><span class="tag '+(w.grupa==='C'?'n':w.grupa)+'">'+WAL[w.grupa]+'</span>'+(w.niepewne?'<br><small>niepewne</small>':'')+(rozbiezne(w)?'<br><small style="color:var(--unk)">metody rozbieżne</small>':'')+'</td>'+
      '<td class="t">'+esc(short(w.tekst,180))+'</td><td class="t gold">'+(ng?esc(short(ng.tekst,180)):'–')+'</td></tr>';
  });
  var tb=document.getElementById('cmp'); tb.innerHTML=h+'</tbody>';
  tb.querySelectorAll('tr.click').forEach(function(tr){
    function go(){ var id=tr.getAttribute('data-id'); showDetail(id); if(network){ network.selectNodes([id]); network.focus(id,{scale:1.1,animation:true}); }
      document.querySelector('.graph-card').scrollIntoView({behavior:'smooth',block:'center'}); }
    tr.addEventListener('click',go); tr.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} });
  });
}

/* ---------- lista do przejrzenia: potwierdzone spoza arkusza lub z niepewnym dopasowaniem ---------- */
function reviewList(){
  var items=potwierdzone().filter(function(t){return t.w.grupa==='C'||t.w.niepewne||rozbiezne(t.w);});
  var box=document.getElementById('review');
  document.getElementById('r-sub').textContent=items.length+' pozycji · '+nazwa(sel)+' · po przejrzeniu dopisz je do arkusza';
  if (!items.length){ box.innerHTML='<div class="empty">Brak – każda potwierdzona teza ma jednoznaczny odpowiednik w arkuszu.</div>'; return; }
  box.innerHTML=items.map(function(it){
    var w=it.w;
    return '<div class="review-item" tabindex="0" role="button" data-id="'+it.id+'"><span class="stripe '+w.grupa+'"></span>'+
      '<div class="meta"><span class="mono">'+esc(w.sygnatura)+'</span> · '+WAL[w.grupa]+(w.niepewne?' (niepewne, '+w.sim.toFixed(2)+')':'')+(rozbiezne(w)?' · metody podobieństwa rozbieżne':'')+'</div>'+
      '<div class="txt">'+esc(short(w.tekst,260))+'</div></div>';
  }).join('');
  box.querySelectorAll('.review-item').forEach(function(el){
    function go(){ var id=el.getAttribute('data-id'); showDetail(id); if(network){ network.selectNodes([id]); network.focus(id,{scale:1.1,animation:true}); }
      document.querySelector('.graph-card').scrollIntoView({behavior:'smooth',block:'center'}); }
    el.addEventListener('click',go); el.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} });
  });
}

function render(){
  MODELE.forEach(function(m){ document.getElementById('sw-'+m.replace(/\W/g,'_')).setAttribute('aria-pressed', m===sel); });
  document.documentElement.style.setProperty('--mk', kolorModelu(sel));
  document.getElementById('detail').hidden=true;
  metricsTable(); walidator(); buildGraph(); cmpTable(); reviewList();
}
document.getElementById('notes').innerHTML=
  '<b>Jak to działa.</b> Model wydobywa tezy z uzasadnienia prawnego, walidator (9 kryteriów) potwierdza lub odrzuca każdą z nich; graf pokazuje tylko potwierdzone. '+
  'Arkusz dobrych i złych tez służy wyłącznie do oceny: każdą tezę porównano z pozycjami arkusza dla tego samego orzeczenia (cosinus TF-IDF na n-gramach znakowych 3–5; '+
  '≥ '+D.progi.dopasowanie+' dopasowanie, '+D.progi.niepewny+'–'+D.progi.dopasowanie+' niepewne). Drugą opinię daje EmbeddingGemma 300M – podobieństwo znaczenia '+
  '(≥ '+D.progi_emb.dopasowanie+' dopasowanie, '+D.progi_emb.niepewny+'–'+D.progi_emb.dopasowanie+' niepewne); trzecią – ROUGE-L recall, czyli jaka część słów tezy z arkusza występuje w wydobytej w tej samej kolejności (≥ '+D.progi_rouge.dopasowanie+' dopasowanie, '+D.progi_rouge.niepewny+'–'+D.progi_rouge.dopasowanie+' niepewne; na słowach bez lematyzacji). '+
  'Wszystkie metody skalibrowane na arkuszu, rozbieżność którejkolwiek trafia do przejrzenia. ROUGE-1/2/L (P/R/F1) opisują jakość sformułowania. '+
  '<b>Zastrzeżenia.</b> Prompty ekstrakcji i walidatora dostrajano na tych samych 10 orzeczeniach – wyniki są optymistyczne; wiarygodny test wymaga nowych orzeczeń ocenionych przez prawnika. '+
  'Kompletność zakłada, że arkusz zawiera wszystkie dobre tezy danego orzeczenia. Wygenerowano '+esc(D.wygenerowano)+'.';
render();
if (window.matchMedia) try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', buildGraph); } catch(e) {}
new MutationObserver(buildGraph).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
})();
</script>
